<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fuel Protocol</title>
<meta name="theme-color" content="#F2F3F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C0E11" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<link rel="preload" href="/fonts/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Fuel">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%2300A66C'/%3E%3Cpath fill='%23fff' d='M13.2 3.5 5.8 13.4h4.7l-.9 7.1 7.6-9.9h-4.9l.9-7.1z'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' fill='%2300A66C'/%3E%3Cpath fill='%23fff' d='M13.2 3.5 5.8 13.4h4.7l-.9 7.1 7.6-9.9h-4.9l.9-7.1z'/%3E%3C/svg%3E">
<style>
@font-face{font-family:"Geist";src:url("/fonts/Geist-Variable.woff2") format("woff2");font-weight:100 900;font-style:normal;font-display:swap}
/* Design tokens. Radius rule: containers 20px, controls 12px, chips + tags full pill.
   Accent = green only (actions, progress, success). Macro colors are data, never decoration. */
:root{
  color-scheme:light dark;
  --bg:#F2F3F5; --card:#FFFFFF; --card2:#F6F7F9; --line:#E3E6EA; --line2:#ECEEF1;
  --ink:#0F1419; --sub:#4F5866; --faint:#6B7482;
  --green:#0B8A5E; --green2:#086B49; --greenSoft:#E2F3EB; --onAccent:#FFFFFF; --ring1:#14B47C; --ring2:#0B8A5E;
  --prot:#D9475A; --carb:#C98314; --fat:#4470E6; --water:#1593B4;
  --bad:#CC3A43; --badSoft:#FBEAEB; --amber:#A86A0B; --amberSoft:#FCF2E0;
  --chipOn:#0F1419; --chipOnInk:#FFFFFF;
  --r:20px; --r-sm:12px;
  --sh:0 1px 2px rgba(15,20,25,.04),0 8px 24px -14px rgba(15,20,25,.14);
  --glass:rgba(255,255,255,.82); --scrim:rgba(15,20,25,.40);
  --ease:cubic-bezier(.2,.8,.2,1);
}
/* theme: automatic follows the phone; Settings can force light or dark (data-theme on <html>) */
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;
  --bg:#0C0E11; --card:#15181D; --card2:#1B1F25; --line:#272C34; --line2:#1F242B;
  --ink:#ECEEF2; --sub:#AAB1BC; --faint:#8C95A2;
  --green:#34D399; --green2:#6EE7B7; --greenSoft:rgba(52,211,153,.13); --onAccent:#04140D; --ring1:#4ADEA5; --ring2:#21B57D;
  --prot:#F27A8A; --carb:#EDB24E; --fat:#7C9CF8; --water:#48C2DD;
  --bad:#F26B72; --badSoft:rgba(242,107,114,.13); --amber:#EDB24E; --amberSoft:rgba(237,178,78,.12);
  --chipOn:#ECEEF2; --chipOnInk:#0C0E11;
  --sh:0 0 0 1px var(--line);
  --glass:rgba(21,24,29,.84); --scrim:rgba(0,0,0,.58);
}}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#0C0E11; --card:#15181D; --card2:#1B1F25; --line:#272C34; --line2:#1F242B;
  --ink:#ECEEF2; --sub:#AAB1BC; --faint:#8C95A2;
  --green:#34D399; --green2:#6EE7B7; --greenSoft:rgba(52,211,153,.13); --onAccent:#04140D; --ring1:#4ADEA5; --ring2:#21B57D;
  --prot:#F27A8A; --carb:#EDB24E; --fat:#7C9CF8; --water:#48C2DD;
  --bad:#F26B72; --badSoft:rgba(242,107,114,.13); --amber:#EDB24E; --amberSoft:rgba(237,178,78,.12);
  --chipOn:#ECEEF2; --chipOnInk:#0C0E11;
  --sh:0 0 0 1px var(--line);
  --glass:rgba(21,24,29,.84); --scrim:rgba(0,0,0,.58);
}
:root[data-theme="light"]{color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:"Geist",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility}
/* #app is the ONLY scroller: the body never moves, so the tab bar never moves */
#app{position:fixed;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  padding-bottom:calc(var(--tbh,84px) + 28px)}
/* while typing on a phone the keyboard lifts fixed bars over the input, so hide the bar */
body.kb .tabbar,body.has-sheet .tabbar{display:none}
body.kb #app{padding-bottom:40vh}
.wrap{max-width:480px;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) 16px 8px}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;padding:0;font-size:inherit}
button:focus-visible,a:focus-visible,label:focus-visible{outline:2px solid var(--green);outline-offset:2px;border-radius:var(--r-sm)}
.ic{width:1.15em;height:1.15em;flex:0 0 auto;vertical-align:-.2em}
input,select{font-family:inherit;font-size:16px;color:var(--ink);background:var(--card);border:none;box-shadow:inset 0 0 0 1px var(--line);
  border-radius:var(--r-sm);padding:12px 13px;width:100%;transition:box-shadow .15s var(--ease)}
input::placeholder{color:var(--faint)}
input:focus,select:focus{outline:none;box-shadow:inset 0 0 0 2px var(--green)}
#hft,#hin{padding-left:11px;padding-right:26px;background-position:calc(100% - 15px) 52%,calc(100% - 10px) 52%}
select{appearance:none;-webkit-appearance:none;padding-right:34px;
  background-image:linear-gradient(45deg,transparent 50%,var(--faint) 50%),linear-gradient(135deg,var(--faint) 50%,transparent 50%);
  background-position:calc(100% - 18px) 52%,calc(100% - 13px) 52%;background-size:5px 5px;background-repeat:no-repeat}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:18px;margin-top:12px}
.eyebrow{font-size:13px;font-weight:600;color:var(--sub)}
.h1{font-size:26px;font-weight:700;letter-spacing:-.03em;line-height:1.15}
.sub{color:var(--sub);font-size:14px;line-height:1.45;text-wrap:pretty}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.top{display:flex;align-items:center;justify-content:space-between;padding:4px 2px 2px}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:17px;letter-spacing:-.02em}
.brand .b{width:26px;height:26px;border-radius:8px;background:var(--green);display:grid;place-items:center}
/* date nav */
.datenav{display:flex;align-items:center;gap:8px;margin-top:10px}
.datenav .dn,.top .dn{width:40px;height:40px;border-radius:var(--r-sm);background:var(--card)!important;border:none!important;box-shadow:var(--sh);display:grid;place-items:center;font-size:18px;color:var(--sub)}
.datenav .dt{flex:1;text-align:center;font-weight:650;font-size:16px}
.datenav .dt .sm{display:block;font-weight:500;font-size:12.5px;color:var(--sub)}
.todaychip{font-size:13px;font-weight:600;color:var(--green2);background:var(--greenSoft);border-radius:999px;padding:8px 13px}
.daytitle{font-size:30px;font-weight:700;letter-spacing:-.035em;display:flex;align-items:center;gap:6px}
.daytitle .caret{font-size:16px;color:var(--faint);display:grid}
/* calories + macros */
.calrow{display:flex;align-items:baseline;gap:8px;margin-top:8px}
.calbig{font-size:34px;font-weight:700;letter-spacing:-.04em;line-height:1}
.calof{font-size:15px;color:var(--sub);font-weight:500;flex:1}
.calleft{font-size:17px;font-weight:650;letter-spacing:-.02em}
.calleft small{font-size:13px;color:var(--sub);font-weight:500;margin-left:4px}
.calbar{height:8px;border-radius:999px;background:var(--line2);margin-top:14px;overflow:hidden}
.calbar i{display:block;height:100%;border-radius:999px;transition:width .5s var(--ease)}
.maccols{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:12px}
.maccols .mc .mn{font-size:13px;font-weight:600}
.maccols .mc .mvv{font-size:17px;font-weight:650;margin-top:3px;letter-spacing:-.02em}
.maccols .mc .mvv small{font-size:12.5px;color:var(--sub);font-weight:500}
.swapbtn{width:34px;height:34px;border-radius:var(--r-sm);background:var(--card2);color:var(--sub);font-size:16px;display:grid;place-items:center}
/* calendar sheet */
.calhd{display:flex;align-items:center;justify-content:space-between;margin:4px 2px 12px}
.calhd .cm{font-size:18px;font-weight:650;letter-spacing:-.02em}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.calgrid .cw{text-align:center;font-size:11.5px;font-weight:600;color:var(--sub);padding:5px 0}
.cd{aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-size:15px;font-weight:550;color:var(--ink);position:relative;transition:background .15s}
.cd.dim{color:var(--faint);font-weight:400}
.cd.tdy{box-shadow:inset 0 0 0 1.5px var(--green)}
.cd.cur{background:var(--green);color:var(--onAccent)}
.cd.has::after{content:"";position:absolute;bottom:4px;width:4px;height:4px;border-radius:2px;background:var(--green)}
.cd.cur.has::after{background:var(--onAccent)}
/* week strip */
.wkstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:14px}
.wk{display:flex;flex-direction:column;align-items:center;gap:5px;padding:9px 0 10px;border-radius:14px;background:var(--card);box-shadow:var(--sh);transition:transform .15s var(--ease)}
.wk span{font-size:12px;font-weight:600;color:var(--sub)}
.wk i{font-style:normal;width:22px;height:22px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--line);display:grid;place-items:center;font-size:12px;color:var(--faint)}
.wk.done i{background:var(--green);box-shadow:none;color:var(--onAccent)}
.wk.cur{background:var(--chipOn)}
.wk.cur span{color:var(--chipOnInk)}
.wk.cur i{box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--chipOnInk) 35%,transparent);color:var(--chipOnInk)}
.wk.cur.done i{background:var(--green);box-shadow:none;color:var(--onAccent)}
.trainchip{margin-top:12px;padding:10px 13px;border-radius:var(--r-sm);background:var(--greenSoft);color:var(--green2);font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:7px}
.trainchip.rest{background:var(--card2);color:var(--sub)}
.mealmac{display:flex;gap:12px;font-size:12.5px;font-weight:600;margin-top:4px}
/* ring summary */
.sumgrid{display:flex;gap:16px;align-items:center}
.ringwrap{position:relative;width:132px;height:132px;flex-shrink:0}
.ringwrap svg{transform:rotate(-90deg)}
.ringmid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ringmid .big{font-size:30px;font-weight:700;letter-spacing:-.03em;line-height:1}
.ringmid .lbl{font-size:12px;font-weight:500;color:var(--sub);margin-top:3px}
.macro{margin-top:9px}
.macro:first-child{margin-top:0}
.macro .mrow{display:flex;justify-content:space-between;font-size:13px;font-weight:600}
.macro .mrow .mv{color:var(--sub);font-weight:500}
.mbar{height:5px;border-radius:999px;background:var(--line2);margin-top:7px;overflow:hidden}
.mbar i{display:block;height:100%;border-radius:999px;transition:width .5s var(--ease)}
.sumfoot{display:flex;justify-content:space-between;margin-top:14px;padding-top:14px;border-top:1px solid var(--line2)}
.sumfoot .cell{text-align:center;flex:1}
.sumfoot .cell b{display:block;font-size:20px;font-weight:650;letter-spacing:-.02em}
.sumfoot .cell span{font-size:12px;color:var(--sub);font-weight:500}
/* meal cards */
.mealhd{display:flex;align-items:center;justify-content:space-between;gap:10px}
.mealhd .mt{font-weight:650;font-size:17px;letter-spacing:-.02em}
.mealhd .mcal{font-weight:600;font-size:14px;color:var(--sub);display:inline-flex;align-items:center;gap:5px}
.entry{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 0;position:relative;background:var(--card);transition:transform .16s var(--ease)}
.swipewrap{position:relative;overflow:hidden;transition:max-height .2s ease,opacity .2s ease}
.swipewrap + .swipewrap{border-top:1px solid var(--line2)}
.swipewrap.gone{opacity:0}
.swipebg{position:absolute;inset:0;background:var(--badSoft);color:var(--bad);display:flex;align-items:center;justify-content:flex-end;padding-right:16px;font-weight:600;font-size:13px;opacity:0;border-radius:var(--r-sm);transition:background .15s ease,color .15s ease}
.swipebg.armed{background:var(--bad);color:#fff}
.swipewrap.swiping .swipebg{opacity:1}
.entry .en{font-size:15px;font-weight:550;line-height:1.3}
.entry .ea{font-size:13px;color:var(--sub)}
.entry .ec{font-weight:650;font-size:15px;color:var(--ink)}
.entry .ep{font-size:12px;color:var(--sub);text-align:right}
.mealfoot{display:flex;gap:8px;margin-top:10px}
.addbtn{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px;border-radius:var(--r-sm);background:var(--greenSoft);color:var(--green2);font-weight:600;font-size:14.5px;transition:transform .12s var(--ease),filter .15s}
.copybtn{width:46px;display:grid;place-items:center;border-radius:var(--r-sm);background:var(--card2);color:var(--sub);font-size:18px}
.empty{color:var(--sub);font-size:14px;line-height:1.5;padding:8px 0 2px;text-wrap:pretty}
/* water */
.glasses{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.glass{width:36px;height:44px;border-radius:10px 10px 13px 13px;background:var(--card2);display:grid;place-items:center;font-size:17px;color:var(--line);transition:background .15s,color .15s,transform .12s var(--ease)}
.glass.fill{background:color-mix(in srgb,var(--water) 16%,transparent);color:var(--water)}
/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(18px);backdrop-filter:saturate(180%) blur(18px);
  box-shadow:0 -1px 0 var(--line);z-index:40}
.tabbar .in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.tb{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;border-radius:var(--r-sm);color:var(--faint);font-size:11px;font-weight:550;transition:color .15s}
.tb svg{width:24px;height:24px}
.tb.on{color:var(--green)}
.tb.on svg{transform:translateY(-1px)}
/* chips */
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:8px 13px;border-radius:999px;background:var(--card);box-shadow:inset 0 0 0 1px var(--line);font-weight:550;font-size:13px;color:var(--sub);transition:background .15s,color .15s}
.chip.on{background:var(--chipOn);box-shadow:none;color:var(--chipOnInk)}
.chip.grn{background:var(--greenSoft);box-shadow:none;color:var(--green2)}
.daygrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px}
.dg{padding:9px 2px;border-radius:10px;background:var(--card2);text-align:center;font-size:11.5px;font-weight:600;color:var(--sub)}
.dg b{display:block;font-size:10.5px;color:var(--faint);font-weight:500}
/* list rows */
.lrow{display:flex;align-items:center;gap:12px;padding:13px 0;border-top:1px solid var(--line2)}
.lrow:first-child{border-top:none}
.lrow .ln{font-weight:600;font-size:15px}
.lrow .ls,.ls{font-size:13px;color:var(--sub)}
/* buttons */
.pillbtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 15px;border-radius:var(--r-sm);font-weight:600;font-size:14px;background:var(--green);color:var(--onAccent);transition:transform .12s var(--ease),filter .15s}
.pillbtn.ghost{background:var(--card2);color:var(--ink)}
.pillbtn.danger{background:var(--badSoft);color:var(--bad)}
.bigbtn{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:14px;border-radius:14px;background:var(--green);color:var(--onAccent);font-weight:650;font-size:16px;letter-spacing:-.01em;margin-top:12px;transition:transform .12s var(--ease),filter .15s}
.bigbtn.ghost{background:var(--card);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.textbtn{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:14px;color:var(--sub);padding:8px 0}
.textbtn.danger{color:var(--bad)}
@media (hover:hover){.bigbtn:hover,.pillbtn:hover,.addbtn:hover{filter:brightness(1.05)}.chip:hover{color:var(--ink)}}
.bigbtn:active,.pillbtn:active,.addbtn:active,.chip:active,.res:active,.wk:active,.glass:active,.sb:active,.msbtn:active,.setck:active,.copybtn:active,.tl:active{transform:scale(.97)}
/* sheets */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:60;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s var(--ease)}
.sheet{width:100%;max-width:480px;background:var(--bg);border-radius:26px 26px 0 0;max-height:90vh;max-height:90dvh;display:flex;flex-direction:column;
  padding:8px 16px calc(16px + env(safe-area-inset-bottom));animation:rise .28s var(--ease);box-shadow:0 -12px 40px -20px rgba(0,0,0,.35)}
@keyframes rise{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet.szhalf{height:62vh}
.sheet.szfull{height:calc(100vh - 12px)}
@supports(height:100dvh){.sheet.szfull{height:calc(100dvh - 12px)}}
.sheet.snap{transition:height .22s ease}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}
.shead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.shead .st{font-size:19px;font-weight:700;letter-spacing:-.025em;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sx{width:34px;height:34px;flex:0 0 auto;border-radius:50%;background:var(--card2);color:var(--sub);font-size:16px;display:grid;place-items:center;box-shadow:inset 0 0 0 1px var(--line)}
.sbody{overflow:auto;flex:1;margin:0 -16px;padding:0 16px;overscroll-behavior:contain}
/* sticky action footer inside a sheet */
.sfoot{position:sticky;bottom:-1px;margin:14px -16px 0;padding:14px 16px 2px;background:linear-gradient(to bottom,transparent,var(--bg) 18px)}
.sfoot .bigbtn:first-child{margin-top:0}
.srchrow{display:flex;gap:8px}
.srchrow input{flex:1}
.scan{display:inline-flex;align-items:center;gap:6px;padding:0 16px;border-radius:var(--r-sm);background:var(--chipOn);color:var(--chipOnInk);font-weight:600;font-size:14px}
.res{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);box-shadow:var(--sh);border-radius:16px;padding:13px 14px;margin-top:8px;transition:transform .12s var(--ease)}
.res .rn{font-weight:600;font-size:15px;line-height:1.3}
.res .rs{font-size:12.5px;color:var(--sub);margin-top:1px}
.res .rm{font-size:13px;color:var(--sub);margin-top:2px}
.res .rc{font-weight:650;font-size:15px}
.srctag{font-size:10px;font-weight:650;letter-spacing:.02em;padding:2px 6px;border-radius:999px;margin-left:6px;vertical-align:2px}
.srctag.fs{background:color-mix(in srgb,var(--fat) 14%,transparent);color:var(--fat)}
.srctag.off{background:var(--amberSoft);color:var(--amber)}
.srctag.mine{background:var(--greenSoft);color:var(--green2)}
.reshd{font-size:13px;font-weight:600;color:var(--sub);margin:20px 2px 4px}
/* steppers */
.stepper{display:flex;align-items:center;gap:12px;justify-content:center}
.stepper .sb{width:46px;height:46px;border-radius:50%;background:var(--card);box-shadow:inset 0 0 0 1px var(--line);font-size:20px;color:var(--ink);display:grid;place-items:center;transition:transform .12s var(--ease)}
.stepper .sv{min-width:96px;text-align:center;font-size:21px;font-weight:650;letter-spacing:-.02em}
.pickmac{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.pickmac .pm{text-align:center;background:var(--card2);border-radius:var(--r-sm);padding:10px 4px}
.pickmac .pm b{display:block;font-size:18px;font-weight:650;letter-spacing:-.02em}
.pickmac .pm span{font-size:12px;color:var(--sub);font-weight:500}
.starbtn{display:flex;align-items:center;gap:7px;justify-content:center;width:100%;padding:12px;border-radius:var(--r-sm);background:var(--card);box-shadow:inset 0 0 0 1px var(--line);font-weight:600;font-size:14px;color:var(--sub);margin-top:10px;transition:transform .12s var(--ease)}
.starbtn.on{color:var(--amber);background:var(--amberSoft);box-shadow:none}
/* workout set rows: set number | reps stepper | load stepper | done */
.setrow{display:grid;grid-template-columns:20px 1fr 1fr 42px;align-items:center;gap:6px;padding:6px 0}
.setrow .sn{font-size:13px;font-weight:600;color:var(--faint);text-align:center}
.stp{display:flex;align-items:center;justify-content:space-between;background:var(--card2);border-radius:var(--r-sm);padding:3px;min-width:0}
.msbtn{width:30px;height:30px;border-radius:9px;background:var(--card);box-shadow:0 1px 2px rgba(15,20,25,.08);font-size:14px;color:var(--ink);display:grid;place-items:center;flex:0 0 auto;transition:transform .12s var(--ease)}
.setval{flex:1;text-align:center;font-weight:650;font-size:14px;white-space:nowrap;letter-spacing:-.01em}
.setval small{font-weight:500;color:var(--sub);font-size:11.5px;margin-left:2px}
.setck{width:42px;height:42px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--line);background:var(--card);color:var(--faint);font-size:18px;display:grid;place-items:center;transition:background .15s,color .15s,transform .12s var(--ease)}
.setck.on{background:var(--green);box-shadow:none;color:var(--onAccent)}
.exhd{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.exhd .mt{font-size:16px;font-weight:650;letter-spacing:-.015em;line-height:1.3}
.extarget{margin-top:4px;font-size:13px;font-weight:600;color:var(--green2)}
.exnote{margin-top:2px;font-size:13px;color:var(--sub);line-height:1.45}
.mtag{display:inline-block;padding:3px 9px;border-radius:999px;background:var(--card2);color:var(--sub);font-size:11.5px;font-weight:550;white-space:nowrap}
/* forms */
.frow{display:flex;gap:10px;margin-top:10px}
.frow>div{flex:1}
.flabel{font-size:13px;font-weight:600;color:var(--sub);margin:14px 2px 6px}
.fnote{font-size:13px;color:var(--sub);margin-top:10px;line-height:1.5;text-wrap:pretty}
.kv{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line2);font-size:15px}
.kv:first-child{border-top:none}
.kv b{font-weight:650}
.camv{width:100%;border-radius:16px;background:#0C0E11;max-height:230px;object-fit:cover;margin-top:10px}
.warn{background:var(--amberSoft);color:var(--amber);border-radius:var(--r-sm);padding:11px 13px;font-size:13.5px;font-weight:500;line-height:1.5;margin-top:10px}
.okline{background:var(--greenSoft);color:var(--green2);border-radius:var(--r-sm);padding:11px 13px;font-size:13.5px;font-weight:600;line-height:1.45;margin-top:10px}
.chartcard svg{display:block;width:100%}
.chartcard text{font-family:"Geist",system-ui,sans-serif}
textarea{width:100%;min-height:110px;font-family:ui-monospace,Menlo,monospace;font-size:11px;border:none;box-shadow:inset 0 0 0 1px var(--line);border-radius:var(--r-sm);padding:10px;background:var(--card);color:var(--ink)}
/* undo toast */
#toast{position:fixed;left:50%;transform:translateX(-50%) translateY(16px);bottom:calc(var(--tbh,84px) + 12px);
  background:var(--chipOn);color:var(--chipOnInk);border-radius:999px;padding:11px 10px 11px 18px;display:flex;align-items:center;gap:10px;
  font-size:14px;font-weight:550;box-shadow:0 12px 32px -10px rgba(0,0,0,.4);opacity:0;pointer-events:none;
  transition:opacity .2s ease,transform .25s var(--ease);z-index:70;max-width:94vw}
#toast.show{opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(0)}
#toast .tmsg{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:62vw}
#toast button{color:var(--ring1);font-weight:650;font-size:14px;padding:4px 10px}
/* timelines (plans, programs) */
.tl{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px 0;border-top:1px solid var(--line2);transition:transform .12s var(--ease)}
.tl:first-of-type{border-top:none}
.tl .ln{font-weight:600;font-size:15.5px;letter-spacing:-.01em}
.tl .ls{font-size:13px;color:var(--sub)}
.tl .chev{color:var(--faint);font-size:16px;display:grid;transition:transform .2s var(--ease)}
.tlfood{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 0 10px 4px;font-size:14px;border-top:1px solid var(--line2)}
.tlmeal{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:left;padding:12px 0 6px;font-weight:650;font-size:14px}
.cbx{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:6px;box-shadow:inset 0 0 0 1.5px var(--line);color:transparent;font-size:13px;margin-right:8px;vertical-align:-4px}
.cbx.on{background:var(--green);box-shadow:none;color:var(--onAccent)}
/* program blocks */
.blk{background:var(--card);border-radius:18px;box-shadow:var(--sh);margin-top:10px;overflow:hidden}
.blk>.tl{padding:14px 16px;border-top:none}
.blk .ses{padding:2px 16px 12px;border-top:1px solid var(--line2)}
.blk .ses .sh{display:flex;justify-content:space-between;align-items:baseline;padding:12px 0 4px;font-weight:650;font-size:14.5px}
.blk .exr{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:8px 0;border-top:1px solid var(--line2)}
.blk .exr:first-of-type{border-top:none}
.blk .exr .en{font-size:14px;font-weight:550}
.blk .exr .sr{font-size:14px;font-weight:650;text-align:right;font-variant-numeric:tabular-nums}
.blk .exr .et{grid-column:1/-1;font-size:12.5px;color:var(--sub)}
.tag{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:600;background:var(--card2);color:var(--sub);margin-left:6px;vertical-align:1px}
.tag.now{background:var(--greenSoft);color:var(--green2)}
.tag.deload{background:var(--amberSoft);color:var(--amber)}
.stats{display:flex;gap:8px;margin-top:12px}
.stats>div{flex:1;background:var(--card);box-shadow:var(--sh);border-radius:16px;padding:11px 12px}
.stats b{display:block;font-size:22px;font-weight:700;letter-spacing:-.03em;line-height:1.1}
.stats span{font-size:12.5px;color:var(--sub);font-weight:500}
.wkdots{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.pact{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.pact .pillbtn{flex:1;min-width:0;white-space:nowrap;font-size:13.5px;padding:10px 8px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

/* ================= storage =================
   One JSON blob per user. Local copy in localStorage (instant + offline),
   server copy in D1 via /api/state. Newer updatedAt wins on load. */
var LS=null; /* set after sign-in: fuelprotocol:v5:<uid> */
function freshDB(){return{
  profile:{sex:"m",age:34,heightIn:70,weightLb:180,activity:1.55,goalRate:1,calMode:"auto",calCustom:2300,
           macroMode:"g",pT:180,cT:250,fT:65,pP:32,cP:44,fP:24,waterGoal:8},
  log:{},favs:[],custom:[],recipes:[],plans:[],applies:[],recents:[],freq:{},
  gym:{week:{},routines:[],logs:{},prs:{},programs:[],active:null},updatedAt:0
};}
var DB=freshDB();
function normalize(){
  if(!DB.profile)DB.profile=freshDB().profile;
  if(!DB.profile.burns)DB.profile.burns=[0,0,0,0,0,0,0];
  if(DB.profile.shiftRest==null)DB.profile.shiftRest=0;
  if(!DB.profile.macroView)DB.profile.macroView="g";
  if(!DB.profile.theme)DB.profile.theme="auto";
  if(!DB.updatedAt)DB.updatedAt=0;
  ["log","freq"].forEach(function(k){if(!DB[k])DB[k]={};});
  ["favs","custom","recipes","plans","applies","recents"].forEach(function(k){if(!DB[k])DB[k]=[];});
  if(!DB.gym)DB.gym={week:{},routines:[],logs:{},prs:{}};
  ["routines","programs"].forEach(function(k){if(!DB.gym[k])DB.gym[k]=[];});
  ["week","logs","prs"].forEach(function(k){if(!DB.gym[k])DB.gym[k]={};});
  if(DB.gym.active===undefined)DB.gym.active=null;
  /* v5.1: single daily weight became timestamped weigh-ins */
  Object.keys(DB.log||{}).forEach(function(ds){var d=DB.log[ds];if(!d)return;
    if(d.weight!=null&&!(d.weights&&d.weights.length))d.weights=[{t:noonOf(ds),w:d.weight}];
    if(d.weight!==undefined)delete d.weight;});
}
function adopt(o){var f=freshDB();Object.keys(f).forEach(function(k){DB[k]=(o&&o[k]!=null)?o[k]:f[k];});normalize();}
function loadLocal(){
  try{
    var raw=LS&&localStorage.getItem(LS);
    if(raw){adopt(JSON.parse(raw));return true;}
    /* one-time lift of the old single-user data on this device */
    var old=localStorage.getItem("fuelprotocol:v4");
    if(old&&!localStorage.getItem("fuelprotocol:migrated")){
      adopt(JSON.parse(old));DB.updatedAt=Date.now();
      localStorage.setItem("fuelprotocol:migrated","1");
      return true;
    }
  }catch(e){}
  normalize();return false;
}
function save(){
  DB.updatedAt=Date.now();
  try{if(LS)localStorage.setItem(LS,JSON.stringify(DB));}catch(e){}
  schedulePush();
}

/* ================= account + sync ================= */
var AUTH={state:"loading",email:"",uid:"",sent:false,busy:false,err:"",sync:"idle",devLink:""};
var pushTimer=null,pushing=false,pushAgain=false;
function api(path,opts){opts=opts||{};opts.credentials="same-origin";return fetch(API_BASE+path,opts);}
function schedulePush(){
  if(AUTH.state!=="in")return;
  AUTH.sync="pending";paintSync();
  clearTimeout(pushTimer);pushTimer=setTimeout(pushState,1800);
}
function pushState(){
  if(AUTH.state!=="in")return;
  if(pushing){pushAgain=true;return;}
  pushing=true;AUTH.sync="saving";paintSync();
  api("/api/state",{method:"PUT",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({state:DB,updatedAt:DB.updatedAt})})
   .then(function(r){AUTH.sync=r.ok?"saved":"error";})
   .catch(function(){AUTH.sync="offline";})
   .then(function(){pushing=false;paintSync();if(pushAgain){pushAgain=false;schedulePush();}});
}
function syncLabel(){
  return{idle:"",pending:"Saving\u2026",saving:"Saving\u2026",saved:"All changes saved",
    error:"Couldn\u2019t save to your account. Will retry",offline:"Offline. Saved on this device"}[AUTH.sync]||"";
}
function paintSync(){var el=document.getElementById("syncdot");if(!el)return;
  el.textContent=syncLabel();
  el.style.color=AUTH.sync==="error"?"var(--bad)":(AUTH.sync==="offline"?"var(--amber)":"var(--faint)");}
function pullState(){
  return api("/api/state").then(function(r){return r.ok?r.json():null;}).then(function(d){
    if(!d)return;
    var srv=d.state,su=d.updatedAt||0;
    if(srv&&su>(DB.updatedAt||0)){
      adopt(srv);DB.updatedAt=su;
      try{if(LS)localStorage.setItem(LS,JSON.stringify(DB));}catch(e){}
      AUTH.sync="saved";
    }else if((DB.updatedAt||0)>su){pushState();}
    else{AUTH.sync="saved";}
  }).catch(function(){AUTH.sync="offline";});
}
function boot(){
  if(location.search.indexOf("signedin")>=0)try{history.replaceState({},"",location.pathname);}catch(e){}
  api("/api/me").then(function(r){return r.ok?r.json():null;}).then(function(d){
    if(d&&d.uid){
      AUTH.state="in";AUTH.uid=d.uid;AUTH.email=d.email||"";
      try{localStorage.setItem("fuelprotocol:lastuid",d.uid);localStorage.setItem("fuelprotocol:lastemail",AUTH.email);}catch(e){}
      LS="fuelprotocol:v5:"+d.uid;loadLocal();render();
      return pullState().then(render);
    }
    AUTH.state="out";render();
  }).catch(function(){
    var lu=null,le="";try{lu=localStorage.getItem("fuelprotocol:lastuid");le=localStorage.getItem("fuelprotocol:lastemail")||"";}catch(e){}
    if(lu){AUTH.state="in";AUTH.uid=lu;AUTH.email=le;AUTH.sync="offline";LS="fuelprotocol:v5:"+lu;loadLocal();}
    else AUTH.state="out";
    render();
  });
}
function sendLink(){
  var el=document.getElementById("authmail");
  var mail=((el&&el.value)||"").trim();
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(mail)){AUTH.err="Enter a valid email address.";render();return;}
  AUTH.email=mail;AUTH.err="";AUTH.busy=true;render();
  api("/api/auth/request",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:mail})})
   .then(function(r){return r.json().then(function(j){return{ok:r.ok,j:j};});})
   .then(function(res){
     AUTH.busy=false;
     if(res.ok){AUTH.sent=true;AUTH.devLink=res.j.devLink||"";}
     else AUTH.err=res.j.error==="rate"?"A link was just sent. Check your email or wait a minute.":"Couldn\u2019t send the link. Try again.";
     render();
   }).catch(function(){AUTH.busy=false;AUTH.err="No connection. Try again when you\u2019re back online.";render();});
}

/* ================= helpers ================= */
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");}
function todayStr(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function dateAdd(ds,n){var p=ds.split("-");var d=new Date(+p[0],+p[1]-1,+p[2]);d.setDate(d.getDate()+n);
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function fmtDate(ds){var p=ds.split("-");var d=new Date(+p[0],+p[1]-1,+p[2]);
  var wd=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"][d.getDay()];
  var mo=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][d.getMonth()];
  return {wd:wd,md:mo+" "+d.getDate()};}
function noonOf(ds){var p=ds.split("-");return new Date(+p[0],+p[1]-1,+p[2],12,0,0).getTime();}
function fmtTime(t){var d=new Date(t),h=d.getHours(),m=String(d.getMinutes()).padStart(2,"0"),ap=h>=12?"PM":"AM";h=h%12;if(!h)h=12;return h+":"+m+" "+ap;}
function day(ds){if(!DB.log[ds])DB.log[ds]={meals:{bf:[],lu:[],di:[],sn:[]},water:0,weights:[]};
  var d=DB.log[ds];if(!d.meals)d.meals={bf:[],lu:[],di:[],sn:[]};if(!d.weights)d.weights=[];return d;}
function scaledE(e){var s=e.amt/e.base;return{cal:e.cal*s,p:e.p*s,c:e.c*s,f:e.f*s};}
function mealTotal(list){var t={cal:0,p:0,c:0,f:0};(list||[]).forEach(function(e){var m=scaledE(e);t.cal+=m.cal;t.p+=m.p;t.c+=m.c;t.f+=m.f;});return t;}
function dayTotal(d){var t={cal:0,p:0,c:0,f:0};["bf","lu","di","sn"].forEach(function(m){var mt=mealTotal(d.meals[m]);t.cal+=mt.cal;t.p+=mt.p;t.c+=mt.c;t.f+=mt.f;});return t;}
function fmtAmt(e){var a=e.amt;if(e.unit==="g")return a+" g";if(e.unit==="x")return a+"\u00d7";
  return a+" "+e.unit+(a!==1&&"g,oz,tbsp".indexOf(e.unit)<0&&!/s$/.test(e.unit)?"s":"");}
function kcal(n){return Math.ceil(n).toLocaleString();}
var MEALS={bf:"Breakfast",lu:"Lunch",di:"Dinner",sn:"Snacks"};

/* targets */
function bmr(){var P=DB.profile,kg=P.weightLb*0.45359,cm=P.heightIn*2.54;
  return Math.round(10*kg+6.25*cm-5*P.age+(P.sex==="m"?5:-161));}
function tdee(){return Math.round(bmr()*DB.profile.activity);}
function calTarget(){var P=DB.profile;
  if(P.calMode==="custom")return P.calCustom;
  return Math.max(1200,Math.round(tdee()-P.goalRate*500));}
function targets(){var P=DB.profile,cal=calTarget();
  if(P.macroMode==="pct"){return{cal:cal,p:Math.round(cal*P.pP/100/4),c:Math.round(cal*P.cP/100/4),f:Math.round(cal*P.fP/100/9)};}
  return{cal:cal,p:P.pT,c:P.cT,f:P.fT};}

/* training-day cycling: each training day earns its burn back (keeps the weekly
   loss rate exact); optionally shift extra calories from rest days to training days. */
function wdOf(ds){var p=ds.split("-");return new Date(+p[0],+p[1]-1,+p[2]).getDay();}
function burnStats(){var b=DB.profile.burns||[],tot=0,k=0;
  for(var i=0;i<7;i++){if(b[i]>0){tot+=b[i];k++;}}
  return{tot:tot,k:k};}
function dayTargetWd(wd){
  var T=targets(),P=DB.profile,b=P.burns||[],st=burnStats();
  if(!st.k)return{cal:T.cal,p:T.p,c:T.c,f:T.f,burn:0,base:T.cal};
  var s=P.shiftRest||0,burn=b[wd]||0;
  var cal=Math.round(T.cal+(burn>0?burn+s*(7-st.k)/st.k:-s));
  var c=Math.max(0,Math.round(T.c+(cal-T.cal)/4));
  return{cal:cal,p:T.p,c:c,f:T.f,burn:burn,base:T.cal};
}
function dayTarget(ds){return dayTargetWd(wdOf(ds));}

/* entries */
function defToEntry(def,amt){return{id:uid(),name:def.name||def.n,unit:def.unit,step:def.step,base:def.base,
  amt:amt!=null?amt:def.base,cal:def.cal,p:def.p,c:def.c,f:def.f,src:def.src||"lib",fsid:def.fsid||null};}
function foodKey(d){return (d.name||d.n)+"|"+(d.fsid||d.src||"lib");}
function isFav(d){var k=foodKey(d);return DB.favs.some(function(f){return foodKey(f)===k;});}
function toggleFav(d){var k=foodKey(d);
  if(isFav(d)){DB.favs=DB.favs.filter(function(f){return foodKey(f)!==k;});}
  else{DB.favs.unshift({name:d.name||d.n,unit:d.unit,step:d.step,base:d.base,cal:d.cal,p:d.p,c:d.c,f:d.f,src:d.src||"lib",fsid:d.fsid||null});}
  save();}
function noteUse(d){var k=foodKey(d);DB.freq[k]=(DB.freq[k]||0)+1;
  var clean={name:d.name||d.n,unit:d.unit,step:d.step,base:d.base,cal:d.cal,p:d.p,c:d.c,f:d.f,src:d.src||"lib",fsid:d.fsid||null,brand:d.brand||""};
  DB.recents=DB.recents.filter(function(r){return foodKey(r)!==k;});
  DB.recents.unshift(clean);if(DB.recents.length>30)DB.recents=DB.recents.slice(0,30);}

/* built-in plan */
function builtinPlan(){
  var days=[];
  for(var w=0;w<3;w++){DAYNAMES.forEach(function(dn){
    var spec=ROT[w][dn];
    var mk=function(keys){return keys.map(function(k){return defToEntry(Object.assign({name:FOODS[k].n},FOODS[k]));});};
    days.push({name:"W"+(w+1)+" "+dn,meals:{
      bf:mk(["eggwhites","wholeegg","ffcheese","cbacon","oats"]),
      lu:mk(spec[0]),di:mk(spec[1]),
      sn:mk(["scoop","yogurt","blueberries","treat"])}});
  });}
  return{id:"builtin",name:"3-Week Cut",builtin:true,days:days};
}
var BUILTIN=builtinPlan();
function planTotals(pd){var t={cal:0,p:0,c:0,f:0};["bf","lu","di","sn"].forEach(function(m){var mt=mealTotal(pd.meals[m]);t.cal+=mt.cal;t.p+=mt.p;t.c+=mt.c;t.f+=mt.f;});return t;}
function planById(pid){return pid==="builtin"?BUILTIN:DB.plans.filter(function(p){return p.id===pid;})[0];}
function cloneEntry(e){var c=JSON.parse(JSON.stringify(e));c.id=uid();delete c.ap;return c;}
function planApplies(){if(!DB.applies)DB.applies=[];return DB.applies;}
/* remove everything a plan application logged — one date, or every date */
function apRemove(apId,onlyDate){
  var items=[];
  (onlyDate?[onlyDate]:Object.keys(DB.log)).forEach(function(ds){var d=DB.log[ds];if(!d||!d.meals)return;
    ["bf","lu","di","sn"].forEach(function(m){
      (d.meals[m]||[]).forEach(function(e,i){if(e.ap===apId)items.push({date:ds,meal:m,entry:e,index:i});});
      d.meals[m]=(d.meals[m]||[]).filter(function(e){return e.ap!==apId;});
    });});
  var left=0;Object.keys(DB.log).forEach(function(ds){var d=DB.log[ds];if(!d||!d.meals)return;
    ["bf","lu","di","sn"].forEach(function(m){(d.meals[m]||[]).forEach(function(e){if(e.ap===apId)left++;});});});
  if(!left)DB.applies=planApplies().filter(function(a){return a.id!==apId;});
  return items;
}
/* what a plan IS, computed from its actual food */
function planProfile(pl){
  var n=pl.days.length||1,s={cal:0,p:0,c:0,f:0};
  pl.days.forEach(function(pd){var t=planTotals(pd);s.cal+=t.cal;s.p+=t.p;s.c+=t.c;s.f+=t.f;});
  var avg={cal:Math.round(s.cal/n),p:Math.round(s.p/n),c:Math.round(s.c/n),f:Math.round(s.f/n)};
  var pctP=avg.cal?Math.round(avg.p*4/avg.cal*100):0,pctC=avg.cal?Math.round(avg.c*4/avg.cal*100):0,pctF=avg.cal?Math.round(avg.f*9/avg.cal*100):0;
  var tuned=Math.max(5,Math.round(avg.p/0.9/5)*5);
  var lvl=pctP>=30?"High protein":(pctP>=20?"Moderate protein":"Low protein");
  var carb=pctC<30?"Lower carb":(pctC>50?"High carb":"Balanced carbs");
  return{n:n,avg:avg,pctP:pctP,pctC:pctC,pctF:pctF,tuned:tuned,lvl:lvl,carb:carb};
}
/* the plan explained in sentences, judged against THIS user's numbers */
function planReview(pl){
  var pr=planProfile(pl),td=tdee(),diff=td-pr.avg.cal,me=DB.profile.weightLb,out=[];
  out.push(pr.n+" day"+(pr.n===1?"":"s")+" · averages "+pr.avg.cal.toLocaleString()+" cal: "+pr.avg.p+" g protein ("+pr.pctP+"%), "+pr.avg.c+" g carbs ("+pr.pctC+"%), "+pr.avg.f+" g fat ("+pr.pctF+"%).");
  if(diff>150)out.push("For you that’s roughly a "+(Math.round(diff/50)*50).toLocaleString()+" cal/day deficit against your ~"+td.toLocaleString()+" cal maintenance, about "+(Math.round(diff*7/3500*4)/4)+" lb/week of loss.");
  else if(diff<-150)out.push("For you that runs ~"+Math.abs(Math.round(diff/50)*50).toLocaleString()+" cal/day above your ~"+td.toLocaleString()+" cal maintenance. Built for gaining, not cutting.");
  else out.push("That sits right at your ~"+td.toLocaleString()+" cal maintenance. Hold weight while you train.");
  out.push("Protein is sized for a ~"+pr.tuned+" lb body at 0.9 g/lb"+(me?(Math.abs(pr.tuned-me)<=15?", a good match for your "+me+" lb.":" (you’re at "+me+" lb, so your number would be ~"+Math.round(me*0.9)+" g).")
    :"."));
  out.push(pr.lvl+" protects muscle in a deficit · "+pr.carb.toLowerCase()+" (~"+pr.avg.c+" g) fuels training · fat near "+pr.avg.f+" g supports hormones.");
  return out;
}

   '</svg>';

function barChart(vals,labels,target,tgts){
  var W=420,H=150,pad=8,bw=Math.floor((W-pad*2)/vals.length)-6;
  var max=Math.max(target*1.25,1);vals.forEach(function(v){if(v>max)max=v;});
  var ty=H-18-((target/max)*(H-30));
  var s='<svg viewBox="0 0 '+W+' '+H+'">';
  s+='<line x1="'+pad+'" y1="'+ty+'" x2="'+(W-pad)+'" y2="'+ty+'" stroke="var(--faint)" stroke-dasharray="4 4" stroke-width="1"/>';
  vals.forEach(function(v,i){
    var h=(v/max)*(H-30),x=pad+i*(bw+6),y=H-18-h;
    var dayTgt=(tgts&&tgts[i])||target;
    var col=v===0?"var(--line2)":(v>dayTgt?"var(--bad)":"var(--green)");
    s+='<rect x="'+x+'" y="'+y+'" width="'+bw+'" height="'+Math.max(h,2)+'" rx="4" fill="'+col+'" opacity="'+(v===0?'1':'.9')+'"/>';
    if(labels[i])s+='<text x="'+(x+bw/2)+'" y="'+(H-5)+'" font-size="9" fill="var(--faint)" text-anchor="middle">'+labels[i]+'</text>';
  });
  s+='</svg>';return s;
}
function lineChart(pts){
  if(pts.length===1)return '<div class="okline num">Logged: '+pts[0].v+' lb. Log tomorrow\u2019s weight to start the trend line.</div>';
  if(pts.length<2)return '<div class="fnote">The trend line starts at two logged weights.</div>';
  var W=420,H=150,pad=26;
  var vals=pts.map(function(p){return p.v;});
  var min=Math.min.apply(null,vals)-1,max=Math.max.apply(null,vals)+1;
  var X=function(i){return pad+ i*(W-pad-10)/(pts.length-1);};
  var Y=function(v){return 12+(1-(v-min)/(max-min))*(H-40);};
  var dstr=pts.map(function(p,i){return (i?"L":"M")+X(i).toFixed(1)+" "+Y(p.v).toFixed(1);}).join(" ");
  var s='<svg viewBox="0 0 '+W+' '+H+'">';
  s+='<text x="2" y="'+(Y(max-1)+4)+'" font-size="10" fill="var(--faint)">'+Math.round(max-1)+'</text>';
  s+='<text x="2" y="'+(Y(min+1)+4)+'" font-size="10" fill="var(--faint)">'+Math.round(min+1)+'</text>';
  s+='<path d="'+dstr+'" fill="none" stroke="url(#lg)" stroke-width="3" stroke-linecap="round"/>';
  s+='<defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" style="stop-color:var(--ring1)"/><stop offset="1" style="stop-color:var(--ring2)"/></linearGradient></defs>';
  pts.forEach(function(p,i){s+='<circle cx="'+X(i)+'" cy="'+Y(p.v)+'" r="3.5" fill="var(--card)" stroke="var(--green)" stroke-width="2"/>';});
  var lastP=pts[pts.length-1];
  s+='<text x="'+(W-8)+'" y="'+(Y(lastP.v)-8)+'" font-size="11" font-weight="700" fill="var(--ink)" text-anchor="end">'+lastP.v+' lb</text>';
  s+='</svg>';return s;
}

  var keys=Object.keys(DB.gym.logs).sort().reverse();
  for(var i=0;i<keys.length;i++){var lg=DB.gym.logs[keys[i]];
    for(var j=0;j<(lg.ex||[]).length;j++){if(lg.ex[j].n===name&&lg.ex[j].sets.length)return lg.ex[j].sets;}}
  return null;
}
function gymVol(log){var v=0,s=0;(log.ex||[]).forEach(function(ex){ex.sets.forEach(function(x){if(x.done){s++;v+=x.reps*(x.lb||0);}});});return{sets:s,vol:v};}
function fmtVol(v){return v>=1000?(Math.round(v/100)/10)+"k":String(Math.round(v));}
function gymRoutineById(rid){var rt=null;DB.gym.routines.forEach(function(r){if(r.id===rid)rt=r;});return rt;}
/* ---- programs: multi-week plans run session by session, in order ----
   active = {pid, w (week index), done:{"w|s":date}, started, hist[]}.
   Missed days never break it: the next session is simply the first one
   not done in the current week. */
function progById(pid){var r=null;DB.gym.programs.forEach(function(p){if(p.id===pid)r=p;});return r;}
function progState(){
  var a=DB.gym.active,p=a&&progById(a.pid);
  if(!p)return null;
  if(a.w>=p.weeks.length)return{a:a,p:p,complete:true};
  var wk=p.weeks[a.w],n=wk.sessions.length,done=0,next=-1;
  wk.sessions.forEach(function(s,si){if(a.done[a.w+"|"+si])done++;else if(next<0)next=si;});
  return{a:a,p:p,wk:wk,done:done,n:n,next:next,weekDone:done>=n};
}
function weekName(w,i){var base="Week "+(i+1),lab=String(w.label||"").replace(/\s*weeks?\s*\d+(\s*(-|to)\s*\d+)?\s*$/i,"").trim();
  var rest=lab.replace(/^weeks?\s*\d+(\s*(-|to)\s*\d+)?\s*[-:·]?\s*/i,"").trim();
  if(!lab||/^weeks?\s*\d+/i.test(lab))return base+(rest?" · "+rest:"");
  return base+" · "+lab;}
/* every program move is one undo away */
function progChange(msg,fn){
  var snap=JSON.stringify(DB.gym.active);fn();
  var a=DB.gym.active;if(a){if(!a.hist)a.hist=[];if(a.hist.length>50)a.hist=a.hist.slice(-50);}
  save();render();showUndo(msg,[]);UNDO.gym=snap;

/* open (or create) the day's workout log. src: "prog" (session s of the active
   program's current week), "routine" (today's weekday routine), or auto */
function gymOpenLog(ds,src,s){
  var g=DB.gym,log=g.logs[ds];
  if(!log){
    var ps=progState();
    if(!src)src=(ps&&!ps.complete&&!ps.weekDone)?"prog":"routine";
    if(src==="prog"&&ps&&!ps.complete){
      var si=(s>=0&&s<ps.wk.sessions.length)?s:ps.next,ses=ps.wk.sessions[si];
      if(!ses)return;
      log={rid:null,prog:{pid:ps.p.id,w:ps.a.w,s:si},name:ses.name+" · Week "+(ps.a.w+1),ex:[],t0:Date.now(),t1:0};
      ses.ex.forEach(function(e){
        var last=lastSets(e.n),sets=[];
        for(var i=0;i<(e.sets||3);i++){var ls=last&&last[Math.min(i,last.length-1)];
          sets.push({reps:e.reps||10,lb:e.lb>0?e.lb:(ls?(ls.lb||0):0),done:false});}
        log.ex.push({n:e.n,m:e.m,sets:sets,target:e.target||"",rest:e.rest||0,notes:e.notes||""});
      });
    }else{
      var rt=gymRoutineById(g.week[String(wdOf(ds))]);
      log={rid:rt?rt.id:null,name:rt?rt.name:"Workout",ex:[],t0:Date.now(),t1:0};
      (rt?rt.ex:[]).forEach(function(e){
        var last=lastSets(e.n),sets=[],n=e.sets||3;
        for(var i=0;i<n;i++){var ls=last&&last[Math.min(i,last.length-1)];
          sets.push({reps:(ls?ls.reps:e.reps)||10,lb:ls?(ls.lb||0):(e.lb||0),done:false});}
        log.ex.push({n:e.n,m:e.m,sets:sets});
      });
    }
    g.logs[ds]=log;save();
  }
  V.sheet={kind:"gymlog",ds:ds};render();
}
/* group consecutive identical weeks ("Week 1-2" blocks) into one row each */
function weekBlocks(weeks){
  var out=[];
  weeks.forEach(function(w,i){
    var last=out[out.length-1];
    if(last&&last.label===w.label&&last.deload===w.deload&&JSON.stringify(last.w.sessions)===JSON.stringify(w.sessions)){last.b=i;return;}
    out.push({a:i,b:i,label:w.label||"",deload:!!w.deload,repeated:!!w.repeated,w:w});
  });
  return out;
}
function blockTitle(bk){
  var range=bk.a===bk.b?"Week "+(bk.a+1):"Weeks "+(bk.a+1)+"-"+(bk.b+1);
  var base=bk.label.replace(/\s*weeks?\s*\d+(\s*(-|to)\s*\d+)?\s*$/i,"").trim();
  var rest=base.replace(/^weeks?\s*\d+(\s*(-|to)\s*\d+)?\s*[-:·]?\s*/i,"").trim();
  if(/^deload$/i.test(rest))rest="";
  if(!base||/^weeks?\s*\d+/i.test(base))return{title:range+(rest?" · "+rest:""),range:""};
  return{title:base,range:range};
}
function restText(e){return e.rest&&!/rest/i.test(e.target||"")?"rest "+fmtRest(e.rest):"";}
/* the sets × reps column already shows "4 × 8"; keep only what it doesn't (a rep range, RIR, %1RM) */
function targetText(e){
  var t=String(e.target||""),m=/^(\d+)\s*[×x]\s*(\d+(?:\s*-\s*\d+)?)\s*(?:reps?)?\s*(?:·|,)?\s*/i.exec(t);
  if(m&&+m[1]===+e.sets)t=(/-/.test(m[2])?m[2].replace(/\s+/g,"")+" reps · ":"")+t.slice(m[0].length);
  return t.replace(/\s*·\s*$/,"");
}

/* program JSON from the server (PDF import or a code) is coerced field by field
   before it becomes part of the diary */
function programDraftFrom(p){
  p=p||{};
  var S=function(v,n){return String(v==null?"":v).trim().slice(0,n);};
  var N=function(v,lo,hi,d){v=Math.round(+v);return isFinite(v)?Math.min(hi,Math.max(lo,v)):d;};
  var A=function(v){return Array.isArray(v)?v:[];};
  var weeks=A(p.weeks).slice(0,26).map(function(w){w=w||{};return{label:S(w.label,40),deload:w.deload===true,repeated:w.repeated===true,
    sessions:A(w.sessions).slice(0,7).map(function(s,si){s=s||{};return{name:S(s.name,40)||"Day "+(si+1),days:[],
      ex:A(s.exercises).slice(0,15).map(function(e){e=e||{};return{n:S(e.name,80),m:S(e.muscle,20)||"other",
        sets:N(e.sets,1,10,3),reps:N(e.reps,1,100,10),lb:N(e.lb,0,1500,0),target:S(e.target,80),rest:N(e.rest,0,900,0),notes:S(e.notes,140)};})
        .filter(function(e){return e.n;})};}).filter(function(s){return s.ex.length;})};}).filter(function(w){return w.sessions.length;});
  if(!weeks.length)return null;
  return{id:uid(),name:S(p.program,80)||"Imported program",notes:S(p.notes,500),padded:p.padded===true,src:"pdf",at:Date.now(),weeks:weeks};
}
function progCodeImport(){
  var box=document.getElementById("progcode");
  var code=((box&&box.value)||"").toUpperCase().replace(/[^A-Z2-9]/g,"");
  if(code.length!==8){V.gymMsg={t:"err",m:"Codes are 8 characters. Check it and try again."};render();return;}
  V.gymMsg={t:"ok",m:"Opening…"};render();
  api("/api/plan/shared?code="+code)
   .then(function(r){return r.json().then(function(j){return{ok:r.ok,j:j};});})
   .then(function(res){
     var pl=res.ok&&res.j.plan,d=pl&&pl.kind==="program"?programDraftFrom(pl.program):null;
     if(!d){V.gymMsg={t:"err",m:res.ok?"That code isn’t a workout program. Meal plan codes go in Plans → Import.":"No program found for that code."};render();return;}
     V.gymMsg=null;
     V.sheet={kind:"gymimport",stage:"review",tok:uid(),engine:"chat",truncated:false,open:{0:true},draft:d};render();})
   .catch(function(){V.gymMsg={t:"err",m:"No connection. Try again when you’re online."};render();});
}
var GIMP_ERR={rate:"You’ve used today’s PDF import (1 a day). Try again tomorrow.",too_large:"That PDF is over 10 MB.",
  not_pdf:"That file isn’t a PDF.",empty:"That file is empty.",not_configured:"PDF import isn’t switched on for this app yet.",
  no_workouts:"Couldn’t find a workout program in that PDF.",unreadable:"Couldn’t read the text in that PDF. Scanned or photo PDFs need the Claude reader.",
  refused:"The AI declined to read that document.",too_long:"That program is too long to convert in one go. Try a shorter PDF.",
  signed_out:"Sign in again, then retry.",offline:"No connection. Try again when you’re online."};
var GIMP={timer:null,t0:0};
function gymImport(file){
  V.gymMsg=null;
  if(!file)return;
  if(file.size>10*1024*1024){V.gymMsg={t:"err",m:GIMP_ERR.too_large};render();return;}
  var tok=uid();
  V.sheet={kind:"gymimport",stage:"reading",fname:file.name,tok:tok};render();
  GIMP.t0=Date.now();clearInterval(GIMP.timer);
  GIMP.timer=setInterval(function(){var el=document.getElementById("gimtime");
    if(el)el.textContent=Math.round((Date.now()-GIMP.t0)/1000)+"s";},1000);
  var finish=function(res){
    clearInterval(GIMP.timer);
    if(!V.sheet||V.sheet.tok!==tok)return;
    var pd=res&&res.ok?programDraftFrom(res.program):null;
    if(pd){
      V.sheet={kind:"gymimport",stage:"review",tok:tok,engine:res.engine,truncated:!!res.truncated,open:{0:true},draft:pd};
    }else{
      V.sheet=null;V.gymMsg={t:"err",m:GIMP_ERR[res&&res.error]||"Couldn’t read that PDF. Try again."};
    }
    render();
  };
  api("/api/gym/import",{method:"POST",headers:{"Content-Type":"application/pdf"},body:file})
   .then(function(r){return r.text();})
   .then(function(t){
     var lines=t.split("\n").filter(function(l){return l.trim();}),res=null;
     try{res=JSON.parse(lines[lines.length-1]);}catch(e){}
     finish(res);})
   .catch(function(){finish({error:"offline"});});
}

/* -------------- API -------------- */
function checkAPI(){
  var el=document.getElementById("apistat");if(!el)return;
  fetch(API_BASE+"/api/health").then(function(r){return r.json();}).then(function(d){
    var e2=document.getElementById("apistat");if(!e2)return;
    e2.textContent=d.ok?(d.fs?"Connected (FatSecret + OFF)":"Connected (Open Food Facts)"):"Offline";
    e2.style.color=d.ok?"var(--green)":"var(--bad)";
  }).catch(function(){var e2=document.getElementById("apistat");if(e2){e2.textContent="Offline. Library only";e2.style.color="var(--bad)";}});
}
var apiTimer=null;
function scheduleApi(){
  clearTimeout(apiTimer);
  var q=(V.sheet&&V.sheet.query||"").trim();
  if(q.length<2){if(V.sheet)V.sheet.apiResults=[];return;}
  V.sheet.apiBusy=true;
  apiTimer=setTimeout(function(){
    fetch(API_BASE+"/api/search?q="+encodeURIComponent(q)+"&max=15").then(function(r){return r.json();}).then(function(d){
      if(V.sheet&&V.sheet.kind==="add"&&(V.sheet.query||"").trim()===q){
        V.sheet.apiResults=d.items||[];V.sheet.apiBusy=false;rerenderSheet();}
    }).catch(function(){if(V.sheet){V.sheet.apiBusy=false;}});
  },350);
}
/* barcode via ZXing on demand */
var zx=null;
function loadZX(){return new Promise(function(res,rej){if(window.ZXing)return res();var s=document.createElement("script");s.src="https://unpkg.com/@zxing/library@0.20.0/umd/index.min.js";s.integrity="sha384-DOP3OlIzNeWpufSZMxZihUYSqCAZFirsVmSAVg8ItvU9ac1FcQF6ZHjQ9CbCznNS";s.crossOrigin="anonymous";s.onload=res;s.onerror=rej;document.head.appendChild(s);});}
function bindScan(){
  var v=document.getElementById("cam");if(!v)return;
  loadZX().then(function(){
    try{zx=new ZXing.BrowserMultiFormatReader();
      zx.decodeFromConstraints({video:{facingMode:{ideal:"environment"}}},v,function(result){
        if(result){var code=result.getText();stopZX();V.sheet.scanning=false;onBarcode(code);}});
    }catch(e){V.sheet.scanMsg="Camera unavailable. Type the number instead.";rerenderSheet();}
  }).catch(function(){V.sheet.scanMsg="Scanner failed to load. Type the number instead.";rerenderSheet();});
}
function stopZX(){try{if(zx)zx.reset();}catch(e){}zx=null;}
function onBarcode(code){
  V.sheet.scanMsg="Looking up "+code+"\u2026";rerenderSheet();
  fetch(API_BASE+"/api/barcode?code="+encodeURIComponent(code)).then(function(r){return r.json();}).then(function(d){
    if(!V.sheet)return;
    if(d.items&&d.items.length){V.sheet.scanned=d.items;V.sheet.query="";V.sheet.scanMsg="";}
    else{V.sheet.scanned=[];V.sheet.scanMsg="No match for "+code+". Try searching by name.";}
    rerenderSheet();
  }).catch(function(){if(V.sheet){V.sheet.scanMsg="Lookup failed. Check your connection.";rerenderSheet();}});
}

/* -------------- event wiring -------------- */
function openAdd(target){V.sheet={kind:"add",target:target,query:"",seg:"recent",apiResults:[],scanned:[],cands:[],pick:null,scanning:false,scanMsg:"",focus:false,full:false};render();}
function commitAdd(def,amt){
  var sh=V.sheet;noteUse(def);
  var e=defToEntry(def,amt);
  if(sh.target.type==="recipe"){sh.back.draft.items.push(e);V.sheet=sh.back;save();render();return;}
  day(V.date).meals[sh.target.meal].push(e);
  save();V.sheet=null;render();
}

});

document.addEventListener("click",function(ev){

  /* account */
  if(act==="authsend"){sendLink();return;}
  else if(act==="authback"){AUTH.sent=false;AUTH.devLink="";AUTH.err="";render();return;}
  else if(act==="signout"){
    api("/api/auth/logout",{method:"POST"}).catch(function(){}).then(function(){
      try{localStorage.removeItem("fuelprotocol:lastuid");localStorage.removeItem("fuelprotocol:lastemail");}catch(e){}
      AUTH={state:"out",email:AUTH.email,uid:"",sent:false,busy:false,err:"",sync:"idle",devLink:""};
      DB=freshDB();LS=null;V={tab:"diary",date:todayStr(),sheet:null};render();});
    return;}

  if(act==="nav"){V.tab=el.getAttribute("data-v");V.sheet=null;V.gymMsg=null;render();var apEl=document.getElementById("app");if(apEl)apEl.scrollTop=0;}
  else if(act==="undo"){
    if(UNDO.items){
      if(UNDO.gym!=null){DB.gym.active=JSON.parse(UNDO.gym);}
      UNDO.items.forEach(function(it){var L=day(it.date).meals[it.meal];L.splice(Math.min(it.index,L.length),0,it.entry);});
      if(UNDO.rec&&!(DB.applies||[]).some(function(a){return a.id===UNDO.rec.id;}))planApplies().unshift(UNDO.rec);
      save();hideUndo();render();}}
  else if(act==="dateprev"){V.date=dateAdd(V.date,-1);render();}
  else if(act==="datenext"){V.date=dateAdd(V.date,1);render();}
  else if(act==="datetoday"){V.date=todayStr();render();}
  else if(act==="openadd"){openAdd({type:"meal",meal:el.getAttribute("data-m")});}
  else if(act==="openentry"){
    if(Date.now()<SW.blockUntil)return;
    var m=el.getAttribute("data-m"),id=el.getAttribute("data-id");
    var e=day(V.date).meals[m].filter(function(x){return x.id===id;})[0];
    if(e){V.sheet={kind:"entry",meal:m,entry:e};render();}
  }
  else if(act==="opencal"){var pc=V.date.split("-");V.sheet={kind:"cal",y:+pc[0],m:+pc[1]-1};render();}
  else if(act==="calprev"||act==="calnext"){var mm2=V.sheet.m+(act==="calnext"?1:-1);
    if(mm2<0){mm2=11;V.sheet.y--;}if(mm2>11){mm2=0;V.sheet.y++;}V.sheet.m=mm2;rerenderSheet();}
  else if(act==="calpick"){V.date=el.getAttribute("data-d");V.sheet=null;render();}
  else if(act==="theme"){DB.profile.theme=el.getAttribute("data-v");applyTheme(DB.profile.theme);save();render();}
  else if(act==="macroswap"){DB.profile.macroView=DB.profile.macroView==="g"?"pct":"g";save();render();}
  else if(act==="opencopy"){V.sheet={kind:"copy",target:el.getAttribute("data-m"),src:dateAdd(V.date,-1),srcMeal:el.getAttribute("data-m")};render();}
  else if(act==="cpprev"){V.sheet.src=dateAdd(V.sheet.src,-1);rerenderSheet();}
  else if(act==="cpnext"){V.sheet.src=dateAdd(V.sheet.src,1);rerenderSheet();}
  else if(act==="cpmeal"){V.sheet.srcMeal=el.getAttribute("data-v");rerenderSheet();}
  else if(act==="cpgo"){
    var srcL=(DB.log[V.sheet.src]&&DB.log[V.sheet.src].meals&&DB.log[V.sheet.src].meals[V.sheet.srcMeal])||[];
    srcL.forEach(function(e){var c=JSON.parse(JSON.stringify(e));c.id=uid();day(V.date).meals[V.sheet.target].push(c);});
    save();V.sheet=null;render();}
  else if(act==="copymeal"){
    var mm=el.getAttribute("data-m");
    var src=(DB.log[dateAdd(V.date,-1)]&&DB.log[dateAdd(V.date,-1)].meals[mm])||[];
    src.forEach(function(e){var c=JSON.parse(JSON.stringify(e));c.id=uid();day(V.date).meals[mm].push(c);});
    save();render();
  }
  else if(act==="water"){
    var i=parseInt(el.getAttribute("data-i"),10),d=day(V.date);
    d.water=(d.water===i+1)?i:i+1;save();render();
  }
  /* sheets generic */
  else if(act==="sheetclose"||act==="scrim"){
    if(act==="scrim"&&ev.target.closest("[data-stop]"))return;
    stopZX();closeSheet();
  }
  /* add sheet */
  else if(act==="seg"){V.sheet.seg=el.getAttribute("data-v");rerenderSheet();}
  else if(act==="qclear"){V.sheet.query="";V.sheet.apiResults=[];V.sheet.scanned=[];V.sheet.pick=null;V.sheet.scanMsg="";rerenderSheet();}
  else if(act==="scanback"){V.sheet.scanned=[];V.sheet.scanMsg="";rerenderSheet();}

  else if(act==="pick"){var d0=V.sheet.cands[parseInt(el.getAttribute("data-idx"),10)];
    if(d0){V.sheet.pick={def:d0,amt:d0.base};rerenderSheet();}}
  else if(act==="pickinc"||act==="pickdec"){var pk=V.sheet.pick;

  else if(act==="rdeling"){syncRName();V.sheet.draft.items.splice(parseInt(el.getAttribute("data-i"),10),1);rerenderSheet();}
  else if(act==="rsave"){syncRName();var dr2=V.sheet.draft;

/* undo toast — one shot, restores exactly what was removed */
var UNDO={items:null,rec:null,gym:null,timer:null};
function showUndo(msg,items,rec){
  UNDO.items=items||null;UNDO.rec=rec||null;UNDO.gym=null;clearTimeout(UNDO.timer);
  var t=document.getElementById("toast"),m=document.getElementById("toastmsg");
  if(m)m.textContent=msg;if(t)t.classList.add("show");
  var ub=t?t.querySelector('[data-act="undo"]'):null;
  if(ub)ub.style.display=items?"":"none";
  UNDO.timer=setTimeout(hideUndo,6000);
}
function hideUndo(){UNDO.items=null;UNDO.rec=null;UNDO.gym=null;var t=document.getElementById("toast");if(t)t.classList.remove("show");}
function pvShare(){
  var pl=planById(V.sheet.pid);
  if(!pl||pl.builtin)return;
  V.sheet.shareBusy=true;V.sheet.shareErr="";rerenderSheet();
  api("/api/plan/share",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({plan:{name:pl.name,days:pl.days}})})
   .then(function(r){return r.json().then(function(j){return{ok:r.ok,j:j};});})
   .then(function(res){
     if(!V.sheet||V.sheet.kind!=="planview")return;
     V.sheet.shareBusy=false;
     if(res.ok&&res.j.code)V.sheet.shareCode=res.j.code;
     else V.sheet.shareErr=res.j.error==="rate"?"Share limit reached for today. Try tomorrow.":"Couldn’t create a code. Try again.";
     rerenderSheet();})
   .catch(function(){if(V.sheet&&V.sheet.kind==="planview"){V.sheet.shareBusy=false;V.sheet.shareErr="No connection. Try again when you’re online.";rerenderSheet();}});
}
function planImport(){
  var box=document.getElementById("impcode");
  var code=((box&&box.value)||"").toUpperCase().replace(/[^A-Z2-9]/g,"");
  if(code.length!==8){V.planMsg={t:"err",m:"Codes are 8 characters. Check it and try again."};render();return;}
  V.planMsg={t:"ok",m:"Importing…"};render();
  api("/api/plan/shared?code="+code)
   .then(function(r){return r.json().then(function(j){return{ok:r.ok,j:j};});})
   .then(function(res){
     if(res.ok&&res.j.plan&&res.j.plan.kind==="program"){
       V.planMsg={t:"err",m:"That’s a workout program code. Open it from the Workout tab."};render();return;}
     if(res.ok&&res.j.plan){
       /* shared JSON is another user's content — rebuild it field by field */
       var p=res.j.plan,clean={id:uid(),name:String(p.name||"Shared plan").slice(0,60),days:[]};
       (Array.isArray(p.days)?p.days.slice(0,31):[]).forEach(function(pd,i){
         var nd={name:"Day "+(i+1),meals:{bf:[],lu:[],di:[],sn:[]}};
         ["bf","lu","di","sn"].forEach(function(m){
           ((pd&&pd.meals&&Array.isArray(pd.meals[m]))?pd.meals[m].slice(0,40):[]).forEach(function(e){
             nd.meals[m].push({id:uid(),name:String((e&&e.name)||"Food").slice(0,80),unit:String((e&&e.unit)||"x").slice(0,12),
               step:+(e&&e.step)||1,base:+(e&&e.base)||1,amt:+(e&&e.amt)||1,
               cal:+(e&&e.cal)||0,p:+(e&&e.p)||0,c:+(e&&e.c)||0,f:+(e&&e.f)||0,src:"shared",fsid:null});});});
         clean.days.push(nd);});
       if(!clean.days.length){V.planMsg={t:"err",m:"That code’s plan looks empty."};render();return;}
       DB.plans.unshift(clean);save();
       V.planMsg={t:"ok",m:"“"+clean.name+"” imported. It’s in your plans below."};render();
     }else{
       V.planMsg={t:"err",m:res.j.error==="not_found"?"No plan found for that code.":"Couldn’t import. Try again."};render();}
   })
   .catch(function(){V.planMsg={t:"err",m:"No connection. Try again when you’re online."};render();});
}
/* swipe LEFT on a diary entry to remove it — a deliberate, near-full-width pull.
   The delete zone sits on the RIGHT; releasing early snaps back; undo toast after. */
var SW={wrap:null,x:0,y:0,dx:0,active:false,blockUntil:0,w:0};
document.addEventListener("touchstart",function(ev){
  var w=ev.target.closest&&ev.target.closest(".swipewrap");
  if(!w)return;
  SW.wrap=w;SW.x=ev.touches[0].clientX;SW.y=ev.touches[0].clientY;SW.dx=0;SW.active=false;SW.w=w.offsetWidth||320;
},{passive:true});
document.addEventListener("touchmove",function(ev){
  if(!SW.wrap)return;
  var dx=ev.touches[0].clientX-SW.x,dy=ev.touches[0].clientY-SW.y;
  if(!SW.active){
    if(Math.abs(dy)>14&&Math.abs(dy)>Math.abs(dx)){SW.wrap=null;return;}
    if(dx<-12&&Math.abs(dx)>Math.abs(dy)*1.3)SW.active=true;
  }
  if(SW.active&&dx<0){
    SW.dx=dx;
    var en=SW.wrap.querySelector(".entry");
    if(en){en.style.transition="none";en.style.transform="translateX("+Math.max(dx,-SW.w)+"px)";}
    SW.wrap.classList.add("swiping");
    var bg=SW.wrap.querySelector(".swipebg"),p=Math.min(1,-dx/(SW.w*0.7));
    if(bg){bg.style.opacity=Math.min(1,p*1.25);
      bg.textContent=p>=1?"Release to remove":"Keep swiping…";
      bg.classList.toggle("armed",p>=1);}
  }
},{passive:true});
function swReset(){
  if(!SW.wrap)return;
  var en=SW.wrap.querySelector(".entry");
  if(en){en.style.transition="";en.style.transform="";}
  SW.wrap.classList.remove("swiping");
  var bg=SW.wrap.querySelector(".swipebg");if(bg){bg.classList.remove("armed");bg.style.opacity="";}
}
document.addEventListener("touchend",function(){
  if(!SW.wrap)return;
  var wrap=SW.wrap,en=wrap.querySelector(".entry");
  if(SW.active&&-SW.dx>=SW.w*0.7){
    var m=wrap.getAttribute("data-m"),id=wrap.getAttribute("data-id");
    var dd=day(V.date),idx=-1,ent=null;
    dd.meals[m].forEach(function(x,i){if(x.id===id){idx=i;ent=x;}});
    SW.blockUntil=Date.now()+500;
    if(ent){
      if(en){en.style.transition="transform .16s ease";en.style.transform="translateX(-110%)";}
      wrap.style.maxHeight=wrap.offsetHeight+"px";
      requestAnimationFrame(function(){wrap.classList.add("gone");wrap.style.maxHeight="0px";});
      setTimeout(function(){
        dd.meals[m]=dd.meals[m].filter(function(x){return x.id!==id;});
        save();render();
        showUndo("Removed "+ent.name,[{date:V.date,meal:m,entry:ent,index:idx<0?0:idx}]);
      },190);
    }
  }else{swReset();if(SW.active)SW.blockUntil=Date.now()+450;}
  SW.wrap=null;SW.active=false;SW.dx=0;
});
document.addEventListener("touchcancel",function(){swReset();SW.wrap=null;SW.active=false;SW.dx=0;});
/* sheet drag: pull the grab bar / header — up = full screen (add & plan picker), down = close */
var SH={el:null,y0:0,h0:0,dragging:false};
document.addEventListener("touchstart",function(ev){
  var g=ev.target.closest&&ev.target.closest(".sheet .grab, .sheet .shead");
  if(!g)return;var s=g.closest(".sheet");if(!s)return;
  SH.el=s;SH.y0=ev.touches[0].clientY;SH.h0=s.getBoundingClientRect().height;SH.dragging=false;
},{passive:true});
document.addEventListener("touchmove",function(ev){
  if(!SH.el)return;
  var dy=ev.touches[0].clientY-SH.y0;
  if(!SH.dragging&&Math.abs(dy)<8)return;
  SH.dragging=true;SH.el.classList.remove("snap");
  var resizable=V.sheet&&(V.sheet.kind==="add"||V.sheet.kind==="pbpick"||V.sheet.kind==="gympick");
  if(resizable){
    var maxH=window.innerHeight-12,hh=Math.max(140,Math.min(maxH,SH.h0-dy));
    SH.el.style.height=hh+"px";
  }else if(dy>0){SH.el.style.transform="translateY("+dy+"px)";}
},{passive:true});
document.addEventListener("touchend",function(){
  if(!SH.el)return;
  var el2=SH.el,wasDrag=SH.dragging;SH.el=null;SH.dragging=false;
  if(!wasDrag)return;
  var resizable=V.sheet&&(V.sheet.kind==="add"||V.sheet.kind==="pbpick"||V.sheet.kind==="gympick");
  var H=el2.getBoundingClientRect().height,vh=window.innerHeight;
  if(resizable){
    el2.classList.add("snap");el2.style.height="";
    if(H>vh*0.76){V.sheet.full=true;el2.classList.remove("szhalf");el2.classList.add("szfull");rerenderSheet();}
    else if(H<vh*0.34){stopZX();closeSheet();}
    else{V.sheet.full=false;el2.classList.remove("szfull");el2.classList.add("szhalf");rerenderSheet();}
  }else{
    var mt2=/translateY\(([\d.]+)px\)/.exec(el2.style.transform||""),dyv=mt2?+mt2[1]:0;
    if(dyv>110){stopZX();closeSheet();}
    else{el2.style.transition="transform .18s ease";el2.style.transform="";
      setTimeout(function(){el2.style.transition="";},200);}
  }
});
/* bottom spacing follows the tab bar's real height (safe area, text size, 6 tabs) */
function syncTabbar(){var tb=document.querySelector(".tabbar");if(tb)document.documentElement.style.setProperty("--tbh",tb.offsetHeight+"px");}
window.addEventListener("resize",syncTabbar);
var KB={t:null};
function isTyping(el){return el&&(el.tagName==="TEXTAREA"||el.tagName==="SELECT"||(el.tagName==="INPUT"&&!/^(checkbox|radio|button|submit|file)$/i.test(el.type)));}
document.addEventListener("focusin",function(ev){if(!isTyping(ev.target))return;clearTimeout(KB.t);document.body.classList.add("kb");
  var el=ev.target;setTimeout(function(){try{el.scrollIntoView({block:"center",behavior:"smooth"});}catch(e){}},300);});
document.addEventListener("focusout",function(){clearTimeout(KB.t);KB.t=setTimeout(function(){
  if(!isTyping(document.activeElement))document.body.classList.remove("kb");},120);});
boot();
</script>
