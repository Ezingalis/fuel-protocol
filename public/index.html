<style>
@font-face{font-family:"Geist";src:url("/fonts/Geist-Variable.woff2") format("woff2");font-weight:100 900;font-style:normal;font-display:swap}
/* Design tokens. Radius rule: containers 20px, controls 12px, chips + tags full pill.
   Accent = green only (actions, progress, success). Macro colors are data, never decoration. */
:root{
  color-scheme:light dark;
  --bg:#F2F3F5; --card:#FFFFFF; --card2:#F6F7F9; --line:#E3E6EA; --line2:#ECEEF1;
  --ink:#0F1419; --sub:#4F5866; --faint:#6B7482;
  --green:#0B8A5E; --green2:#086B49; --greenSoft:#E2F3EB; --onAccent:#FFFFFF; --ring1:#14B47C; --ring2:#0B8A5E;
  --prot:#D9475A; --carb:#C98314; --fat:#4470E6; --water:#1593B4;
  --bad:#CC3A43; --badSoft:#FBEAEB; --amber:#A86A0B; --amberSoft:#FCF2E0;
  --chipOn:#0F1419; --chipOnInk:#FFFFFF;
  --r:20px; --r-sm:12px;
  --sh:0 1px 2px rgba(15,20,25,.04),0 8px 24px -14px rgba(15,20,25,.14);
  --glass:rgba(255,255,255,.82); --scrim:rgba(15,20,25,.40);
  --ease:cubic-bezier(.2,.8,.2,1);
}
/* theme: automatic follows the phone; Settings can force light or dark (data-theme on <html>) */
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;
  --bg:#0C0E11; --card:#15181D; --card2:#1B1F25; --line:#272C34; --line2:#1F242B;
  --ink:#ECEEF2; --sub:#AAB1BC; --faint:#8C95A2;
  --green:#34D399; --green2:#6EE7B7; --greenSoft:rgba(52,211,153,.13); --onAccent:#04140D; --ring1:#4ADEA5; --ring2:#21B57D;
  --prot:#F27A8A; --carb:#EDB24E; --fat:#7C9CF8; --water:#48C2DD;
  --bad:#F26B72; --badSoft:rgba(242,107,114,.13); --amber:#EDB24E; --amberSoft:rgba(237,178,78,.12);
  --chipOn:#ECEEF2; --chipOnInk:#0C0E11;
  --sh:0 0 0 1px var(--line);
  --glass:rgba(21,24,29,.84); --scrim:rgba(0,0,0,.58);
}}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#0C0E11; --card:#15181D; --card2:#1B1F25; --line:#272C34; --line2:#1F242B;
  --ink:#ECEEF2; --sub:#AAB1BC; --faint:#8C95A2;
  --green:#34D399; --green2:#6EE7B7; --greenSoft:rgba(52,211,153,.13); --onAccent:#04140D; --ring1:#4ADEA5; --ring2:#21B57D;
  --prot:#F27A8A; --carb:#EDB24E; --fat:#7C9CF8; --water:#48C2DD;
  --bad:#F26B72; --badSoft:rgba(242,107,114,.13); --amber:#EDB24E; --amberSoft:rgba(237,178,78,.12);
  --chipOn:#ECEEF2; --chipOnInk:#0C0E11;
  --sh:0 0 0 1px var(--line);
  --glass:rgba(21,24,29,.84); --scrim:rgba(0,0,0,.58);
}
:root[data-theme="light"]{color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:"Geist",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility}
/* #app is the ONLY scroller: the body never moves, so the tab bar never moves */
#app{position:fixed;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  padding-bottom:calc(var(--tbh,84px) + 28px)}
/* while typing on a phone the keyboard lifts fixed bars over the input, so hide the bar */
body.kb .tabbar,body.has-sheet .tabbar{display:none}
body.kb #app{padding-bottom:40vh}
.wrap{max-width:480px;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) 16px 8px}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;padding:0;font-size:inherit}
button:focus-visible,a:focus-visible,label:focus-visible{outline:2px solid var(--green);outline-offset:2px;border-radius:var(--r-sm)}
.ic{width:1.15em;height:1.15em;flex:0 0 auto;vertical-align:-.2em}
input,select{font-family:inherit;font-size:16px;color:var(--ink);background:var(--card);border:none;box-shadow:inset 0 0 0 1px var(--line);
  border-radius:var(--r-sm);padding:12px 13px;width:100%;transition:box-shadow .15s var(--ease)}
input::placeholder{color:var(--faint)}
input:focus,select:focus{outline:none;box-shadow:inset 0 0 0 2px var(--green)}
#hft,#hin{padding-left:11px;padding-right:26px;background-position:calc(100% - 15px) 52%,calc(100% - 10px) 52%}
select{appearance:none;-webkit-appearance:none;padding-right:34px;
  background-image:linear-gradient(45deg,transparent 50%,var(--faint) 50%),linear-gradient(135deg,var(--faint) 50%,transparent 50%);
  background-position:calc(100% - 18px) 52%,calc(100% - 13px) 52%;background-size:5px 5px;background-repeat:no-repeat}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:18px;margin-top:12px}
.eyebrow{font-size:13px;font-weight:600;color:var(--sub)}
.h1{font-size:26px;font-weight:700;letter-spacing:-.03em;line-height:1.15}
.sub{color:var(--sub);font-size:14px;line-height:1.45;text-wrap:pretty}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.top{display:flex;align-items:center;justify-content:space-between;padding:4px 2px 2px}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:17px;letter-spacing:-.02em}
.brand .b{width:26px;height:26px;border-radius:8px;background:var(--green);display:grid;place-items:center}
/* date nav */
.datenav{display:flex;align-items:center;gap:8px;margin-top:10px}
.datenav .dn,.top .dn{width:40px;height:40px;border-radius:var(--r-sm);background:var(--card)!important;border:none!important;box-shadow:var(--sh);display:grid;place-items:center;font-size:18px;color:var(--sub)}
.datenav .dt{flex:1;text-align:center;font-weight:650;font-size:16px}
.datenav .dt .sm{display:block;font-weight:500;font-size:12.5px;color:var(--sub)}
.todaychip{font-size:13px;font-weight:600;color:var(--green2);background:var(--greenSoft);border-radius:999px;padding:8px 13px}
.daytitle{font-size:30px;font-weight:700;letter-spacing:-.035em;display:flex;align-items:center;gap:6px}
.daytitle .caret{font-size:16px;color:var(--faint);display:grid}
/* calories + macros */
.calrow{display:flex;align-items:baseline;gap:8px;margin-top:8px}
.calbig{font-size:34px;font-weight:700;letter-spacing:-.04em;line-height:1}
.calof{font-size:15px;color:var(--sub);font-weight:500;flex:1}
.calleft{font-size:17px;font-weight:650;letter-spacing:-.02em}
.calleft small{font-size:13px;color:var(--sub);font-weight:500;margin-left:4px}
.calbar{height:8px;border-radius:999px;background:var(--line2);margin-top:14px;overflow:hidden}
.calbar i{display:block;height:100%;border-radius:999px;transition:width .5s var(--ease)}
.maccols{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:12px}
.maccols .mc .mn{font-size:13px;font-weight:600}
.maccols .mc .mvv{font-size:17px;font-weight:650;margin-top:3px;letter-spacing:-.02em}
.maccols .mc .mvv small{font-size:12.5px;color:var(--sub);font-weight:500}
.swapbtn{width:34px;height:34px;border-radius:var(--r-sm);background:var(--card2);color:var(--sub);font-size:16px;display:grid;place-items:center}
/* calendar sheet */
.calhd{display:flex;align-items:center;justify-content:space-between;margin:4px 2px 12px}
.calhd .cm{font-size:18px;font-weight:650;letter-spacing:-.02em}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.calgrid .cw{text-align:center;font-size:11.5px;font-weight:600;color:var(--sub);padding:5px 0}
.cd{aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-size:15px;font-weight:550;color:var(--ink);position:relative;transition:background .15s}
.cd.dim{color:var(--faint);font-weight:400}
.cd.tdy{box-shadow:inset 0 0 0 1.5px var(--green)}
.cd.cur{background:var(--green);color:var(--onAccent)}
.cd.has::after{content:"";position:absolute;bottom:4px;width:4px;height:4px;border-radius:2px;background:var(--green)}
.cd.cur.has::after{background:var(--onAccent)}
/* week strip */
.wkstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:14px}
.wk{display:flex;flex-direction:column;align-items:center;gap:5px;padding:9px 0 10px;border-radius:14px;background:var(--card);box-shadow:var(--sh);transition:transform .15s var(--ease)}
.wk span{font-size:12px;font-weight:600;color:var(--sub)}
.wk i{font-style:normal;width:22px;height:22px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--line);display:grid;place-items:center;font-size:12px;color:var(--faint)}
.wk.done i{background:var(--green);box-shadow:none;color:var(--onAccent)}
.wk.cur{background:var(--chipOn)}
.wk.cur span{color:var(--chipOnInk)}
.wk.cur i{box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--chipOnInk) 35%,transparent);color:var(--chipOnInk)}
.wk.cur.done i{background:var(--green);box-shadow:none;color:var(--onAccent)}
.trainchip{margin-top:12px;padding:10px 13px;border-radius:var(--r-sm);background:var(--greenSoft);color:var(--green2);font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:7px}
.trainchip.rest{background:var(--card2);color:var(--sub)}
.mealmac{display:flex;gap:12px;font-size:12.5px;font-weight:600;margin-top:4px}
/* ring summary */
.sumgrid{display:flex;gap:16px;align-items:center}
.ringwrap{position:relative;width:132px;height:132px;flex-shrink:0}
.ringwrap svg{transform:rotate(-90deg)}
.ringmid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ringmid .big{font-size:30px;font-weight:700;letter-spacing:-.03em;line-height:1}
.ringmid .lbl{font-size:12px;font-weight:500;color:var(--sub);margin-top:3px}
.macro{margin-top:9px}
.macro:first-child{margin-top:0}
.macro .mrow{display:flex;justify-content:space-between;font-size:13px;font-weight:600}
.macro .mrow .mv{color:var(--sub);font-weight:500}
.mbar{height:5px;border-radius:999px;background:var(--line2);margin-top:7px;overflow:hidden}
.mbar i{display:block;height:100%;border-radius:999px;transition:width .5s var(--ease)}
.sumfoot{display:flex;justify-content:space-between;margin-top:14px;padding-top:14px;border-top:1px solid var(--line2)}
.sumfoot .cell{text-align:center;flex:1}
.sumfoot .cell b{display:block;font-size:20px;font-weight:650;letter-spacing:-.02em}
.sumfoot .cell span{font-size:12px;color:var(--sub);font-weight:500}
/* meal cards */
.mealhd{display:flex;align-items:center;justify-content:space-between;gap:10px}
.mealhd .mt{font-weight:650;font-size:17px;letter-spacing:-.02em}
.mealhd .mcal{font-weight:600;font-size:14px;color:var(--sub);display:inline-flex;align-items:center;gap:5px}
.entry{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 0;position:relative;background:var(--card);transition:transform .16s var(--ease)}
.swipewrap{position:relative;overflow:hidden;transition:max-height .2s ease,opacity .2s ease}
.swipewrap + .swipewrap{border-top:1px solid var(--line2)}
.swipewrap.gone{opacity:0}
.swipebg{position:absolute;inset:0;background:var(--badSoft);color:var(--bad);display:flex;align-items:center;justify-content:flex-end;padding-right:16px;font-weight:600;font-size:13px;opacity:0;border-radius:var(--r-sm);transition:background .15s ease,color .15s ease}
.swipebg.armed{background:var(--bad);color:#fff}
.swipewrap.swiping .swipebg{opacity:1}
.entry .en{font-size:15px;font-weight:550;line-height:1.3}
.entry .ea{font-size:13px;color:var(--sub)}
.entry .ec{font-weight:650;font-size:15px;color:var(--ink)}
.entry .ep{font-size:12px;color:var(--sub);text-align:right}
.mealfoot{display:flex;gap:8px;margin-top:10px}
.addbtn{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px;border-radius:var(--r-sm);background:var(--greenSoft);color:var(--green2);font-weight:600;font-size:14.5px;transition:transform .12s var(--ease),filter .15s}
.copybtn{width:46px;display:grid;place-items:center;border-radius:var(--r-sm);background:var(--card2);color:var(--sub);font-size:18px}
.empty{color:var(--sub);font-size:14px;line-height:1.5;padding:8px 0 2px;text-wrap:pretty}
/* water */
.glasses{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.glass{width:36px;height:44px;border-radius:10px 10px 13px 13px;background:var(--card2);display:grid;place-items:center;font-size:17px;color:var(--line);transition:background .15s,color .15s,transform .12s var(--ease)}
.glass.fill{background:color-mix(in srgb,var(--water) 16%,transparent);color:var(--water)}
/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(18px);backdrop-filter:saturate(180%) blur(18px);
  box-shadow:0 -1px 0 var(--line);z-index:40}
.tabbar .in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.tb{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;border-radius:var(--r-sm);color:var(--faint);font-size:11px;font-weight:550;transition:color .15s}
.tb svg{width:24px;height:24px}
.tb.on{color:var(--green)}
.tb.on svg{transform:translateY(-1px)}
/* chips */
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:8px 13px;border-radius:999px;background:var(--card);box-shadow:inset 0 0 0 1px var(--line);font-weight:550;font-size:13px;color:var(--sub);transition:background .15s,color .15s}
.chip.on{background:var(--chipOn);box-shadow:none;color:var(--chipOnInk)}
.chip.grn{background:var(--greenSoft);box-shadow:none;color:var(--green2)}
.daygrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px}
.dg{padding:9px 2px;border-radius:10px;background:var(--card2);text-align:center;font-size:11.5px;font-weight:600;color:var(--sub)}
.dg b{display:block;font-size:10.5px;color:var(--faint);font-weight:500}
/* list rows */
.lrow{display:flex;align-items:center;gap:12px;padding:13px 0;border-top:1px solid var(--line2)}
.lrow:first-child{border-top:none}
.lrow .ln{font-weight:600;font-size:15px}
.lrow .ls,.ls{font-size:13px;color:var(--sub)}
/* buttons */
.pillbtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 15px;border-radius:var(--r-sm);font-weight:600;font-size:14px;background:var(--green);color:var(--onAccent);transition:transform .12s var(--ease),filter .15s}
.pillbtn.ghost{background:var(--card2);color:var(--ink)}
.pillbtn.danger{background:var(--badSoft);color:var(--bad)}
.bigbtn{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:14px;border-radius:14px;background:var(--green);color:var(--onAccent);font-weight:650;font-size:16px;letter-spacing:-.01em;margin-top:12px;transition:transform .12s var(--ease),filter .15s}
.bigbtn.ghost{background:var(--card);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.textbtn{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:14px;color:var(--sub);padding:8px 0}
.textbtn.danger{color:var(--bad)}
@media (hover:hover){.bigbtn:hover,.pillbtn:hover,.addbtn:hover{filter:brightness(1.05)}.chip:hover{color:var(--ink)}}
.bigbtn:active,.pillbtn:active,.addbtn:active,.chip:active,.res:active,.wk:active,.glass:active,.sb:active,.msbtn:active,.setck:active,.copybtn:active,.tl:active{transform:scale(.97)}
/* sheets */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:60;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s var(--ease)}
.sheet{width:100%;max-width:480px;background:var(--bg);border-radius:26px 26px 0 0;max-height:90vh;max-height:90dvh;display:flex;flex-direction:column;
  padding:8px 16px calc(16px + env(safe-area-inset-bottom));animation:rise .28s var(--ease);box-shadow:0 -12px 40px -20px rgba(0,0,0,.35)}
@keyframes rise{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}

<script>
"use strict";
/* appearance: "auto" | "light" | "dark". Cached per device so the first paint is already right. */
function applyTheme(t){
  var el=document.documentElement,metas=document.querySelectorAll('meta[name="theme-color"]');
  if(t==="light"||t==="dark")el.setAttribute("data-theme",t);else{el.removeAttribute("data-theme");t="auto";}
  metas.forEach(function(mt){var sys=/dark/.test(mt.getAttribute("media")||"")?"#0C0E11":"#F2F3F5";
    mt.setAttribute("content",t==="auto"?sys:(t==="dark"?"#0C0E11":"#F2F3F5"));});
  try{localStorage.setItem("fuelprotocol:theme",t);}catch(e){}
}

/* ================= storage =================
   One JSON blob per user. Local copy in localStorage (instant + offline),
   server copy in D1 via /api/state. Newer updatedAt wins on load. */
var LS=null; /* set after sign-in: fuelprotocol:v5:<uid> */
function freshDB(){return{
  profile:{sex:"m",age:34,heightIn:70,weightLb:180,activity:1.55,goalRate:1,calMode:"auto",calCustom:2300,
           macroMode:"g",pT:180,cT:250,fT:65,pP:32,cP:44,fP:24,waterGoal:8},
  log:{},favs:[],custom:[],recipes:[],plans:[],applies:[],recents:[],freq:{},
  gym:{week:{},routines:[],logs:{},prs:{},programs:[],active:null,plan:{}},updatedAt:0
};}
var DB=freshDB();
function normalize(){
  if(!DB.profile)DB.profile=freshDB().profile;
  if(!DB.profile.burns)DB.profile.burns=[0,0,0,0,0,0,0];
  if(DB.profile.shiftRest==null)DB.profile.shiftRest=0;
  if(!DB.profile.macroView)DB.profile.macroView="g";
  if(!DB.profile.theme)DB.profile.theme="auto";
  if(!DB.updatedAt)DB.updatedAt=0;
  ["log","freq"].forEach(function(k){if(!DB[k])DB[k]={};});
  ["favs","custom","recipes","plans","applies","recents"].forEach(function(k){if(!DB[k])DB[k]=[];});
  if(!DB.gym)DB.gym={week:{},routines:[],logs:{},prs:{}};
  ["routines","programs"].forEach(function(k){if(!DB.gym[k])DB.gym[k]=[];});
  ["week","logs","prs","plan"].forEach(function(k){if(!DB.gym[k])DB.gym[k]={};});
  if(DB.gym.active===undefined)DB.gym.active=null;
  /* v5.1: single daily weight became timestamped weigh-ins */
  Object.keys(DB.log||{}).forEach(function(ds){var d=DB.log[ds];if(!d)return;
    if(d.weight!=null&&!(d.weights&&d.weights.length))d.weights=[{t:noonOf(ds),w:d.weight}];
    if(d.weight!==undefined)delete d.weight;});
}
function adopt(o){var f=freshDB();Object.keys(f).forEach(function(k){DB[k]=(o&&o[k]!=null)?o[k]:f[k];});normalize();}
function loadLocal(){
  try{
    var raw=LS&&localStorage.getItem(LS);
    if(raw){adopt(JSON.parse(raw));return true;}
    /* one-time lift of the old single-user data on this device */
    var old=localStorage.getItem("fuelprotocol:v4");
    if(old&&!localStorage.getItem("fuelprotocol:migrated")){
      adopt(JSON.parse(old));DB.updatedAt=Date.now();
      localStorage.setItem("fuelprotocol:migrated","1");
      return true;
    }
  }catch(e){}
  normalize();return false;
}
function save(){
  DB.updatedAt=Date.now();
  try{if(LS)localStorage.setItem(LS,JSON.stringify(DB));}catch(e){}
  schedulePush();
}

/* ================= account + sync ================= */
var AUTH={state:"loading",email:"",uid:"",sent:false,busy:false,err:"",sync:"idle",devLink:""};
var pushTimer=null,pushing=false,pushAgain=false;
function api(path,opts){opts=opts||{};opts.credentials="same-origin";return fetch(API_BASE+path,opts);}
function schedulePush(){
  if(AUTH.state!=="in")return;
  AUTH.sync="pending";paintSync();
  clearTimeout(pushTimer);pushTimer=setTimeout(pushState,1800);
}
function pushState(){
  if(AUTH.state!=="in")return;
  if(pushing){pushAgain=true;return;}
  pushing=true;AUTH.sync="saving";paintSync();
  api("/api/state",{method:"PUT",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({state:DB,updatedAt:DB.updatedAt})})
   .then(function(r){AUTH.sync=r.ok?"saved":"error";})
   .catch(function(){AUTH.sync="offline";})
   .then(function(){pushing=false;paintSync();if(pushAgain){pushAgain=false;schedulePush();}});
}
function syncLabel(){
  return{idle:"",pending:"Saving\u2026",saving:"Saving\u2026",saved:"All changes saved",
    error:"Couldn\u2019t save to your account. Will retry",offline:"Offline. Saved on this device"}[AUTH.sync]||"";
}
function isOffline(){return !navigator.onLine||AUTH.sync==="offline";}
function paintSync(){var on=document.getElementById("offnote");if(on)on.style.display=isOffline()?"block":"none";
  var el=document.getElementById("syncdot");if(!el)return;
  el.textContent=syncLabel();
  el.style.color=AUTH.sync==="error"?"var(--bad)":(AUTH.sync==="offline"?"var(--amber)":"var(--faint)");}
function pullState(){
  return api("/api/state").then(function(r){return r.ok?r.json():null;}).then(function(d){
    if(!d)return;
    var srv=d.state,su=d.updatedAt||0;
    if(srv&&su>(DB.updatedAt||0)){
      adopt(srv);DB.updatedAt=su;
      try{if(LS)localStorage.setItem(LS,JSON.stringify(DB));}catch(e){}
      AUTH.sync="saved";
    }else if((DB.updatedAt||0)>su){pushState();}
    else{AUTH.sync="saved";}
  }).catch(function(){AUTH.sync="offline";});
}
/* a weak signal hangs instead of failing: after a few seconds, treat it as offline */
function withTimeout(p,ms){return Promise.race([p,new Promise(function(_,no){setTimeout(function(){no(new Error("timeout"));},ms);})]);}
/* Offline first: a device that has signed in before opens straight from what's saved on it,
   then checks with the server in the background, so no connection (or one bar) never holds it up. */
function boot(){
  if(location.search.indexOf("signedin")>=0)try{history.replaceState({},"",location.pathname);}catch(e){}
  var lu=lsGet("fuelprotocol:lastuid");
  if(lu){AUTH.state="in";AUTH.uid=lu;AUTH.email=lsGet("fuelprotocol:lastemail")||"";LS="fuelprotocol:v5:"+lu;loadLocal();render();}
  withTimeout(api("/api/me"),8000).then(function(r){return r.ok?r.json():null;}).then(function(d){
    if(d&&d.uid){
      var same=AUTH.state==="in"&&AUTH.uid===d.uid;
      AUTH.state="in";AUTH.uid=d.uid;AUTH.email=d.email||"";
      lsSet("fuelprotocol:lastuid",d.uid);lsSet("fuelprotocol:lastemail",AUTH.email);
      if(!same){LS="fuelprotocol:v5:"+d.uid;loadLocal();}
      render();
      return pullState().then(render);
    }
    AUTH.state="out";render();
  }).catch(function(){
    if(AUTH.state==="in"){AUTH.sync="offline";render();}
    else{AUTH.state="out";render();}
  });
}
function sendLink(){
  var el=document.getElementById("authmail");
  var mail=((el&&el.value)||"").trim();
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(mail)){AUTH.err="Enter a valid email address.";render();return;}
  AUTH.email=mail;AUTH.err="";AUTH.busy=true;render();
  api("/api/auth/request",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:mail})})
   .then(function(r){return r.json().then(function(j){return{ok:r.ok,j:j};});})
   .then(function(res){
     AUTH.busy=false;
     if(res.ok&&res.j.pending){AUTH.pending=true;}
     else if(res.ok){AUTH.sent=true;AUTH.devLink=res.j.devLink||"";}
     else AUTH.err=res.j.error==="rate"?"A link was just sent. Check your email or wait a minute.":"Couldn\u2019t send the link. Try again.";
     render();
   }).catch(function(){AUTH.busy=false;AUTH.err="No connection. Try again when you\u2019re back online.";render();});
}
function sendCode(){
  var el=document.getElementById("authcode"),code=((el&&el.value)||"").replace(/\D/g,"");
  AUTH.code=code;
  if(code.length!==6){AUTH.cerr="The code is 6 digits.";render();return;}
  AUTH.cerr="";AUTH.cbusy=true;render();
  api("/api/auth/code",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:AUTH.email,code:code})})
   .then(function(r){return r.json().then(function(j){return{ok:r.ok,j:j};});})
   .then(function(res){AUTH.cbusy=false;
     if(res.ok&&res.j.ok){AUTH.sent=false;AUTH.code="";AUTH.state="loading";render();boot();return;}
     AUTH.cerr=res.j.error==="locked"?"Too many tries. Send yourself a new code.":res.j.error==="expired"?"That code has expired or was already used. Send yourself a new one.":
       "That code doesn\u2019t match"+(res.j.left>0?". "+res.j.left+" tr"+(res.j.left===1?"y":"ies")+" left.":".");
     render();})
   .catch(function(){AUTH.cbusy=false;AUTH.cerr="No connection. Try again when you\u2019re online.";render();});
}

     '<button class="bigbtn" data-act="authcode">'+(AUTH.cbusy?"Checking\u2026":"Sign in")+'</button>'+
     '<div class="fnote">'+(isStandalone()?"Use the code here: the link in the email opens Safari, not this app. ":"Or just tap the link in the email. ")+
     'Both work once and expire in 15 minutes. You stay signed in for 90 days.</div>'+
     '<button class="bigbtn ghost" data-act="authback">Send a new code or use another email</button></div>';
    if(AUTH.devLink)h+='<div class="card"><div class="eyebrow">Test link (email not configured)</div>'+
      '<div class="fnote" style="word-break:break-all"><a href="'+esc(AUTH.devLink)+'">'+esc(AUTH.devLink)+'</a></div></div>';
  }else{
    h+='<div class="card"><div class="flabel">Email address</div>'+
     '<input id="authmail" type="email" inputmode="email" autocomplete="email" placeholder="you@example.com" value="'+esc(AUTH.email)+'">'+
     (AUTH.err?'<div class="warn">'+esc(AUTH.err)+'</div>':'')+
     '<button class="bigbtn" data-act="authsend">'+(AUTH.busy?"Sending\u2026":"Email me a sign-in link")+'</button>'+
     '<div class="fnote">No password to remember. Fuel is invite-only: if you\u2019re new, entering your email asks the owner for access.</div></div>';

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");}
function todayStr(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function dateAdd(ds,n){var p=ds.split("-");var d=new Date(+p[0],+p[1]-1,+p[2]);d.setDate(d.getDate()+n);
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function fmtDate(ds){var p=ds.split("-");var d=new Date(+p[0],+p[1]-1,+p[2]);
  var wd=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"][d.getDay()];
  var mo=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][d.getMonth()];
  return {wd:wd,md:mo+" "+d.getDate()};}
function noonOf(ds){var p=ds.split("-");return new Date(+p[0],+p[1]-1,+p[2],12,0,0).getTime();}
function fmtTime(t){var d=new Date(t),h=d.getHours(),m=String(d.getMinutes()).padStart(2,"0"),ap=h>=12?"PM":"AM";h=h%12;if(!h)h=12;return h+":"+m+" "+ap;}
function day(ds){if(!DB.log[ds])DB.log[ds]={meals:{bf:[],lu:[],di:[],sn:[]},water:0,weights:[]};
  var d=DB.log[ds];if(!d.meals)d.meals={bf:[],lu:[],di:[],sn:[]};if(!d.weights)d.weights=[];return d;}
function scaledE(e){var s=e.amt/e.base;return{cal:e.cal*s,p:e.p*s,c:e.c*s,f:e.f*s};}
function mealTotal(list){var t={cal:0,p:0,c:0,f:0};(list||[]).forEach(function(e){var m=scaledE(e);t.cal+=m.cal;t.p+=m.p;t.c+=m.c;t.f+=m.f;});return t;}
function dayTotal(d){var t={cal:0,p:0,c:0,f:0};["bf","lu","di","sn"].forEach(function(m){var mt=mealTotal(d.meals[m]);t.cal+=mt.cal;t.p+=mt.p;t.c+=mt.c;t.f+=mt.f;});return t;}
function fmtAmt(e){var a=e.amt;if(e.unit==="g")return a+" g";if(e.unit==="x")return a+"\u00d7";
  return a+" "+e.unit+(a!==1&&"g,oz,tbsp".indexOf(e.unit)<0&&!/s$/.test(e.unit)?"s":"");}
function kcal(n){return Math.ceil(n).toLocaleString();}
var MEALS={bf:"Breakfast",lu:"Lunch",di:"Dinner",sn:"Snacks"};

/* targets */
function bmr(){var P=DB.profile,kg=P.weightLb*0.45359,cm=P.heightIn*2.54;
  return Math.round(10*kg+6.25*cm-5*P.age+(P.sex==="m"?5:-161));}
function tdee(){return Math.round(bmr()*DB.profile.activity);}
function calTarget(){var P=DB.profile;
  if(P.calMode==="custom")return P.calCustom;
  return Math.max(1200,Math.round(tdee()-P.goalRate*500));}
function targets(){var P=DB.profile,cal=calTarget();
  if(P.macroMode==="pct"){return{cal:cal,p:Math.round(cal*P.pP/100/4),c:Math.round(cal*P.cP/100/4),f:Math.round(cal*P.fP/100/9)};}
  return{cal:cal,p:P.pT,c:P.cT,f:P.fT};}

/* training-day cycling: each training day earns its burn back (keeps the weekly
   loss rate exact); optionally shift extra calories from rest days to training days. */
function wdOf(ds){var p=ds.split("-");return new Date(+p[0],+p[1]-1,+p[2]).getDay();}
function burnStats(){var b=DB.profile.burns||[],tot=0,k=0;
  for(var i=0;i<7;i++){if(b[i]>0){tot+=b[i];k++;}}
  return{tot:tot,k:k};}
function dayTargetWd(wd){
  var T=targets(),P=DB.profile,b=P.burns||[],st=burnStats();
  if(!st.k)return{cal:T.cal,p:T.p,c:T.c,f:T.f,burn:0,base:T.cal};
  var s=P.shiftRest||0,burn=b[wd]||0;
  var cal=Math.round(T.cal+(burn>0?burn+s*(7-st.k)/st.k:-s));
  var c=Math.max(0,Math.round(T.c+(cal-T.cal)/4));
  return{cal:cal,p:T.p,c:c,f:T.f,burn:burn,base:T.cal};
}
function dayTarget(ds){return dayTargetWd(wdOf(ds));}

/* entries */
function defToEntry(def,amt){return{id:uid(),name:def.name||def.n,unit:def.unit,step:def.step,base:def.base,
  amt:amt!=null?amt:def.base,cal:def.cal,p:def.p,c:def.c,f:def.f,src:def.src||"lib",fsid:def.fsid||null};}
function foodKey(d){return (d.name||d.n)+"|"+(d.fsid||d.src||"lib");}
function isFav(d){var k=foodKey(d);return DB.favs.some(function(f){return foodKey(f)===k;});}
function toggleFav(d){var k=foodKey(d);
  if(isFav(d)){DB.favs=DB.favs.filter(function(f){return foodKey(f)!==k;});}
  else{DB.favs.unshift({name:d.name||d.n,unit:d.unit,step:d.step,base:d.base,cal:d.cal,p:d.p,c:d.c,f:d.f,src:d.src||"lib",fsid:d.fsid||null});}
  save();}
function noteUse(d){var k=foodKey(d);DB.freq[k]=(DB.freq[k]||0)+1;
  var clean={name:d.name||d.n,unit:d.unit,step:d.step,base:d.base,cal:d.cal,p:d.p,c:d.c,f:d.f,src:d.src||"lib",fsid:d.fsid||null,brand:d.brand||""};
  DB.recents=DB.recents.filter(function(r){return foodKey(r)!==k;});
  DB.recents.unshift(clean);if(DB.recents.length>30)DB.recents=DB.recents.slice(0,30);}

/* built-in plan */
function builtinPlan(){
  var days=[];
  for(var w=0;w<3;w++){DAYNAMES.forEach(function(dn){
    var spec=ROT[w][dn];
    var mk=function(keys){return keys.map(function(k){return defToEntry(Object.assign({name:FOODS[k].n},FOODS[k]));});};
    days.push({name:"W"+(w+1)+" "+dn,meals:{
      bf:mk(["eggwhites","wholeegg","ffcheese","cbacon","oats"]),
      lu:mk(spec[0]),di:mk(spec[1]),
      sn:mk(["scoop","yogurt","blueberries","treat"])}});
  });}
  return{id:"builtin",name:"3-Week Cut",builtin:true,days:days};
}
var BUILTIN=builtinPlan();
function planTotals(pd){var t={cal:0,p:0,c:0,f:0};["bf","lu","di","sn"].forEach(function(m){var mt=mealTotal(pd.meals[m]);t.cal+=mt.cal;t.p+=mt.p;t.c+=mt.c;t.f+=mt.f;});return t;}
function planById(pid){return pid==="builtin"?BUILTIN:DB.plans.filter(function(p){return p.id===pid;})[0];}
function cloneEntry(e){var c=JSON.parse(JSON.stringify(e));c.id=uid();delete c.ap;return c;}
function planApplies(){if(!DB.applies)DB.applies=[];return DB.applies;}
/* remove everything a plan application logged — one date, or every date */
function apRemove(apId,onlyDate){
  var items=[];
  (onlyDate?[onlyDate]:Object.keys(DB.log)).forEach(function(ds){var d=DB.log[ds];if(!d||!d.meals)return;
    ["bf","lu","di","sn"].forEach(function(m){
      (d.meals[m]||[]).forEach(function(e,i){if(e.ap===apId)items.push({date:ds,meal:m,entry:e,index:i});});
      d.meals[m]=(d.meals[m]||[]).filter(function(e){return e.ap!==apId;});
    });});
  var left=0;Object.keys(DB.log).forEach(function(ds){var d=DB.log[ds];if(!d||!d.meals)return;
    ["bf","lu","di","sn"].forEach(function(m){(d.meals[m]||[]).forEach(function(e){if(e.ap===apId)left++;});});});
  if(!left)DB.applies=planApplies().filter(function(a){return a.id!==apId;});
  return items;
}
/* what a plan IS, computed from its actual food */
function planProfile(pl){
  var n=pl.days.length||1,s={cal:0,p:0,c:0,f:0};
  pl.days.forEach(function(pd){var t=planTotals(pd);s.cal+=t.cal;s.p+=t.p;s.c+=t.c;s.f+=t.f;});
  var avg={cal:Math.round(s.cal/n),p:Math.round(s.p/n),c:Math.round(s.c/n),f:Math.round(s.f/n)};
  var pctP=avg.cal?Math.round(avg.p*4/avg.cal*100):0,pctC=avg.cal?Math.round(avg.c*4/avg.cal*100):0,pctF=avg.cal?Math.round(avg.f*9/avg.cal*100):0;
  var tuned=Math.max(5,Math.round(avg.p/0.9/5)*5);
  var lvl=pctP>=30?"High protein":(pctP>=20?"Moderate protein":"Low protein");
  var carb=pctC<30?"Lower carb":(pctC>50?"High carb":"Balanced carbs");
  return{n:n,avg:avg,pctP:pctP,pctC:pctC,pctF:pctF,tuned:tuned,lvl:lvl,carb:carb};
}
/* the plan explained in sentences, judged against THIS user's numbers */
function planReview(pl){
  var pr=planProfile(pl),td=tdee(),diff=td-pr.avg.cal,me=DB.profile.weightLb,out=[];
  out.push(pr.n+" day"+(pr.n===1?"":"s")+" · averages "+pr.avg.cal.toLocaleString()+" cal: "+pr.avg.p+" g protein ("+pr.pctP+"%), "+pr.avg.c+" g carbs ("+pr.pctC+"%), "+pr.avg.f+" g fat ("+pr.pctF+"%).");
  if(diff>150)out.push("For you that’s roughly a "+(Math.round(diff/50)*50).toLocaleString()+" cal/day deficit against your ~"+td.toLocaleString()+" cal maintenance, about "+(Math.round(diff*7/3500*4)/4)+" lb/week of loss.");
  else if(diff<-150)out.push("For you that runs ~"+Math.abs(Math.round(diff/50)*50).toLocaleString()+" cal/day above your ~"+td.toLocaleString()+" cal maintenance. Built for gaining, not cutting.");
  else out.push("That sits right at your ~"+td.toLocaleString()+" cal maintenance. Hold weight while you train.");
  out.push("Protein is sized for a ~"+pr.tuned+" lb body at 0.9 g/lb"+(me?(Math.abs(pr.tuned-me)<=15?", a good match for your "+me+" lb.":" (you’re at "+me+" lb, so your number would be ~"+Math.round(me*0.9)+" g).")
    :"."));
  out.push(pr.lvl+" protects muscle in a deficit · "+pr.carb.toLowerCase()+" (~"+pr.avg.c+" g) fuels training · fat near "+pr.avg.f+" g supports hormones.");
  return out;
}

/* ================= SVG bits ================= */
function ringSVG(eaten,target){
  var r=56,cx=66,cy=66,C=2*Math.PI*r;
  var pct=target>0?Math.min(eaten/target,1):0;
  var over=eaten>target;
  var col=over?"var(--bad)":"url(#gr)";
  return '<svg width="132" height="132" viewBox="0 0 132 132">'+
   '<defs><linearGradient id="gr" x1="0" y1="0" x2="1" y2="1">'+
   '<stop offset="0" style="stop-color:var(--ring1)"/><stop offset="1" style="stop-color:var(--ring2)"/></linearGradient></defs>'+
   '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="var(--line2)" stroke-width="11"/>'+
   '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+col+'" stroke-width="11" stroke-linecap="round" '+
   'stroke-dasharray="'+C+'" stroke-dashoffset="'+(C*(1-pct))+'" style="transition:stroke-dashoffset .5s ease"/>'+
   '</svg>';
}
function barChart(vals,labels,target,tgts){
  var W=420,H=150,pad=8,bw=Math.floor((W-pad*2)/vals.length)-6;
  var max=Math.max(target*1.25,1);vals.forEach(function(v){if(v>max)max=v;});
  var ty=H-18-((target/max)*(H-30));
  var s='<svg viewBox="0 0 '+W+' '+H+'">';
  s+='<line x1="'+pad+'" y1="'+ty+'" x2="'+(W-pad)+'" y2="'+ty+'" stroke="var(--faint)" stroke-dasharray="4 4" stroke-width="1"/>';
  vals.forEach(function(v,i){
    var h=(v/max)*(H-30),x=pad+i*(bw+6),y=H-18-h;
    var dayTgt=(tgts&&tgts[i])||target;
    var col=v===0?"var(--line2)":(v>dayTgt?"var(--bad)":"var(--green)");
    s+='<rect x="'+x+'" y="'+y+'" width="'+bw+'" height="'+Math.max(h,2)+'" rx="4" fill="'+col+'" opacity="'+(v===0?'1':'.9')+'"/>';
    if(labels[i])s+='<text x="'+(x+bw/2)+'" y="'+(H-5)+'" font-size="9" fill="var(--faint)" text-anchor="middle">'+labels[i]+'</text>';
  });
  s+='</svg>';return s;
}
function lineChart(pts){
  if(pts.length===1)return '<div class="okline num">Logged: '+pts[0].v+' lb. Log tomorrow\u2019s weight to start the trend line.</div>';
  if(pts.length<2)return '<div class="fnote">The trend line starts at two logged weights.</div>';
  var W=420,H=150,pad=26;
  var vals=pts.map(function(p){return p.v;});
  var min=Math.min.apply(null,vals)-1,max=Math.max.apply(null,vals)+1;
  var X=function(i){return pad+ i*(W-pad-10)/(pts.length-1);};
  var Y=function(v){return 12+(1-(v-min)/(max-min))*(H-40);};
  var dstr=pts.map(function(p,i){return (i?"L":"M")+X(i).toFixed(1)+" "+Y(p.v).toFixed(1);}).join(" ");
  var s='<svg viewBox="0 0 '+W+' '+H+'">';
  s+='<text x="2" y="'+(Y(max-1)+4)+'" font-size="10" fill="var(--faint)">'+Math.round(max-1)+'</text>';
  s+='<text x="2" y="'+(Y(min+1)+4)+'" font-size="10" fill="var(--faint)">'+Math.round(min+1)+'</text>';
  s+='<path d="'+dstr+'" fill="none" stroke="url(#lg)" stroke-width="3" stroke-linecap="round"/>';
  s+='<defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" style="stop-color:var(--ring1)"/><stop offset="1" style="stop-color:var(--ring2)"/></linearGradient></defs>';
  pts.forEach(function(p,i){s+='<circle cx="'+X(i)+'" cy="'+Y(p.v)+'" r="3.5" fill="var(--card)" stroke="var(--green)" stroke-width="2"/>';});
  var lastP=pts[pts.length-1];
  s+='<text x="'+(W-8)+'" y="'+(Y(lastP.v)-8)+'" font-size="11" font-weight="700" fill="var(--ink)" text-anchor="end">'+lastP.v+' lb</text>';
  s+='</svg>';return s;
}

/* ================= renders ================= */
function macroRow(lbl,val,tgt,color){
  var pct=tgt>0?Math.min(val/tgt,1)*100:0;
  return '<div class="macro"><div class="mrow"><span style="color:'+color+'">'+lbl+'</span>'+
   '<span class="mv num">'+Math.round(val)+' / '+tgt+' g</span></div>'+
   '<div class="mbar"><i style="width:'+pct+'%;background:'+color+'"></i></div></div>';
}
function renderDiary(){
  var d=day(V.date),T=dayTarget(V.date),tot=dayTotal(d);
  var left=T.cal-tot.cal,over=left<0;
  var f=fmtDate(V.date),isToday=V.date===todayStr();
  var h='<div class="wrap">';
  h+='<div id="offnote" class="warn" style="margin:0 0 10px;display:'+(isOffline()?'block':'none')+'">You\u2019re offline. Everything you log saves on this phone and syncs when you\u2019re back online.</div>';
  h+='<div class="top" style="margin-top:6px"><button class="daytitle" data-act="opencal">'+(isToday?"Today":f.wd)+'<span class="caret">'+IC("caretd")+'</span></button>'+
     '<div class="row">'+(isToday?'':'<button class="todaychip" data-act="datetoday">Today</button>')+
     '<button class="dn" data-act="dateprev" style="width:34px;height:34px;border-radius:11px;background:var(--card);border:1px solid var(--line);color:var(--sub)">'+IC("caretl")+'</button>'+
     '<button class="dn" data-act="datenext" style="width:34px;height:34px;border-radius:11px;background:var(--card);border:1px solid var(--line);color:var(--sub)">'+IC("caretr")+'</button></div></div>';
  h+='<div class="sub" style="margin:2px 2px 0">'+f.wd+', '+f.md+'</div>';
  /* week strip */
  var ws=dateAdd(V.date,-wdOf(V.date));
  h+='<div class="wkstrip">';
  "SMTWTFS".split("").forEach(function(L,i){
    var ds=dateAdd(ws,i),logged=DB.log[ds]&&dayTotal(DB.log[ds]).cal>0;
    var burn=(DB.profile.burns||[])[i]>0;
    h+='<button class="wk'+(ds===V.date?" cur":"")+(logged?" done":"")+'" data-act="wkday" data-d="'+ds+'">'+
       '<span>'+L+'</span><i>'+(logged?IC("check"):(burn?IC("bolt"):""))+'</i></button>';
  });
  h+='</div>';
  /* MFP-style calories card */
  var barPct=T.cal>0?Math.min(tot.cal/T.cal,1)*100:0;
  h+='<div class="card"><div class="eyebrow">Calories</div>'+
     '<div class="calrow"><span class="calbig num">'+kcal(tot.cal)+' cal</span><span class="calof num">/ '+T.cal.toLocaleString()+'</span>'+
     '<span class="calleft num" style="color:'+(over?'var(--bad)':'var(--ink)')+'">'+kcal(Math.abs(left))+'<small>'+(over?"over":"left")+'</small></span></div>'+
     '<div class="calbar"><i style="width:'+barPct+'%;background:'+(over?'var(--bad)':'linear-gradient(90deg,var(--ring1),var(--ring2))')+'"></i></div>'+
     (T.burn>0?'<div class="trainchip">'+IC("bolt")+'Training day \u00b7 +'+(T.cal-T.base)+' cal refuel (carbs +'+Math.round((T.cal-T.base)/4)+' g)</div>':
      (T.cal<T.base?'<div class="trainchip rest">Rest day \u00b7 \u2212'+(T.base-T.cal)+' cal shifted to training days</div>':''))+
     '</div>';
  /* MFP-style macros card with swap */
  var mv=DB.profile.macroView||"g";
  var mcol=function(lbl,val,tgt,color){
    var pc=tgt>0?Math.min(val/tgt,1)*100:0;
    var vv=mv==="g"?Math.round(val)+' g <small>/ '+tgt+'</small>':Math.round(tgt>0?val/tgt*100:0)+'% <small>of '+tgt+' g</small>';
    return '<div class="mc"><div class="mn" style="color:'+color+'">'+lbl+'</div>'+
      '<div class="mvv num">'+vv+'</div>'+
      '<div class="mbar"><i style="width:'+pc+'%;background:'+color+'"></i></div></div>';};
  h+='<div class="card"><div class="mealhd"><span class="eyebrow">Macros</span><button class="swapbtn" data-act="macroswap" title="Switch grams / percent" aria-label="Switch grams / percent">'+IC("swap")+'</button></div>'+
     '<div class="maccols">'+mcol("Carbs",tot.c,T.c,"var(--carb)")+mcol("Fat",tot.f,T.f,"var(--fat)")+mcol("Protein",tot.p,T.p,"var(--prot)")+'</div></div>';
  /* plan foods on this day \u2014 offer clean removal without touching your own logging */
  var apHere={};
  ["bf","lu","di","sn"].forEach(function(m){d.meals[m].forEach(function(e){if(e.ap)apHere[e.ap]=(apHere[e.ap]||0)+1;});});
  Object.keys(apHere).forEach(function(apid){
    var rec=(DB.applies||[]).filter(function(a){return a.id===apid;})[0];
    h+='<div class="trainchip" style="display:flex;align-items:center;justify-content:space-between;gap:10px">'+
       '<span>'+IC("clip")+' '+esc((rec&&rec.name)||"Meal plan")+' \u00b7 '+apHere[apid]+' item'+(apHere[apid]===1?"":"s")+' from plan</span>'+
       '<button style="font-weight:800;color:var(--green2);text-decoration:underline;flex:0 0 auto" data-act="clearplansheet" data-ap="'+apid+'">Remove\u2026</button></div>';
  });
  ["bf","lu","di","sn"].forEach(function(m){
    var list=d.meals[m],mt=mealTotal(list);
    h+='<div class="card"><div class="mealhd"><span class="mt">'+MEALS[m]+'</span><span class="mcal num">'+(list.length?kcal(mt.cal)+' cal':'')+'</span></div>';
    if(list.length)h+='<div class="mealmac num"><span style="color:var(--prot)">'+Math.round(mt.p)+'g P</span><span style="color:var(--carb)">'+Math.round(mt.c)+'g C</span><span style="color:var(--fat)">'+Math.round(mt.f)+'g F</span></div>';
    if(!list.length)h+='<div class="empty">Nothing logged yet.</div>';
    list.forEach(function(e){var sm=scaledE(e);
      h+='<div class="swipewrap" data-m="'+m+'" data-id="'+e.id+'"><div class="swipebg">Remove</div>'+
        '<button class="entry" data-act="openentry" data-m="'+m+'" data-id="'+e.id+'">'+
        '<span class="grow"><span class="en">'+esc(e.name)+'</span><br><span class="ea">'+fmtAmt(e)+'</span></span>'+
        '<span style="text-align:right"><span class="ec num">'+kcal(sm.cal)+'</span><br><span class="ep num">'+Math.round(sm.p)+'p \u00b7 '+Math.round(sm.c)+'c \u00b7 '+Math.round(sm.f)+'f</span></span></button></div>';
    });
    h+='<div class="mealfoot"><button class="addbtn" data-act="openadd" data-m="'+m+'">'+IC("plus")+'Add food</button>'+
       '<button class="copybtn" data-act="opencopy" data-m="'+m+'" title="Copy a meal from another day" aria-label="Copy a meal from another day">'+IC("copy")+'</button></div></div>';
  });
  var wg=DB.profile.waterGoal||8;
  h+='<div class="card"><div class="mealhd"><span class="mt">Water</span><span class="mcal num">'+(d.water||0)+' / '+wg+'</span></div><div class="glasses">';
  for(var i=0;i<wg;i++){h+='<button class="glass'+(i<(d.water||0)?' fill':'')+'" data-act="water" data-i="'+i+'" aria-label="Glass '+(i+1)+'">'+IC("drop")+'</button>';}
  h+='</div></div>';
  var wts=(d.weights||[]).slice().sort(function(a,b){return a.t-b.t;});
  h+='<div class="card"><div class="mealhd"><span class="mt">Weight</span><span class="mcal num">'+(wts.length?wts[wts.length-1].w+' lb':'')+'</span></div>';
  wts.forEach(function(we){
    h+='<div class="kv"><span class="num" style="color:var(--sub)">'+fmtTime(we.t)+'</span>'+
       '<span class="row" style="gap:10px"><b class="num">'+we.w+' lb</b>'+
       '<button class="sx" style="width:26px;height:26px;font-size:11px" data-act="delweight" data-t="'+we.t+'" aria-label="Remove">'+IC("x")+'</button></span></div>';});

function lastSets(name){

/* ---- programs: multi-week plans run session by session, in order ----
   active = {pid, w (week index), done:{"w|s":date}, started, hist[]}.

  wk.sessions.forEach(function(s,si){if(a.done[a.w+"|"+si])done++;else if(next<0)next=si;});

function weekName(w,i){var base="Week "+(i+1),lab=String(w.label||"").replace(/\s*weeks?\s*\d+(\s*(-|to)\s*\d+)?\s*$/i,"").trim();
  var rest=lab.replace(/^weeks?\s*\d+(\s*(-|to)\s*\d+)?\s*[-:·]?\s*/i,"").trim();
  if(!lab||/^weeks?\s*\d+/i.test(lab))return base+(rest?" · "+rest:"");

/* open (or create) the day's workout log. src: "prog" (session s of the active
   program's current week), "routine" (today's weekday routine), or auto */
/* a log built from one program session; marks the program only if it is the active one */
function progLog(p,w,si){
  var ses=p&&p.weeks[w]&&p.weeks[w].sessions[si];
  if(!ses)return null;
  var log={rid:null,prog:{pid:p.id,w:w,s:si},name:ses.name+" · Week "+(w+1),ex:[],t0:Date.now(),t1:0};
  ses.ex.forEach(function(e){
    var last=lastSets(e.n),sets=[],rows=e.st?blockRows(e):[];
    for(var g=1;g<=(e.sets||3);g++){
      if(rows.length>1||(rows.length&&rows[0].timed)){
        var head=0;
        rows.forEach(function(r,p){
          var ls=lastRow(last,g,p,sets.length),want=repsFor(r.s,g-1);if(!head)head=want;
          var row={g:g,p:p,k:r.k,reps:r.timed?0:want||(ls&&ls.p===p&&ls.reps)||Math.max(1,Math.round((head||10)/2)),lb:r.timed?0:(ls?(ls.lb||0):0),done:false};
          if(r.timed)row.t=r.s.r;
          sets.push(row);
        });
      }else{var ls=lastRow(last,g,0,g-1);
        sets.push({reps:repsFor(rows.length?rows[0].s:null,g-1)||(e.st&&ls?ls.reps:e.reps)||10,lb:e.lb>0?e.lb:(ls?(ls.lb||0):0),done:false});}
    }
    var lx={n:e.n,m:e.m,sets:sets,target:e.target||"",rest:e.rest||0,notes:e.notes||""};
    if(e.st)lx.st=e.st;
    log.ex.push(lx);
  });
  return log;
}
/* one round of a block, steps expanded, each with the label it's logged under:
   drop sets Top, Drop 1, Drop 2; rest-pause and clusters Main, Mini 1...; supersets A, B; timed steps Hold */
function blockRows(e){
  var rows=[];(e.st||[]).forEach(function(s){for(var j=0;j<(s.x||1);j++)rows.push(s);});
  var tech=String(e.target||"").toLowerCase(),drop=/drop/.test(tech),mini=/rest.?pause|cluster/.test(tech),mv=[],d=0;
  rows.forEach(function(s){if(mv.indexOf(s.n)<0)mv.push(s.n);});
  return rows.map(function(s,i){
    var timed=/^\d+:\d\d$/.test(s.r),k;
    if(rows.length===1)k="";
    else if(timed)k="Hold";
    else if(drop||mini)k=d++===0?(drop?"Top":"Main"):(drop?"Drop ":"Mini ")+(d-1);
    else if(mv.length>1)k="ABCDEFGH".charAt(mv.indexOf(s.n));
    else k=String(i+1);
    return{s:s,k:k,timed:timed};
  });
}
/* "12, 10 reps" -> 12 in round 1, 10 in round 2; "to failure" -> 0 */
function repsFor(s,gi){var m=s&&/^([\d, ]+) reps$/.exec(s.r||"");if(!m)return 0;

  for(var j=0;j<last.length;j++)if(last[j].g===g&&last[j].p===p)return last[j];

function gymOpenLog(ds,src,s){

function weekBlocks(weeks){
  var out=[];
  weeks.forEach(function(w,i){
    var last=out[out.length-1];
    if(last&&last.label===w.label&&last.deload===w.deload&&JSON.stringify(last.w.sessions)===JSON.stringify(w.sessions)){last.b=i;return;}
    out.push({a:i,b:i,label:w.label||"",deload:!!w.deload,repeated:!!w.repeated,w:w});
  });
  return out;
}
function blockTitle(bk){
  var range=bk.a===bk.b?"Week "+(bk.a+1):"Weeks "+(bk.a+1)+"-"+(bk.b+1);
  var base=bk.label.replace(/\s*weeks?\s*\d+(\s*(-|to)\s*\d+)?\s*$/i,"").trim();
  var rest=base.replace(/^weeks?\s*\d+(\s*(-|to)\s*\d+)?\s*[-:·]?\s*/i,"").trim();
  if(/^deload$/i.test(rest))rest="";
  if(!base||/^weeks?\s*\d+/i.test(base))return{title:range+(rest?" · "+rest:""),range:""};
  return{title:base,range:range};
}
function restText(e){return e.rest&&!/rest/i.test(e.target||"")?"rest "+fmtRest(e.rest):"";}
/* the sets × reps column already shows "4 × 8"; keep only what it doesn't (a rep range, RIR, %1RM) */
function targetText(e){
  var t=String(e.target||""),m=/^(\d+)\s*[×x]\s*(\d+(?:\s*-\s*\d+)?)\s*(?:reps?)?\s*(?:·|,)?\s*/i.exec(t);
  if(m&&+m[1]===+e.sets)t=(/-/.test(m[2])?m[2].replace(/\s+/g,"")+" reps · ":"")+t.slice(m[0].length);
  return t.replace(/\s*·\s*$/,"");
}
/* collapsible week-by-week view, shared by import review and program details */
function weeksTL(weeks,open,curW,pid){
  var h='';
  weekBlocks(weeks).forEach(function(bk){
    var on=!!open[bk.a],nx=0,t=blockTitle(bk),now=curW>=bk.a&&curW<=bk.b;
    bk.w.sessions.forEach(function(s){nx+=s.ex.length;});
    h+='<div class="blk"><button class="tl" data-act="wktog" data-i="'+bk.a+'"><span class="grow"><span class="ln">'+esc(t.title)+'</span>'+
       (now?'<span class="tag now">Now</span>':'')+(bk.deload?'<span class="tag deload">Deload</span>':'')+'<br>'+
       '<span class="ls">'+(t.range?esc(t.range)+' · ':'')+bk.w.sessions.length+' session'+(bk.w.sessions.length===1?'':'s')+' · '+nx+' exercises'+
       (bk.repeated?' · copied from the week before':'')+'</span></span><span class="chev">'+(on?IC("caretu"):IC("caretd"))+'</span></button>';
    if(on){
      h+='<div class="ses">';
      if(pid)h+='<button class="pillbtn ghost" style="width:100%;margin-top:12px" data-act="wksched" data-pid="'+pid+'" data-a="'+bk.a+'" data-b="'+bk.b+'" data-s="-1">'+IC("plans")+'Schedule this week</button>';
      bk.w.sessions.forEach(function(s,si){
        h+='<div class="sh"><span>'+esc(s.name)+'</span>'+(pid?'<button class="textbtn" style="padding:0;font-size:13px;color:var(--green2)" data-act="wksched" data-pid="'+pid+'" data-a="'+bk.a+'" data-b="'+bk.b+'" data-s="'+si+'">'+IC("plans")+'Schedule</button>':
           '<span class="ls">'+s.ex.length+' exercises</span>')+'</div>';
        s.ex.forEach(function(e){
          var meta=[targetText(e),restText(e)].filter(Boolean).join(" · "),seen={},th='';
          (e.st||[]).forEach(function(x){if(x.v&&!seen[x.v]){seen[x.v]=1;th+=vidBtn(x.v,x.n,"vmini");}});
          h+='<div class="exr"><span class="en">'+esc(e.n)+'</span><span class="sr">'+(e.st?e.sets+' round'+(e.sets===1?'':'s'):e.sets+' × '+e.reps)+(e.lb>0?' · '+e.lb+' lb':'')+'</span>'+
             (meta?'<span class="et">'+esc(meta)+'</span>':'')+(th?'<span class="vrow">'+th+'</span>':'')+'</div>';});
      });
      h+='</div>';
    }
    h+='</div>';
  });
  return h;
}
function progStats(p){
  var w0=p.weeks[0]||{sessions:[]},nx=0;w0.sessions.forEach(function(s){nx+=s.ex.length;});
  return '<div class="stats"><div><b class="num">'+p.weeks.length+'</b><span>weeks</span></div>'+
    '<div><b class="num">'+w0.sessions.length+'</b><span>days a week</span></div>'+
    '<div><b class="num">'+(w0.sessions.length?Math.round(nx/w0.sessions.length):0)+'</b><span>exercises/day</span></div></div>';
}
/* ---------------- workout player ----------------
   Full screen, one exercise at a time. It renders into its own root outside #app and repaints
   only what changed, so ticking a set or the rest timer never reloads the demo video. */
var PL={clock:null,wake:null,mkey:""};
function exDone(ex){return ex.sets.length>0&&ex.sets.every(function(s){return s.done;});}
function exVideos(ex){var out=[],seen={};(ex.st||[]).forEach(function(s){if(s.v&&!seen[s.v]){seen[s.v]=1;out.push({v:s.v,n:s.n});}});return out;}
function fmtClock(ms){var s=Math.max(0,Math.floor(ms/1000));return Math.floor(s/60)+":"+String(s%60).padStart(2,"0");}
function firstOpen(log){for(var i=0;i<log.ex.length;i++)if(!exDone(log.ex[i]))return i;return Math.max(0,log.ex.length-1);}
/* the rows you log for one exercise: rounds of labeled rows (Top, Drop 1...) or plain numbered sets */
function setRowsHtml(ex,ei){
  var grouped=ex.sets.some(function(s){return s.g!=null;}),rounds=0,perRound=0,h='<div style="margin-top:10px">';
  ex.sets.forEach(function(s){if(s.g>rounds)rounds=s.g;if(s.g===1)perRound++;});
  var many=grouped&&perRound>1;
  ex.sets.forEach(function(s,si){
    var lab=grouped?(s.k||String(s.g)):String(si+1);
    if(many&&rounds>1&&s.p===0)h+='<div class="rndhd">Round '+s.g+' of '+rounds+'</div>';
    var sn='<span class="sn'+(lab.length>2?' lab':' num')+'">'+esc(lab).replace(" ","<br>")+'</span>';
    if(s.t){h+='<div class="setrow'+(many?' lb2':'')+'">'+sn+'<span class="hold num">'+esc(s.t)+(s.k==="Hold"?'<small>hold</small>':'')+'</span>'+
       '<button class="setck'+(s.done?" on":"")+'" data-act="gymset" data-ei="'+ei+'" data-si="'+si+'" aria-label="Done">'+IC("check")+'</button></div>';return;}
    h+='<div class="setrow'+(many?' lb2':'')+'">'+sn+
       '<span class="stp"><button class="msbtn" data-act="gymrepdec" data-ei="'+ei+'" data-si="'+si+'" aria-label="Fewer reps">'+IC("minus")+'</button>'+
       '<span class="setval num">'+s.reps+'<small>reps</small></span>'+
       '<button class="msbtn" data-act="gymrepinc" data-ei="'+ei+'" data-si="'+si+'" aria-label="More reps">'+IC("plus")+'</button></span>'+
       '<span class="stp"><button class="msbtn" data-act="gymlbdec" data-ei="'+ei+'" data-si="'+si+'" aria-label="Less weight">'+IC("minus")+'</button>'+
       '<span class="setval num">'+(s.lb>0?s.lb+'<small>lb</small>':'BW')+'</span>'+
       '<button class="msbtn" data-act="gymlbinc" data-ei="'+ei+'" data-si="'+si+'" aria-label="More weight">'+IC("plus")+'</button></span>'+
       '<button class="setck'+(s.done?" on":"")+'" data-act="gymset" data-ei="'+ei+'" data-si="'+si+'" aria-label="Set done">'+IC("check")+'</button></div>';
  });
  return h+'</div><div class="row" style="gap:8px;margin-top:8px">'+(many?
     '<button class="textbtn" data-act="gymaddround" data-ei="'+ei+'">'+IC("plus")+'Add round</button>'+
     (rounds>1?'<button class="textbtn" data-act="gymdelround" data-ei="'+ei+'">'+IC("minus")+'Remove round</button>':''):
     '<button class="textbtn" data-act="gymaddset" data-ei="'+ei+'">'+IC("plus")+'Add set</button>'+
     (ex.sets.length>1?'<button class="textbtn" data-act="gymdelset" data-ei="'+ei+'">'+IC("minus")+'Remove set</button>':''))+'</div>';
}
function exMeta(ex){var grouped=ex.sets.some(function(s){return s.g!=null;}),rounds=0;ex.sets.forEach(function(s){if(s.g>rounds)rounds=s.g;});
  return [targetText({target:ex.target,sets:grouped?rounds:ex.sets.length}),restText(ex)].filter(Boolean).join(" · ");}
function plHead(log){
  var sh=V.sheet,n=log.ex.length;
  var seg=log.ex.map(function(ex,k){return '<i class="'+(k===sh.i&&!sh.list?"cur ":"")+(exDone(ex)?"dn":"")+'"></i>';}).join("");
  return '<div class="plbar"><button class="plic" data-act="plclose" aria-label="Close workout (progress is kept)">'+IC("caretd")+'</button>'+
    '<div class="pltt"><b>'+esc(log.name)+'</b><span class="num">'+(sh.list?"All exercises":n?"Exercise "+(sh.i+1)+" of "+n:"No exercises")+' · <span id="plclock">'+fmtClock((log.t1||Date.now())-log.t0)+'</span></span></div>'+
    '<button class="plic'+(sh.list?" on":"")+'" data-act="pllist" aria-label="All exercises">'+IC("list")+'</button></div>'+
    (n?'<div class="plseg">'+seg+'</div>':'');
}
function plMedia(log){
  var sh=V.sheet,ex=!sh.list&&log.ex[sh.i],vids=ex?exVideos(ex):[],x=vids[Math.min(sh.vi||0,vids.length-1)];
  if(!x)return '';
  return '<div class="plvid"><video src="/media/ex/'+x.v+'.mp4" poster="/media/ex/'+x.v+'.jpg" autoplay muted loop playsinline preload="auto"></video>'+
    '<button class="plexp" data-act="vid" data-v="'+x.v+'" data-n="'+esc(x.n)+'" aria-label="Open the video larger, with controls">'+IC("expand")+'</button>'+
    '<div class="vmsg" hidden>This video isn’t saved on this phone. Connect to the internet, or save videos for offline from the Workout tab.</div></div>';
}
function plMain(log){
  var sh=V.sheet,h='';
  if(sh.list){
    h+='<div class="plover">';
    log.ex.forEach(function(ex,k){var vids=exVideos(ex),dn=0;ex.sets.forEach(function(x){if(x.done)dn++;});
      h+='<button class="plrow'+(k===sh.i?" cur":"")+'" data-act="plgo" data-i="'+k+'">'+
        (vids[0]?'<span class="vmini"><img src="/media/ex/'+vids[0].v+'.jpg" alt="" loading="lazy" onerror="this.remove()"></span>':'<span class="plnum num">'+(k+1)+'</span>')+
        '<span class="grow"><span class="ln">'+esc(ex.n)+'</span><br><span class="ls num">'+dn+' of '+ex.sets.length+' sets</span></span>'+
        (exDone(ex)?'<span class="plok">'+IC("checkcf")+'</span>':'')+'</button>';});
    var gv=gymVol(log);
    return h+'</div><button class="bigbtn ghost" data-act="gymaddex">'+IC("plus")+'Add exercise</button>'+
      '<div class="fnote" style="text-align:center">'+gv.sets+' sets · '+fmtVol(gv.vol)+' lb so far</div>';
  }
  var ex=log.ex[sh.i];
  if(!ex)return '<div class="empty">No exercises in this workout yet.</div><button class="bigbtn ghost" data-act="gymaddex">'+IC("plus")+'Add exercise</button>';
  var vids=exVideos(ex),meta=exMeta(ex);
  if(vids.length>1)h+='<div class="plmv">'+vids.map(function(x,k){return '<button class="chip'+(k===(sh.vi||0)?" on":"")+'" data-act="plvid" data-vi="'+k+'">'+esc(x.n)+'</button>';}).join("")+'</div>';
  h+='<div class="exhd" style="margin-top:16px"><div class="grow"><div class="plname">'+esc(ex.n)+'</div>'+
     (meta?'<div class="extarget">'+esc(meta)+'</div>':'')+(ex.notes?'<div class="exnote">'+esc(ex.notes)+'</div>':'')+'</div>'+
     '<span class="mtag">'+esc(ex.m)+'</span></div>';
  /* a lone step with no cue says nothing the rows below don't */
  if(ex.st&&!(ex.st.length===1&&(ex.st[0].x||1)===1&&!ex.st[0].c))h+=stepsHtml(ex,true);
  h+=setRowsHtml(ex,sh.i);
  return h+'<div class="plmore"><button class="textbtn" data-act="gymaddex">'+IC("plus")+'Add exercise</button>'+
    '<button class="textbtn danger" data-act="gymdelex" data-ei="'+sh.i+'">'+IC("trash")+'Remove</button></div>';
}
function plFoot(log){
  var sh=V.sheet,n=log.ex.length,i=sh.i,h='';
  if(GT.left>0)h+='<div class="plrest">'+IC("timer")+'<span class="grow">Rest <b class="num" id="gtleft">'+fmtRest(GT.left)+'</b></span>'+
    '<button class="pillbtn ghost" data-act="gymrest30">+30s</button><button class="pillbtn ghost" data-act="gymrest">Skip</button></div>';
  if(log.t1)return h+'<div class="plnav"><button class="bigbtn ghost" data-act="gymreopen">Edit sets</button><button class="bigbtn" data-act="plclose">Done</button></div>';
  if(sh.list||!n)return h+'<div class="plnav"><button class="bigbtn" data-act="gymfinish">'+IC("flag")+'Finish workout</button></div>';
  var next=log.ex[i+1];
  return h+'<div class="plnav"><button class="plprev" data-act="plgo" data-i="'+(i-1)+'"'+(i>0?'':' disabled')+' aria-label="Previous exercise">'+IC("caretl")+'</button>'+
    (next?'<button class="bigbtn'+(exDone(log.ex[i])?'':' soft')+'" data-act="plgo" data-i="'+(i+1)+'"><span>Next:</span><span class="nxn">'+esc(next.n)+'</span>'+IC("caretr")+'</button>':
     '<button class="bigbtn" data-act="gymfinish">'+IC("flag")+'Finish workout</button>')+'</div>';
}
function stopVideo(box){var v=box&&box.querySelector("video");if(v){v.pause();v.removeAttribute("src");v.load();}}
function paintPlayer(){
  var root=document.getElementById("player"),log=V.sheet&&V.sheet.kind==="gymlog"&&AUTH.state==="in"&&DB.gym.logs[V.sheet.ds];
  if(!log){
    if(root){stopVideo(root);root.remove();}
    clearInterval(PL.clock);PL.clock=null;PL.mkey="";
    if(PL.wake){try{PL.wake.release();}catch(e){}PL.wake=null;}
    return;
  }
  var sh=V.sheet;if(sh.i==null)sh.i=firstOpen(log);sh.i=Math.max(0,Math.min(sh.i,log.ex.length-1));
  if(!root){
    root=document.createElement("div");root.id="player";root.setAttribute("role","dialog");root.setAttribute("aria-modal","true");
    root.innerHTML='<div class="plhd" id="plhd"></div><div class="plsc" id="plsc"><div id="plmedia"></div><div class="plmain" id="plmain"></div></div><div class="plft" id="plft"></div>';
    document.body.appendChild(root);
    PL.clock=setInterval(function(){var c=document.getElementById("plclock"),l=V.sheet&&DB.gym.logs[V.sheet.ds];if(c&&l&&!l.t1)c.textContent=fmtClock(Date.now()-l.t0);},1000);
    /* keep the screen on mid-workout */
    try{if(navigator.wakeLock&&!PL.wake)navigator.wakeLock.request("screen").then(function(w){PL.wake=w;}).catch(function(){});}catch(e){}
  }
  document.getElementById("plhd").innerHTML=plHead(log);
  var key=sh.ds+"|"+(sh.list?"list":sh.i+"|"+(sh.vi||0)+"|"+log.ex.length);
  if(key!==PL.mkey){
    var md=document.getElementById("plmedia");stopVideo(md);md.innerHTML=plMedia(log);PL.mkey=key;
    var nv=md.querySelector("video");
    if(nv){nv.addEventListener("error",function(){nv.hidden=true;var m=md.querySelector(".vmsg");if(m)m.hidden=false;});
      nv.addEventListener("click",function(){if(nv.paused)nv.play();else nv.pause();});}
    document.getElementById("plsc").scrollTop=0;
  }
  document.getElementById("plmain").innerHTML=plMain(log);
  document.getElementById("plft").innerHTML=plFoot(log);
}
/* a block's steps, grouped by movement: thumbnail (tap to play) + "1 · 12, 10 reps · cue" lines */
function vidBtn(v,n,cls){return v?'<button class="'+(cls||"vthumb")+'" data-act="vid" data-v="'+v+'" data-n="'+esc(n)+'" aria-label="Play demo: '+esc(n)+'">'+
  '<img src="/media/ex/'+v+'.jpg" alt="" loading="lazy" onerror="this.remove()">'+IC("play")+'</button>':'';}
function stepsHtml(ex,bare){
  var groups=[],rows=blockRows(ex),i=0;
  ex.st.forEach(function(s){var g=groups[groups.length-1],x=s.x||1;
    if(!g||g.n!==s.n||g.v!==s.v){g={n:s.n,v:s.v,lines:[],alt:null};groups.push(g);}
    if(s.alt&&!g.alt)g.alt=s.alt;
    g.lines.push({k:labRange(rows[i]&&rows[i].k,rows[i+x-1]&&rows[i+x-1].k),t:[s.r,s.c].filter(Boolean).join(" · ")});i+=x;});
  var one=groups.length===1&&groups[0].n===ex.n,h='<div class="steps">';
  groups.forEach(function(g){
    h+='<div class="stg">'+(bare?'':vidBtn(g.v,g.n))+'<div class="grow">'+(one?'':'<div class="stn">'+esc(g.n)+'</div>');
    g.lines.forEach(function(l){if(l.k||l.t)h+='<div class="stl">'+(l.k?'<span class="k">'+esc(l.k)+'</span>':'')+'<span>'+esc(l.t)+'</span></div>';});
    if(g.alt)h+='<button class="stalt" data-act="vid" data-v="'+g.alt.v+'" data-n="'+esc(g.alt.n)+'"'+(g.alt.v?'':' disabled')+'>Or swap in: '+esc(g.alt.n)+(g.alt.v?IC("play"):'')+'</button>';
    h+='</div></div>';});
  return h+'</div>';
}
/* demo player: lives outside the app's render tree so ticking sets never restarts the clip */
function openVid(v,n){
  if(!v)return;
  var el=document.getElementById("vbox");
  if(!el){el=document.createElement("div");el.id="vbox";el.setAttribute("role","dialog");el.setAttribute("aria-modal","true");document.body.appendChild(el);
    el.addEventListener("click",function(ev){if(ev.target===el||ev.target.closest("[data-vclose]"))closeVid();});}
  el.innerHTML='<div class="vcard"><div class="vhd"><b>'+esc(n||"Demo")+'</b><button class="sx" data-vclose aria-label="Close video">'+IC("x")+'</button></div>'+
    '<video src="/media/ex/'+v+'.mp4" poster="/media/ex/'+v+'.jpg" playsinline muted loop autoplay controls preload="auto"></video>'+
    '<div class="vmsg" hidden>This video needs a connection and a signed-in account.</div></div>';
  var vd=el.querySelector("video");
  vd.addEventListener("error",function(){vd.hidden=true;el.querySelector(".vmsg").hidden=false;});
  el.classList.add("on");
}
function closeVid(){var el=document.getElementById("vbox");if(!el||!el.classList.contains("on"))return;
  var vd=el.querySelector("video");if(vd){vd.pause();vd.removeAttribute("src");vd.load();}
  el.classList.remove("on");el.innerHTML="";}
document.addEventListener("keydown",function(ev){if(ev.key==="Escape")closeVid();
  if(ev.key==="Enter"&&ev.target&&ev.target.id==="authcode"){ev.preventDefault();sendCode();}
  if(ev.key==="Enter"&&ev.target&&ev.target.id==="authmail"){ev.preventDefault();sendLink();}});
/* the code box submits itself once all 6 digits are in (iOS fills it from Mail) */
document.addEventListener("input",function(ev){if(ev.target&&ev.target.id==="authcode"&&ev.target.value.replace(/\D/g,"").length===6&&!AUTH.cbusy)sendCode();});
