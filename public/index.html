function gymPickAdd(x){
  var sh=V.sheet,back=sh.back;
  if(sh.target==="routine"){back.draft.ex.push({n:x.n,m:x.m,e:x.e,sets:3,reps:10,lb:0});}
  else{
    var L=DB.gym.logs[back.ds],last=lastSets(x.n),sets=[];
    for(var i=0;i<3;i++){var ls=last&&last[Math.min(i,last.length-1)];sets.push({reps:ls?ls.reps:10,lb:ls?(ls.lb||0):0,done:false});}
    L.ex.push({n:x.n,m:x.m,sets:sets});save();
    back.i=L.ex.length-1;back.list=false;
  }
  V.sheet=back;render();
}
function syncGRName(){var n=document.getElementById("grname");if(n&&V.sheet&&V.sheet.draft)V.sheet.draft.name=n.value;}
/* ---------------- install + offline ----------------
   Installed (Home Screen) Fuel opens with no connection: the service worker keeps the app,
   localStorage keeps the diary, and demo clips the user saves live in the "fuel-media" cache. */
function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsSet(k,v){try{if(v==null)localStorage.removeItem(k);else localStorage.setItem(k,v);}catch(e){}}
function isStandalone(){try{return navigator.standalone===true||matchMedia("(display-mode: standalone)").matches;}catch(e){return false;}}
function isIOS(){return /iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);}
var INSTALL_PROMPT=null;
window.addEventListener("beforeinstallprompt",function(e){e.preventDefault();INSTALL_PROMPT=e;});
var MEDIA_CACHE="fuel-media",VDL={busy:false,done:0,total:0,bytes:0,err:0,saved:null,pid:null};
function progVideoIds(p){var ids=[],seen={};
  (p&&p.weeks||[]).forEach(function(w){w.sessions.forEach(function(s){s.ex.forEach(function(e){(e.st||[]).forEach(function(x){
    [x.v,x.alt&&x.alt.v].forEach(function(v){if(v&&!seen[v]){seen[v]=1;ids.push(v);}});});});});});
  return ids;}
function countSaved(p){
  if(!("caches" in window)){VDL.saved=0;VDL.pid=p.id;return;}
  var ids=progVideoIds(p);
  caches.open(MEDIA_CACHE).then(function(c){return c.keys();}).then(function(keys){
    var have={},n=0;keys.forEach(function(r){var m=/\/media\/ex\/([A-Za-z0-9]+)\.mp4$/.exec(r.url);if(m)have[m[1]]=1;});
    ids.forEach(function(v){if(have[v])n++;});
    var changed=VDL.saved!==n||VDL.pid!==p.id;VDL.saved=n;VDL.pid=p.id;if(changed&&!VDL.busy)render();
  }).catch(function(){VDL.saved=0;VDL.pid=p.id;});
}
function offlineCard(p){
  var ids=progVideoIds(p);if(!ids.length||!("caches" in window))return "";
  if(VDL.pid!==p.id||VDL.saved==null){if(!VDL.busy)countSaved(p);return "";}
  if(VDL.busy)return '<div class="card"><div class="mealhd"><span class="mt">Saving videos</span><span class="mcal num">'+VDL.done+' of '+VDL.total+'</span></div>'+
    '<div class="calbar" style="height:6px;margin-top:12px"><i style="width:'+Math.round(VDL.done/Math.max(1,VDL.total)*100)+'%;background:linear-gradient(90deg,var(--ring1),var(--ring2))"></i></div>'+
    '<div class="fnote num">'+Math.round(VDL.bytes/1048576)+' MB so far. Keep Fuel open until it finishes.</div></div>';
  if(VDL.saved>=ids.length)return "";
  return '<div class="card"><div class="row" style="gap:12px;align-items:flex-start"><span class="bigic">'+IC("download")+'</span><span class="grow"><b>Watch the demos with no Wi-Fi</b><br>'+
    '<span class="ls">'+(VDL.saved?VDL.saved+' of '+ids.length+' videos are saved on this phone':ids.length+' videos, about '+Math.round(ids.length*0.8)+' MB')+'. Best done on Wi-Fi.</span></span></div>'+
    (VDL.err?'<div class="warn">'+VDL.err+' couldn’t be saved. Check your connection and try again.</div>':'')+
    '<button class="bigbtn ghost" data-act="vsave">'+IC("download")+(VDL.saved?'Save the rest':'Save videos to this phone')+'</button></div>';
}
function saveVideos(){
  var ps=progState(),p=ps&&ps.p;if(!p||VDL.busy||!("caches" in window))return;
  var ids=progVideoIds(p);
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
  VDL.busy=true;VDL.done=0;VDL.total=ids.length;VDL.bytes=0;VDL.err=0;render();
  var last=0;
  caches.open(MEDIA_CACHE).then(function(c){return c.keys().then(function(keys){
    var have={},q=ids.slice();keys.forEach(function(r){have[new URL(r.url).pathname]=1;});
    function one(){var v=q.shift();if(!v)return Promise.resolve();
      var mp="/media/ex/"+v+".mp4",jp="/media/ex/"+v+".jpg";
      return (have[mp]?Promise.resolve():fetch(mp,{credentials:"same-origin"}).then(function(r){
          if(r.status!==200)throw new Error("http "+r.status);
          return r.blob().then(function(b){VDL.bytes+=b.size;return c.put(mp,new Response(b,{headers:{"Content-Type":"video/mp4"}}));});}))
        .then(function(){if(!have[jp])return fetch(jp,{credentials:"same-origin"}).then(function(r){if(r.status===200)return c.put(jp,r);});})
        .catch(function(){VDL.err++;})
        .then(function(){VDL.done++;if(Date.now()-last>500){last=Date.now();if(V.tab==="gym")render();}return one();});}
    return Promise.all([one(),one(),one()]);
  });}).catch(function(){VDL.err=VDL.total;}).then(function(){
    VDL.busy=false;VDL.saved=null;render();
    showUndo(VDL.err?"Saved "+(VDL.total-VDL.err)+" of "+VDL.total+" videos":"Videos saved. They play with no connection now",null);});
}
function dropVideos(){
  if(!("caches" in window))return;
  caches.delete(MEDIA_CACHE).then(function(){VDL.saved=null;render();showUndo("Saved videos removed from this phone",null);});
}
/* what this device can do offline right now: shown in the install sheet so a screenshot says it all */
var OFS=null;
function checkOffline(){
  var ps=progState(),o={standalone:isStandalone(),sw:"serviceWorker" in navigator,ctl:!!(navigator.serviceWorker&&navigator.serviceWorker.controller),
    shell:false,vids:0,need:ps?progVideoIds(ps.p).length:0,used:0,quota:0},jobs=[];
  if("caches" in window){
    jobs.push(caches.keys().then(function(k){o.shell=k.some(function(n){return /^fuel-v/.test(n);});}));
    jobs.push(caches.open(MEDIA_CACHE).then(function(c){return c.keys();}).then(function(k){o.vids=k.filter(function(r){return /\.mp4$/.test(r.url);}).length;}));
  }
  if(navigator.storage&&navigator.storage.estimate)jobs.push(navigator.storage.estimate().then(function(e){o.used=e.usage||0;o.quota=e.quota||0;}));
  Promise.all(jobs.map(function(j){return j.catch(function(){});})).then(function(){OFS=o;if(V.sheet&&V.sheet.kind==="install")rerenderSheet();});
}
function offlineStatusHtml(){
  if(!OFS){checkOffline();return '<div class="ls" style="margin-top:6px">Checking this device…</div>';}
  var o=OFS,mb=function(b){return b>=1073741824?(b/1073741824).toFixed(1)+" GB":Math.round(b/1048576)+" MB";};
  var row=function(a,b,good){return '<div class="kv"><span>'+a+'</span><b'+(good===false?' style="color:var(--amber)"':'')+'>'+b+'</b></div>';};
  return '<div class="card" style="margin-top:6px;padding:2px 16px">'+
    row("Running as",o.standalone?"Home Screen app":"Safari tab")+
    row("App works offline",o.ctl&&o.shell?"Ready":o.sw?"Not yet":"Not supported",o.ctl&&o.shell)+
    (o.need?row("Saved videos",o.vids+" of "+o.need,o.vids>=o.need):"")+
    (o.quota?row("Storage used",mb(o.used)+" of "+mb(o.quota)):"")+'</div>'+
    (!o.ctl||!o.shell?'<div class="fnote">Open Fuel once with a connection, close it, and open it again. That finishes the offline setup.</div>':'');
}
function installBody(){
  var h='';
  if(isStandalone())h+='<div class="okline" style="margin-top:0">Fuel is installed: you’re in the Home Screen app.</div>';
  else if(isIOS())h+='<div class="sub" style="margin-top:0">Add Fuel to your Home Screen and it opens full screen like an app, even with no connection.</div>'+
    '<ol class="steps2">'+
    '<li><span class="n num">1</span><span>Open <b>fuel.ethanzingalis.com</b> in <b>Safari</b>.</span></li>'+
    '<li><span class="n num">2</span><span>Tap the Share button '+IC("share")+' in Safari’s toolbar.</span></li>'+
    '<li><span class="n num">3</span><span>Scroll down, tap <b>Add to Home Screen</b>, then <b>Add</b>.</span></li>'+
    '<li><span class="n num">4</span><span>Open Fuel from your Home Screen and sign in with the <b>6-digit code</b> from the email. The link in the email opens Safari, not the app.</span></li>'+
    '<li><span class="n num">5</span><span>On Wi-Fi, go to the Workout tab and tap <b>Save videos to this phone</b>.</span></li></ol>';
  else h+=INSTALL_PROMPT?'<button class="bigbtn" style="margin-top:0" data-act="instgo">'+IC("download")+'Install Fuel</button>':
    '<div class="sub" style="margin-top:0">On iPhone: open this site in Safari, tap Share, then Add to Home Screen. On Android: open the browser menu and tap Install app.</div>';
  h+='<div class="flabel">This device</div>'+offlineStatusHtml();
  h+='<div class="flabel">What works offline</div><div class="ls" style="line-height:1.5">Your diary, workouts, the exercise library, and any videos you’ve saved. Food search waits for a connection, and everything you log syncs on its own when you’re back online.</div>';
  if(!isStandalone()&&!lsGet("fuelprotocol:installhide"))h+='<div style="text-align:center;margin-top:12px"><button class="textbtn" data-act="insthide">Hide the reminder on the Workout tab</button></div>';
  return h;
}
function progOptsBody(){
  var ps=progState();if(!ps)return '<div class="empty">No program running.</div>';
  var ids=progVideoIds(ps.p),h='<div class="sub" style="margin-top:0">'+esc(ps.p.name)+'</div>';
  if(ids.length&&(VDL.saved==null||VDL.pid!==ps.p.id))countSaved(ps.p);
  h+='<button class="bigbtn ghost" data-act="progview" data-id="'+ps.p.id+'">'+IC("list")+'See every week</button>';
  if(!ps.complete)h+='<div class="flabel">This week</div><div class="pact" style="margin-top:6px"><button class="pillbtn ghost" data-act="progredo">'+IC("redo")+'Redo it</button>'+
    '<button class="pillbtn ghost" data-act="progskip">'+IC("skip")+'Skip it</button>'+
    (ps.a.w>0?'<button class="pillbtn ghost" data-act="progback">'+IC("back")+'Go back a week</button>':'')+'</div>'+
    '<div class="flabel">Jump to</div><select id="progjump">'+ps.p.weeks.map(function(w,i){
      return '<option value="'+i+'"'+(i===ps.a.w?" selected":"")+'>'+esc(weekName(w,i))+'</option>';}).join("")+'</select>';
  if(ids.length&&("caches" in window))h+='<div class="flabel">Videos on this phone</div><div class="ls num">'+(VDL.saved==null?"Checking…":VDL.saved+' of '+ids.length+' saved')+'</div>'+
    (VDL.saved!=null&&VDL.saved<ids.length?'<button class="bigbtn ghost" data-act="vsave">'+IC("download")+'Save videos for offline</button>':
     VDL.saved?'<button class="textbtn danger" style="margin-top:6px" data-act="vdrop">'+IC("trash")+'Remove saved videos</button>':'');
  return h+'<div class="fnote">Every week change can be undone.</div><div style="text-align:center;margin-top:6px"><button class="textbtn danger" data-act="progend">End program</button></div>';
}
var WDL=["S","M","T","W","T","F","S"],WDN=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
function agoText(t){var m=Math.round((Date.now()-t)/60000);return m<1?"just now":m<90?m+" min ago":Math.round(m/60)+" hours ago";}
/* rough length: about 40 s a row plus the rest after each round */
function estMin(ex){var t=0;(ex||[]).forEach(function(e){var rows=e.st?Math.max(1,blockRows(e).length):1,r=e.sets||3;t+=r*rows*40+r*(e.rest||90);});
  return Math.max(5,Math.round(t/300)*5);}
function sessionHero(eyebrow,ses,attrs,sub,extra){
  var ex=ses.ex||[],th='',seen={},nv=0;
  ex.forEach(function(e){var v=(exVideos(e)[0]||{}).v;if(v&&!seen[v]){seen[v]=1;
    if(nv<5)th+='<span class="hthumb"><img src="/media/ex/'+v+'.jpg" alt="" loading="lazy" onerror="this.remove()"></span>';nv++;}});
  if(nv>5)th+='<span class="hthumb more num">+'+(nv-5)+'</span>';
  return '<div class="card hero"><div class="eyebrow">'+esc(eyebrow)+'</div><div class="h1 hero-t">'+esc(ses.name)+'</div>'+
    '<div class="ls" style="margin-top:6px">'+(sub?esc(sub)+' · ':'')+ex.length+' exercise'+(ex.length===1?'':'s')+' · about '+estMin(ex)+' min</div>'+
    (th?'<div class="hthumbs">'+th+'</div>':'')+
    '<button class="bigbtn" data-act="gymstart" data-d="'+todayStr()+'" '+attrs+'>'+IC("play")+'Start workout</button>'+(extra||'')+'</div>';
}
function renderGym(){
  var g=DB.gym,today=todayStr(),wd=wdOf(today);
  var h='<div class="wrap"><div class="top"><span class="h1">Workout</span></div>';
  var rt=gymRoutineById(g.week[String(wd)]),log=g.logs[today],ps=progState();
  var pft=!log&&planFor(today);
  if(!isStandalone()&&!lsGet("fuelprotocol:installhide"))h+='<button class="card instbar" data-act="install">'+IC("phone")+
     '<span class="grow"><b>Put Fuel on your iPhone</b><br><span class="ls">Works with no Wi-Fi, videos included</span></span>'+IC("caretr")+'</button>';
  /* 1. the one thing to do today */
  if(log&&!log.t1){
    var dnx=0,dset=0,tset=0;log.ex.forEach(function(ex){if(exDone(ex))dnx++;ex.sets.forEach(function(x){tset++;if(x.done)dset++;});});
    h+='<div class="card hero"><div class="eyebrow">In progress · started '+agoText(log.t0)+'</div><div class="h1 hero-t">'+esc(log.name)+'</div>'+
       '<div class="calbar" style="height:6px;margin-top:14px"><i style="width:'+(tset?Math.round(dset/tset*100):0)+'%;background:linear-gradient(90deg,var(--ring1),var(--ring2))"></i></div>'+
       '<div class="ls num" style="margin-top:8px">'+dnx+' of '+log.ex.length+' exercises · '+dset+' of '+tset+' sets</div>'+
       '<button class="bigbtn" data-act="gymstart" data-d="'+today+'">'+IC("play")+'Continue workout</button></div>';
  }else if(log&&log.t1){var gv=gymVol(log),nx=ps&&!ps.complete&&!ps.weekDone&&ps.wk.sessions[ps.next];
    h+='<div class="card hero"><div class="eyebrow" style="color:var(--green2);display:flex;align-items:center;gap:6px">'+IC("checkcf")+'Done today</div>'+
       '<div class="h1 hero-t">'+esc(log.name)+'</div>'+
       '<div class="ls num" style="margin-top:6px">'+gv.sets+' sets · '+fmtVol(gv.vol)+' lb · '+Math.max(1,Math.round((log.t1-log.t0)/60000))+' min</div>'+
       (nx?'<div class="fnote">Next up: '+esc(nx.name)+'</div>':'')+
       '<button class="bigbtn ghost" data-act="gymstart" data-d="'+today+'">View workout</button></div>';
  }else if(pft){
    h+=sessionHero('Scheduled for today · Week '+(pft.w+1),pft.ses,'data-src="plan"',pft.p.name,'');
  }else if(ps&&ps.complete){
    h+='<div class="card hero"><div class="eyebrow">'+esc(ps.p.name)+'</div><div class="h1 hero-t" style="display:flex;align-items:center;gap:8px">'+IC("trophy")+'Program complete</div>'+
       '<div class="sub" style="margin-top:4px">All '+ps.p.weeks.length+' weeks done.</div>'+
       '<button class="bigbtn" data-act="progrestart">'+IC("redo")+'Run it again from Week 1</button>'+
       '<button class="bigbtn ghost" data-act="progend">Close the program</button></div>';
  }else if(ps&&ps.weekDone){
    h+='<div class="card hero"><div class="eyebrow">'+esc(ps.p.name)+'</div><div class="h1 hero-t" style="display:flex;align-items:center;gap:8px;color:var(--green)">'+IC("checkcf")+'<span style="color:var(--ink)">Week '+(ps.a.w+1)+' done</span></div>'+
       '<div class="sub" style="margin-top:4px">All '+ps.n+' sessions logged.</div>'+
       (ps.a.w+1<ps.p.weeks.length?'<button class="bigbtn" data-act="prognext">'+IC("play")+'Start '+esc(weekName(ps.p.weeks[ps.a.w+1],ps.a.w+1))+'</button>':
        '<button class="bigbtn" data-act="prognext">'+IC("flag")+'Finish the program</button>')+
       '<button class="bigbtn ghost" data-act="progredo">'+IC("redo")+'Redo Week '+(ps.a.w+1)+'</button></div>';
  }else if(ps){
    var si=V.gymSel!=null&&V.gymSel>=0&&V.gymSel<ps.n?V.gymSel:ps.next;
    h+=sessionHero((si===ps.next?"Up next":"You picked")+' · Week '+(ps.a.w+1)+' of '+ps.p.weeks.length+(ps.wk.deload?' · Deload':''),
       ps.wk.sessions[si],'data-src="prog" data-s="'+si+'"',ps.p.name,
       (si!==ps.next?'<div style="text-align:center"><button class="textbtn" data-act="gymsel" data-s="'+ps.next+'">Back to '+esc(ps.wk.sessions[ps.next].name)+'</button></div>':
        rt?'<div style="text-align:center"><button class="textbtn" data-act="gymstart" data-d="'+today+'" data-src="routine">Do '+esc(rt.name)+' instead</button></div>':''));
  }else if(rt){
    h+=sessionHero('Today',{name:rt.name,ex:rt.ex},'','Weights pre-filled from last time','');
  }else{
    var nxt=null,nd=0;
    for(var i=1;i<=7&&!nxt;i++){var cand=gymRoutineById(g.week[String((wd+i)%7)]);if(cand){nxt=cand;nd=i;}}
    h+='<div class="card hero"><div class="eyebrow">Today</div><div class="h1 hero-t">Rest day</div>'+
       (nxt?'<div class="ls" style="margin-top:4px">Next: '+esc(nxt.name)+' '+(nd===1?"tomorrow":"in "+nd+" days")+'</div>':
            '<div class="ls" style="margin-top:4px">Import a program or build a routine below.</div>')+
       '<button class="bigbtn ghost" data-act="gymstart" data-d="'+today+'">Log a workout anyway</button></div>';
  }
  /* 2. the program's week: tap a day to preview it above */
  if(ps&&!ps.complete){
    var pct=Math.round((ps.a.w+(ps.n?ps.done/ps.n:0))/ps.p.weeks.length*100),selSi=V.gymSel!=null&&V.gymSel<ps.n?V.gymSel:ps.next;
    h+='<div class="card"><div class="mealhd"><span class="mt">'+esc(weekName(ps.wk,ps.a.w))+'</span>'+
       '<button class="textbtn" style="padding:0" data-act="progopts">Program'+IC("caretr")+'</button></div>'+
       '<div class="calbar" style="height:6px;margin-top:12px"><i style="width:'+pct+'%;background:linear-gradient(90deg,var(--ring1),var(--ring2))"></i></div>'+
       '<div class="ls num" style="margin-top:8px">'+ps.done+' of '+ps.n+' done this week · '+pct+'% of the program</div><div class="wklist">'+
       ps.wk.sessions.map(function(s2,si2){
         var dn=ps.a.done[ps.a.w+"|"+si2],sel=!log&&!pft&&si2===selSi;
         var inner='<span class="wkdot num'+(dn?" dn":"")+'">'+(dn?IC("check"):(si2+1))+'</span><span class="grow"><span class="ln">'+esc(s2.name)+'</span><br>'+
           '<span class="ls">'+(dn?"Done "+dayLabel(dn):si2===ps.next?"Up next":s2.ex.length+" exercises")+'</span></span>'+(sel?'<span class="tag now">Showing</span>':'');
         return log||pft?'<div class="wkrow">'+inner+'</div>':'<button class="wkrow'+(sel?" on":"")+'" data-act="gymsel" data-s="'+si2+'">'+inner+'</button>';
       }).join("")+'</div>'+
       '<div class="fnote">Missed a day? Do the next one. Tap any day to see it, then start it from the card above.</div></div>';
    h+=offlineCard(ps.p);
  }
  /* scheduled sessions ahead */
  var up=Object.keys(g.plan).filter(function(ds){return ds>=today&&planFor(ds)&&!g.logs[ds];}).sort();
  if(up.length){
    h+='<div class="card"><div class="mealhd"><span class="mt">Coming up</span><span class="mcal">'+up.length+' scheduled</span></div>';
    up.slice(0,7).forEach(function(ds){var pf=planFor(ds);
      h+='<div class="lrow"><span class="grow"><span class="ln">'+esc(pf.ses.name)+' <span class="ls">· Week '+(pf.w+1)+'</span></span><br>'+
         '<span class="ls">'+dayLabel(ds)+' · '+esc(pf.p.name)+'</span></span>'+
         '<button class="sx" data-act="planrm" data-d="'+ds+'" aria-label="Remove from calendar">'+IC("x")+'</button></div>';});
    if(up.length>7)h+='<div class="fnote">'+(up.length-7)+' more after that.</div>';
    h+='</div>';
  }
  /* the week */
  h+='<div class="card"><div class="eyebrow">Your week</div><div class="wkstrip" style="margin-top:10px">';
  for(var wi=0;wi<7;wi++){
    var ds2=dateAdd(today,wi-wd),rr=gymRoutineById(g.week[String(wi)]);
    var done=g.logs[ds2]&&g.logs[ds2].t1;
    h+='<div class="wk'+(wi===wd?" cur":"")+(done?" done":"")+'"><span>'+WDL[wi]+'</span><i>'+(done?IC("check"):(planFor(ds2)&&!g.logs[ds2]?IC("gym"):(rr?esc(rr.name.charAt(0).toUpperCase()):"")))+'</i></div>';
  }
  h+='</div></div>';
  /* muscles trained, last 7 days */
  var mus={};
  for(var mi=0;mi<7;mi++){var ml=g.logs[dateAdd(today,-mi)];
    if(ml)(ml.ex||[]).forEach(function(ex){var n=0;ex.sets.forEach(function(s){if(s.done)n++;});if(n)mus[ex.m]=(mus[ex.m]||0)+n;});}
  var mk=Object.keys(mus).sort(function(a,b){return mus[b]-mus[a];});
  if(mk.length){
    h+='<div class="card"><div class="eyebrow">Muscles · sets in the last 7 days</div><div class="chips" style="margin-top:9px">'+
       mk.map(function(m){return '<span class="chip'+(mus[m]>=10?" grn":"")+'">'+esc(m)+' · '+mus[m]+'</span>';}).join("")+'</div>'+
       '<div class="fnote">Quiet muscles here are the ones going untrained.</div></div>';
  }
  /* routines */
  h+='<div class="reshd">Routines</div>';
  if(!g.routines.length)h+='<div class="card"><div class="empty">No routines yet. Build one (Push, Pull, Legs), pick exercises from the 876-exercise library, and assign weekdays.</div></div>';
  g.routines.forEach(function(r){
    var days=[];for(var di=0;di<7;di++){if(g.week[String(di)]===r.id)days.push(WDN[di]);}
    h+='<button class="card" style="width:100%;display:block;text-align:left" data-act="gymedit" data-id="'+r.id+'">'+
       '<div class="mealhd"><span class="mt">'+esc(r.name)+'</span><span class="mcal num">'+r.ex.length+' exercises</span></div>'+
       '<div class="ls" style="margin-top:6px">'+(days.length?"Trains "+days.join(" · "):"No days assigned")+' · tap to edit</div></button>';
  });
  h+='<button class="bigbtn" data-act="gymnew">'+IC("plus")+'New routine</button>';
  /* programs */
  h+='<div class="reshd">Programs</div>';

function vidId(v){v=String(v==null?"":v);return /^[A-Za-z0-9]{8,80}$/.test(v)?v:"";}
function programDraftFrom(p){
  p=p||{};
  var S=function(v,n){return String(v==null?"":v).trim().slice(0,n);};
  var N=function(v,lo,hi,d){v=Math.round(+v);return isFinite(v)?Math.min(hi,Math.max(lo,v)):d;};
  var A=function(v){return Array.isArray(v)?v:[];};
  var weeks=A(p.weeks).slice(0,26).map(function(w){w=w||{};return{label:S(w.label,40),deload:w.deload===true,repeated:w.repeated===true,
    sessions:A(w.sessions).slice(0,7).map(function(s,si){s=s||{};return{name:S(s.name,40)||"Day "+(si+1),days:[],
      ex:A(s.exercises).slice(0,20).map(function(e){e=e||{};var o={n:S(e.name,80),m:S(e.muscle,20)||"other",
        sets:N(e.sets,1,10,3),reps:N(e.reps,1,100,10),lb:N(e.lb,0,1500,0),target:S(e.target,80),rest:N(e.rest,0,900,0),notes:S(e.notes,140)};
        var st=A(e.steps).slice(0,12).map(function(x){x=x||{};var a=x.alt||{},o2={n:S(x.name,80),v:vidId(x.video),r:S(x.reps,24),c:S(x.note,160),x:N(x.times,1,10,1)};
          if(S(a.name,80))o2.alt={n:S(a.name,80),v:vidId(a.video)};return o2;}).filter(function(x){return x.n;});
        if(st.length)o.st=st;return o;})
        .filter(function(e){return e.n;})};}).filter(function(s){return s.ex.length;})};}).filter(function(w){return w.sessions.length;});
  if(!weeks.length)return null;
  return{id:uid(),name:S(p.program,80)||"Imported program",notes:S(p.notes,500),padded:p.padded===true,src:"pdf",at:Date.now(),weeks:weeks};
}
function progCodeImport(){
  var box=document.getElementById("progcode");
  var code=((box&&box.value)||"").toUpperCase().replace(/[^A-Z2-9]/g,"");
  if(code.length!==8){V.gymMsg={t:"err",m:"Codes are 8 characters. Check it and try again."};render();return;}
  V.gymMsg={t:"ok",m:"Opening…"};render();
  api("/api/plan/shared?code="+code)
   .then(function(r){return r.json().then(function(j){return{ok:r.ok,j:j};});})
   .then(function(res){
     var pl=res.ok&&res.j.plan,d=pl&&pl.kind==="program"?programDraftFrom(pl.program):null;
     if(!d){V.gymMsg={t:"err",m:res.ok?"That code isn’t a workout program. Meal plan codes go in Plans → Import.":"No program found for that code."};render();return;}
     V.gymMsg=null;
     V.sheet={kind:"gymimport",stage:"review",tok:uid(),engine:"chat",truncated:false,open:{0:true},draft:d};render();})
   .catch(function(){V.gymMsg={t:"err",m:"No connection. Try again when you’re online."};render();});
}
var GIMP_ERR={rate:"You’ve used today’s PDF import (1 a day). Try again tomorrow.",too_large:"That PDF is over 10 MB.",
  not_pdf:"That file isn’t a PDF.",empty:"That file is empty.",not_configured:"PDF import isn’t switched on for this app yet.",
  no_workouts:"Couldn’t find a workout program in that PDF.",unreadable:"Couldn’t read the text in that PDF. Scanned or photo PDFs need the Claude reader.",
  refused:"The AI declined to read that document.",too_long:"That program is too long to convert in one go. Try a shorter PDF.",
  signed_out:"Sign in again, then retry.",offline:"No connection. Try again when you’re online."};
var GIMP={timer:null,t0:0};
function gymImport(file){
  V.gymMsg=null;
  if(!file)return;
  if(file.size>10*1024*1024){V.gymMsg={t:"err",m:GIMP_ERR.too_large};render();return;}
  var tok=uid();
  V.sheet={kind:"gymimport",stage:"reading",fname:file.name,tok:tok};render();
  GIMP.t0=Date.now();clearInterval(GIMP.timer);
  GIMP.timer=setInterval(function(){var el=document.getElementById("gimtime");
    if(el)el.textContent=Math.round((Date.now()-GIMP.t0)/1000)+"s";},1000);
  var finish=function(res){
    clearInterval(GIMP.timer);
    if(!V.sheet||V.sheet.tok!==tok)return;
    var pd=res&&res.ok?programDraftFrom(res.program):null;
    if(pd){
      V.sheet={kind:"gymimport",stage:"review",tok:tok,engine:res.engine,truncated:!!res.truncated,open:{0:true},draft:pd};
    }else{
      V.sheet=null;V.gymMsg={t:"err",m:GIMP_ERR[res&&res.error]||"Couldn’t read that PDF. Try again."};
    }
    render();
  };
  api("/api/gym/import",{method:"POST",headers:{"Content-Type":"application/pdf"},body:file})
   .then(function(r){return r.text();})
   .then(function(t){
     var lines=t.split("\n").filter(function(l){return l.trim();}),res=null;
     try{res=JSON.parse(lines[lines.length-1]);}catch(e){}
     finish(res);})
   .catch(function(){finish({error:"offline"});});
}

function rerenderSheet(){

/* -------------- API -------------- */
function checkAPI(){
  var el=document.getElementById("apistat");if(!el)return;
  fetch(API_BASE+"/api/health").then(function(r){return r.json();}).then(function(d){
    var e2=document.getElementById("apistat");if(!e2)return;
    e2.textContent=d.ok?(d.fs?"Connected (FatSecret + OFF)":"Connected (Open Food Facts)"):"Offline";
    e2.style.color=d.ok?"var(--green)":"var(--bad)";
  }).catch(function(){var e2=document.getElementById("apistat");if(e2){e2.textContent="Offline. Library only";e2.style.color="var(--bad)";}});
}
var apiTimer=null;
function scheduleApi(){
  clearTimeout(apiTimer);
  var q=(V.sheet&&V.sheet.query||"").trim();
  if(q.length<2){if(V.sheet)V.sheet.apiResults=[];return;}
  V.sheet.apiBusy=true;V.sheet.apiOffline=false;
  apiTimer=setTimeout(function(){
    fetch(API_BASE+"/api/search?q="+encodeURIComponent(q)+"&max=15").then(function(r){return r.json();}).then(function(d){
      if(V.sheet&&V.sheet.kind==="add"&&(V.sheet.query||"").trim()===q){
        V.sheet.apiResults=d.items||[];V.sheet.apiBusy=false;rerenderSheet();}
    }).catch(function(){if(V.sheet&&V.sheet.kind==="add"){V.sheet.apiBusy=false;V.sheet.apiOffline=true;rerenderSheet();}});
  },350);
}
/* barcode via ZXing on demand */
var zx=null;
function loadZX(){return new Promise(function(res,rej){if(window.ZXing)return res();var s=document.createElement("script");s.src="https://unpkg.com/@zxing/library@0.20.0/umd/index.min.js";s.integrity="sha384-DOP3OlIzNeWpufSZMxZihUYSqCAZFirsVmSAVg8ItvU9ac1FcQF6ZHjQ9CbCznNS";s.crossOrigin="anonymous";s.onload=res;s.onerror=rej;document.head.appendChild(s);});}
function bindScan(){
  var v=document.getElementById("cam");if(!v)return;
  loadZX().then(function(){
    try{zx=new ZXing.BrowserMultiFormatReader();
      zx.decodeFromConstraints({video:{facingMode:{ideal:"environment"}}},v,function(result){
        if(result){var code=result.getText();stopZX();V.sheet.scanning=false;onBarcode(code);}});
    }catch(e){V.sheet.scanMsg="Camera unavailable. Type the number instead.";rerenderSheet();}
  }).catch(function(){V.sheet.scanMsg="Scanner failed to load. Type the number instead.";rerenderSheet();});
}
function stopZX(){try{if(zx)zx.reset();}catch(e){}zx=null;}
function onBarcode(code){
  V.sheet.scanMsg="Looking up "+code+"\u2026";rerenderSheet();
  fetch(API_BASE+"/api/barcode?code="+encodeURIComponent(code)).then(function(r){return r.json();}).then(function(d){
    if(!V.sheet)return;
    if(d.items&&d.items.length){V.sheet.scanned=d.items;V.sheet.query="";V.sheet.scanMsg="";}
    else{V.sheet.scanned=[];V.sheet.scanMsg="No match for "+code+". Try searching by name.";}
    rerenderSheet();
  }).catch(function(){if(V.sheet){V.sheet.scanMsg="Lookup failed. Check your connection.";rerenderSheet();}});
}

/* -------------- event wiring -------------- */
function openAdd(target){V.sheet={kind:"add",target:target,query:"",seg:"recent",apiResults:[],scanned:[],cands:[],pick:null,scanning:false,scanMsg:"",focus:false,full:false};render();}
function commitAdd(def,amt){
  var sh=V.sheet;noteUse(def);
  var e=defToEntry(def,amt);
  if(sh.target.type==="recipe"){sh.back.draft.items.push(e);V.sheet=sh.back;save();render();return;}
  day(V.date).meals[sh.target.meal].push(e);
  save();V.sheet=null;render();
}
document.addEventListener("input",function(ev){
  if(ev.target.id==="ipT"||ev.target.id==="icT"||ev.target.id==="ifT"){
    var gv2=function(id){var n=parseFloat((document.getElementById(id)||{}).value);return isNaN(n)?0:n;};
    var live=Math.round(4*gv2("ipT")+4*gv2("icT")+9*gv2("ifT"));
    var mc1=document.getElementById("maccal");if(mc1)mc1.textContent=live.toLocaleString();
    var mc2=document.getElementById("maccalbtn");if(mc2)mc2.textContent=live.toLocaleString();
    return;
  }
  if(ev.target.id==="gpq"&&V.sheet&&V.sheet.kind==="gympick"){
    V.sheet.q=ev.target.value;
    var gval=ev.target.value;rerenderSheet();
    var gnq=document.getElementById("gpq");
    if(gnq){gnq.value=gval;gnq.focus();gnq.setSelectionRange(gval.length,gval.length);}
    return;
  }
  if(ev.target.id==="foodq"&&V.sheet&&V.sheet.kind==="add"){
    V.sheet.query=ev.target.value;V.sheet.scanned=[];V.sheet.pick=null;
    scheduleApi();
    var sb=document.querySelector(".sbody");
    if(sb){var keep=document.getElementById("foodq");var val=keep.value;
      rerenderSheet();var nq=document.getElementById("foodq");
      if(nq){nq.value=val;nq.focus();nq.setSelectionRange(val.length,val.length);}}
  }
});
document.addEventListener("change",function(ev){
  if(ev.target.id==="pdfin"){var pf=ev.target.files&&ev.target.files[0];ev.target.value="";gymImport(pf);return;}
  if(ev.target.id==="progjump"&&DB.gym.active){var pj=+ev.target.value;if(V.sheet&&V.sheet.kind==="progopts")V.sheet=null;
    if(pj!==DB.gym.active.w)progChange("Jumped to Week "+(pj+1),function(){var a=DB.gym.active;a.hist.push({a:"jump",w:a.w,to:pj,at:Date.now()});a.w=pj;});
    return;}
  if(ev.target.id==="hft"||ev.target.id==="hin"){
    var hf=parseInt((document.getElementById("hft")||{}).value,10)||5,hi2=parseInt((document.getElementById("hin")||{}).value,10)||0;
    DB.profile.heightIn=hf*12+hi2;save();render();return;}
  if(ev.target.id==="daynote"){day(V.date).note=ev.target.value;save();return;}
  var gr=ev.target.getAttribute&&ev.target.getAttribute("data-gr");
  if(gr&&V.sheet&&V.sheet.kind==="gymroutine"){
    var gi=+ev.target.getAttribute("data-i"),gn=parseFloat(ev.target.value);
    if(!isNaN(gn)&&V.sheet.draft.ex[gi])V.sheet.draft.ex[gi][gr]=Math.max(0,Math.round(gn));
    return;}
  var bi=ev.target.getAttribute&&ev.target.getAttribute("data-burn");
  if(bi!=null){var bn=parseFloat(ev.target.value);
    DB.profile.burns[+bi]=(isNaN(bn)||bn<0)?0:Math.round(bn);save();render();return;}
  var f=ev.target.getAttribute&&ev.target.getAttribute("data-set");
  if(!f)return;
  var v=ev.target.value;
  if(f==="sex"){DB.profile.sex=v;}
  else{var n=parseFloat(v);if(!isNaN(n))DB.profile[f]=n;}
  save();render();
});
document.addEventListener("click",function(ev){
  var el=ev.target.closest("[data-act]");if(!el)return;
  var act=el.getAttribute("data-act");
  if(V.sheet&&V.sheet.kind==="progopts"&&/^prog(redo|skip|back|end|next|restart)$/.test(act))V.sheet=null;
  /* account */
  if(act==="authsend"){sendLink();return;}
  if(act==="authcode"){sendCode();return;}
  else if(act==="authback"){AUTH.sent=false;AUTH.pending=false;AUTH.devLink="";AUTH.err="";AUTH.cerr="";AUTH.code="";render();return;}
  else if(act==="signout"){
    api("/api/auth/logout",{method:"POST"}).catch(function(){}).then(function(){
      try{localStorage.removeItem("fuelprotocol:lastuid");localStorage.removeItem("fuelprotocol:lastemail");}catch(e){}
      AUTH={state:"out",email:AUTH.email,uid:"",sent:false,busy:false,err:"",sync:"idle",devLink:""};
      DB=freshDB();LS=null;V={tab:"diary",date:todayStr(),sheet:null};render();});
    return;}
  /* nav + diary */
  if(act==="nav"){V.tab=el.getAttribute("data-v");V.sheet=null;V.gymMsg=null;render();var apEl=document.getElementById("app");if(apEl)apEl.scrollTop=0;}
  else if(act==="undo"){
    if(UNDO.items){
      if(UNDO.gym!=null){DB.gym.active=JSON.parse(UNDO.gym);}
      if(UNDO.gymPlan!=null){DB.gym.plan=JSON.parse(UNDO.gymPlan);}
      UNDO.items.forEach(function(it){var L=day(it.date).meals[it.meal];L.splice(Math.min(it.index,L.length),0,it.entry);});
      if(UNDO.rec&&!(DB.applies||[]).some(function(a){return a.id===UNDO.rec.id;}))planApplies().unshift(UNDO.rec);
      save();hideUndo();render();}}
  else if(act==="dateprev"){V.date=dateAdd(V.date,-1);render();}
  else if(act==="datenext"){V.date=dateAdd(V.date,1);render();}
  else if(act==="datetoday"){V.date=todayStr();render();}
  else if(act==="openadd"){openAdd({type:"meal",meal:el.getAttribute("data-m")});}
  else if(act==="openentry"){
    if(Date.now()<SW.blockUntil)return;
    var m=el.getAttribute("data-m"),id=el.getAttribute("data-id");
    var e=day(V.date).meals[m].filter(function(x){return x.id===id;})[0];
    if(e){V.sheet={kind:"entry",meal:m,entry:e};render();}
  }
  else if(act==="opencal"){var pc=V.date.split("-");V.sheet={kind:"cal",y:+pc[0],m:+pc[1]-1};render();}
  else if(act==="calprev"||act==="calnext"){var mm2=V.sheet.m+(act==="calnext"?1:-1);
    if(mm2<0){mm2=11;V.sheet.y--;}if(mm2>11){mm2=0;V.sheet.y++;}V.sheet.m=mm2;rerenderSheet();}
  else if(act==="calpick"){V.date=el.getAttribute("data-d");V.sheet=null;render();}
  else if(act==="theme"){DB.profile.theme=el.getAttribute("data-v");applyTheme(DB.profile.theme);save();render();}
  else if(act==="macroswap"){DB.profile.macroView=DB.profile.macroView==="g"?"pct":"g";save();render();}
  else if(act==="opencopy"){V.sheet={kind:"copy",target:el.getAttribute("data-m"),src:dateAdd(V.date,-1),srcMeal:el.getAttribute("data-m")};render();}
  else if(act==="cpprev"){V.sheet.src=dateAdd(V.sheet.src,-1);rerenderSheet();}
  else if(act==="cpnext"){V.sheet.src=dateAdd(V.sheet.src,1);rerenderSheet();}
  else if(act==="cpmeal"){V.sheet.srcMeal=el.getAttribute("data-v");rerenderSheet();}
  else if(act==="cpgo"){
    var srcL=(DB.log[V.sheet.src]&&DB.log[V.sheet.src].meals&&DB.log[V.sheet.src].meals[V.sheet.srcMeal])||[];
    srcL.forEach(function(e){var c=JSON.parse(JSON.stringify(e));c.id=uid();day(V.date).meals[V.sheet.target].push(c);});
    save();V.sheet=null;render();}
  else if(act==="copymeal"){
    var mm=el.getAttribute("data-m");
    var src=(DB.log[dateAdd(V.date,-1)]&&DB.log[dateAdd(V.date,-1)].meals[mm])||[];
    src.forEach(function(e){var c=JSON.parse(JSON.stringify(e));c.id=uid();day(V.date).meals[mm].push(c);});
    save();render();
  }
  else if(act==="water"){
    var i=parseInt(el.getAttribute("data-i"),10),d=day(V.date);
    d.water=(d.water===i+1)?i:i+1;save();render();
  }
  /* sheets generic */
  else if(act==="sheetclose"||act==="scrim"){
    if(act==="scrim"&&ev.target.closest("[data-stop]"))return;
    stopZX();closeSheet();
  }
  /* add sheet */
  else if(act==="seg"){V.sheet.seg=el.getAttribute("data-v");rerenderSheet();}
  else if(act==="qclear"){V.sheet.query="";V.sheet.apiResults=[];V.sheet.scanned=[];V.sheet.pick=null;V.sheet.scanMsg="";rerenderSheet();}
  else if(act==="scanback"){V.sheet.scanned=[];V.sheet.scanMsg="";rerenderSheet();}
  else if(act==="scanopen"){V.sheet.scanning=true;V.sheet.scanMsg="";rerenderSheet();}
  else if(act==="scanstop"){stopZX();V.sheet.scanning=false;rerenderSheet();}
  else if(act==="bclookup"){var b=document.getElementById("bcode");if(b&&b.value.trim()){stopZX();V.sheet.scanning=false;onBarcode(b.value.trim());}}
  else if(act==="pick"){var d0=V.sheet.cands[parseInt(el.getAttribute("data-idx"),10)];
    if(d0){V.sheet.pick={def:d0,amt:d0.base};rerenderSheet();}}
  else if(act==="pickinc"||act==="pickdec"){var pk=V.sheet.pick;
    var nv=pk.amt+(act==="pickinc"?pk.def.step:-pk.def.step);
    pk.amt=Math.max(pk.def.step,Math.round(nv*100)/100);rerenderSheet();}
  else if(act==="pickfav"){toggleFav(V.sheet.pick.def);rerenderSheet();}
  else if(act==="pickadd"){commitAdd(V.sheet.pick.def,V.sheet.pick.amt);}
  else if(act==="pickcancel"){V.sheet.pick=null;rerenderSheet();}
  else if(act==="quickadd"){
    var qc=parseFloat((document.getElementById("qcal")||{}).value);
    if(isNaN(qc)||qc<=0)return;
    var g=function(id){var n=parseFloat((document.getElementById(id)||{}).value);return isNaN(n)?0:n;};
    var qn=(document.getElementById("qname")||{}).value||"Quick add";
    commitAdd({name:qn,unit:"x",step:1,base:1,cal:qc,p:g("qp"),c:g("qc"),f:g("qf"),src:"custom"},1);
  }
  else if(act==="cfsave"||act==="cfsaveonly"){
    var gv=function(id){var n=parseFloat((document.getElementById(id)||{}).value);return isNaN(n)?0:n;};
    var nm=((document.getElementById("cfname")||{}).value||"").trim();
    if(!nm)return;
    var unit=(document.getElementById("cfunit")||{}).value||"g";
    var base=gv("cfbase")||(unit==="g"?100:1);
    var def={name:nm,unit:unit,step:unit==="g"?25:(unit==="oz"?1:1),base:base,cal:gv("cfcal"),p:gv("cfp"),c:gv("cfc"),f:gv("cff"),src:"custom"};
    DB.custom.unshift(def);save();
    if(act==="cfsave")commitAdd(def,base);
    else{V.sheet.seg="mine";rerenderSheet();}
  }
  /* entry sheet */
  else if(act==="entinc"||act==="entdec"){var e2=V.sheet.entry;
    var nv2=e2.amt+(act==="entinc"?e2.step:-e2.step);
    e2.amt=Math.max(e2.step,Math.round(nv2*100)/100);save();rerenderSheet();}
  else if(act==="entfav"){toggleFav(V.sheet.entry);rerenderSheet();}
  else if(act==="entdel"){
    var dd=day(V.date),dm=V.sheet.meal,de=V.sheet.entry,di3=-1;
    dd.meals[dm].forEach(function(x,i){if(x.id===de.id)di3=i;});
    dd.meals[dm]=dd.meals[dm].filter(function(x){return x.id!==de.id;});
    save();V.sheet=null;render();
    showUndo("Removed "+de.name,[{date:V.date,meal:dm,entry:de,index:di3<0?0:di3}]);}
  /* recipes */
  else if(act==="newrecipe"){V.sheet={kind:"recipe",draft:{id:uid(),name:"",servings:4,items:[]},editingId:null};render();}
  else if(act==="editrecipe"){var rr=DB.recipes.filter(function(x){return x.id===el.getAttribute("data-id");})[0];
    if(rr){V.sheet={kind:"recipe",draft:JSON.parse(JSON.stringify(rr)),editingId:rr.id};render();}}
  else if(act==="rsrvinc"||act==="rsrvdec"){var dr=V.sheet.draft;
    dr.servings=Math.max(1,dr.servings+(act==="rsrvinc"?1:-1));syncRName();rerenderSheet();}
  else if(act==="raddingr"){syncRName();var back=V.sheet;
    V.sheet={kind:"add",target:{type:"recipe"},back:back,query:"",seg:"recent",apiResults:[],scanned:[],cands:[],pick:null,scanning:false,scanMsg:"",focus:true};render();}
  else if(act==="rdeling"){syncRName();V.sheet.draft.items.splice(parseInt(el.getAttribute("data-i"),10),1);rerenderSheet();}
  else if(act==="rsave"){syncRName();var dr2=V.sheet.draft;
    if(!dr2.name)dr2.name="Untitled recipe";
    if(V.sheet.editingId){DB.recipes=DB.recipes.map(function(x){return x.id===V.sheet.editingId?dr2:x;});}
    else DB.recipes.unshift(dr2);
    save();V.sheet=null;V.tab="recipes";render();}

    dwd.weights=dwd.weights.filter(function(x){return x.t!==wt;});
    if(V.date===todayStr()&&dwd.weights.length)DB.profile.weightLb=dwd.weights[dwd.weights.length-1].w;
    save();render();}
  else if(act==="macroapply"){
    var rd=function(id,fb){var n=parseFloat((document.getElementById(id)||{}).value);return isNaN(n)?fb:n;};
    DB.profile.pT=rd("ipT",DB.profile.pT);DB.profile.cT=rd("icT",DB.profile.cT);DB.profile.fT=rd("ifT",DB.profile.fT);
    DB.profile.calMode="custom";
    DB.profile.calCustom=Math.round(4*DB.profile.pT+4*DB.profile.cT+9*DB.profile.fT);
    save();render();}
  else if(act==="calmode"){DB.profile.calMode=el.getAttribute("data-v");save();render();}
  else if(act==="macromode"){DB.profile.macroMode=el.getAttribute("data-v");save();render();}
  else if(act==="exportdata"){
    var box=document.getElementById("impbox");
    if(box){box.value=JSON.stringify(DB);box.select();
      try{navigator.clipboard.writeText(box.value);}catch(e){}}
  }
  else if(act==="importdata"){
    var box2=document.getElementById("impbox");
    if(box2&&box2.value.trim()){
      try{var o2=JSON.parse(box2.value);Object.keys(DB).forEach(function(k){if(o2[k]!=null)DB[k]=o2[k];});save();render();}
      catch(e){box2.value="Import failed. That isn\u2019t valid exported data.";}
    }
  }
  else if(act==="resetdata"){
    if(el.getAttribute("data-armed")==="1"){localStorage.removeItem(LS);location.reload();}
    else{el.setAttribute("data-armed","1");el.textContent="Tap again to erase everything";}
  }
});
function syncRName(){var n=document.getElementById("rname");if(n&&V.sheet&&V.sheet.draft)V.sheet.draft.name=n.value;}
function syncPBName(){var n=document.getElementById("pbname");if(n&&V.sheet&&V.sheet.draft)V.sheet.draft.name=n.value;}
function pbRenumber(){if(V.sheet&&V.sheet.draft)V.sheet.draft.days.forEach(function(pd,i){pd.name="Day "+(i+1);});}
function closeSheet(){if(V.sheet&&V.sheet.back){V.sheet=V.sheet.back;render();}else{V.sheet=null;render();}}
/* undo toast — one shot, restores exactly what was removed */
var UNDO={items:null,rec:null,gym:null,gymPlan:null,timer:null};
function showUndo(msg,items,rec){
  UNDO.items=items||null;UNDO.rec=rec||null;UNDO.gym=null;UNDO.gymPlan=null;clearTimeout(UNDO.timer);
  var t=document.getElementById("toast"),m=document.getElementById("toastmsg");
  if(m)m.textContent=msg;if(t)t.classList.add("show");
  var ub=t?t.querySelector('[data-act="undo"]'):null;
  if(ub)ub.style.display=items?"":"none";
  UNDO.timer=setTimeout(hideUndo,6000);
}
function hideUndo(){UNDO.items=null;UNDO.rec=null;UNDO.gym=null;UNDO.gymPlan=null;var t=document.getElementById("toast");if(t)t.classList.remove("show");}
function pvShare(){
  var pl=planById(V.sheet.pid);
  if(!pl||pl.builtin)return;
  V.sheet.shareBusy=true;V.sheet.shareErr="";rerenderSheet();
  api("/api/plan/share",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({plan:{name:pl.name,days:pl.days}})})
   .then(function(r){return r.json().then(function(j){return{ok:r.ok,j:j};});})
   .then(function(res){
     if(!V.sheet||V.sheet.kind!=="planview")return;
     V.sheet.shareBusy=false;
     if(res.ok&&res.j.code)V.sheet.shareCode=res.j.code;
     else V.sheet.shareErr=res.j.error==="rate"?"Share limit reached for today. Try tomorrow.":"Couldn’t create a code. Try again.";
     rerenderSheet();})
   .catch(function(){if(V.sheet&&V.sheet.kind==="planview"){V.sheet.shareBusy=false;V.sheet.shareErr="No connection. Try again when you’re online.";rerenderSheet();}});
}
function planImport(){
  var box=document.getElementById("impcode");
  var code=((box&&box.value)||"").toUpperCase().replace(/[^A-Z2-9]/g,"");
  if(code.length!==8){V.planMsg={t:"err",m:"Codes are 8 characters. Check it and try again."};render();return;}
  V.planMsg={t:"ok",m:"Importing…"};render();
  api("/api/plan/shared?code="+code)
   .then(function(r){return r.json().then(function(j){return{ok:r.ok,j:j};});})
   .then(function(res){
     if(res.ok&&res.j.plan&&res.j.plan.kind==="program"){
       V.planMsg={t:"err",m:"That’s a workout program code. Open it from the Workout tab."};render();return;}
     if(res.ok&&res.j.plan){
       /* shared JSON is another user's content — rebuild it field by field */
       var p=res.j.plan,clean={id:uid(),name:String(p.name||"Shared plan").slice(0,60),days:[]};
       (Array.isArray(p.days)?p.days.slice(0,31):[]).forEach(function(pd,i){
         var nd={name:"Day "+(i+1),meals:{bf:[],lu:[],di:[],sn:[]}};
         ["bf","lu","di","sn"].forEach(function(m){
           ((pd&&pd.meals&&Array.isArray(pd.meals[m]))?pd.meals[m].slice(0,40):[]).forEach(function(e){
             nd.meals[m].push({id:uid(),name:String((e&&e.name)||"Food").slice(0,80),unit:String((e&&e.unit)||"x").slice(0,12),
               step:+(e&&e.step)||1,base:+(e&&e.base)||1,amt:+(e&&e.amt)||1,
               cal:+(e&&e.cal)||0,p:+(e&&e.p)||0,c:+(e&&e.c)||0,f:+(e&&e.f)||0,src:"shared",fsid:null});});});
         clean.days.push(nd);});
       if(!clean.days.length){V.planMsg={t:"err",m:"That code’s plan looks empty."};render();return;}
       DB.plans.unshift(clean);save();
       V.planMsg={t:"ok",m:"“"+clean.name+"” imported. It’s in your plans below."};render();
     }else{
       V.planMsg={t:"err",m:res.j.error==="not_found"?"No plan found for that code.":"Couldn’t import. Try again."};render();}
   })
   .catch(function(){V.planMsg={t:"err",m:"No connection. Try again when you’re online."};render();});
}
/* swipe LEFT on a diary entry to remove it — a deliberate, near-full-width pull.
   The delete zone sits on the RIGHT; releasing early snaps back; undo toast after. */
var SW={wrap:null,x:0,y:0,dx:0,active:false,blockUntil:0,w:0};
document.addEventListener("touchstart",function(ev){
  var w=ev.target.closest&&ev.target.closest(".swipewrap");
  if(!w)return;
  SW.wrap=w;SW.x=ev.touches[0].clientX;SW.y=ev.touches[0].clientY;SW.dx=0;SW.active=false;SW.w=w.offsetWidth||320;
},{passive:true});
document.addEventListener("touchmove",function(ev){
  if(!SW.wrap)return;
  var dx=ev.touches[0].clientX-SW.x,dy=ev.touches[0].clientY-SW.y;
  if(!SW.active){
    if(Math.abs(dy)>14&&Math.abs(dy)>Math.abs(dx)){SW.wrap=null;return;}
    if(dx<-12&&Math.abs(dx)>Math.abs(dy)*1.3)SW.active=true;
  }
  if(SW.active&&dx<0){
    SW.dx=dx;
    var en=SW.wrap.querySelector(".entry");
    if(en){en.style.transition="none";en.style.transform="translateX("+Math.max(dx,-SW.w)+"px)";}
    SW.wrap.classList.add("swiping");
    var bg=SW.wrap.querySelector(".swipebg"),p=Math.min(1,-dx/(SW.w*0.7));
    if(bg){bg.style.opacity=Math.min(1,p*1.25);
      bg.textContent=p>=1?"Release to remove":"Keep swiping…";
      bg.classList.toggle("armed",p>=1);}
  }
},{passive:true});
function swReset(){
  if(!SW.wrap)return;
  var en=SW.wrap.querySelector(".entry");
  if(en){en.style.transition="";en.style.transform="";}
  SW.wrap.classList.remove("swiping");
  var bg=SW.wrap.querySelector(".swipebg");if(bg){bg.classList.remove("armed");bg.style.opacity="";}
}
document.addEventListener("touchend",function(){
  if(!SW.wrap)return;
  var wrap=SW.wrap,en=wrap.querySelector(".entry");
  if(SW.active&&-SW.dx>=SW.w*0.7){
    var m=wrap.getAttribute("data-m"),id=wrap.getAttribute("data-id");
    var dd=day(V.date),idx=-1,ent=null;
    dd.meals[m].forEach(function(x,i){if(x.id===id){idx=i;ent=x;}});
    SW.blockUntil=Date.now()+500;
    if(ent){
      if(en){en.style.transition="transform .16s ease";en.style.transform="translateX(-110%)";}
      wrap.style.maxHeight=wrap.offsetHeight+"px";
      requestAnimationFrame(function(){wrap.classList.add("gone");wrap.style.maxHeight="0px";});
      setTimeout(function(){
        dd.meals[m]=dd.meals[m].filter(function(x){return x.id!==id;});
        save();render();
        showUndo("Removed "+ent.name,[{date:V.date,meal:m,entry:ent,index:idx<0?0:idx}]);
      },190);
    }
  }else{swReset();if(SW.active)SW.blockUntil=Date.now()+450;}
  SW.wrap=null;SW.active=false;SW.dx=0;
});
document.addEventListener("touchcancel",function(){swReset();SW.wrap=null;SW.active=false;SW.dx=0;});
/* sheet drag: pull the grab bar / header — up = full screen (add & plan picker), down = close */
var SH={el:null,y0:0,h0:0,dragging:false};
document.addEventListener("touchstart",function(ev){
  var g=ev.target.closest&&ev.target.closest(".sheet .grab, .sheet .shead");
  if(!g)return;var s=g.closest(".sheet");if(!s)return;
  SH.el=s;SH.y0=ev.touches[0].clientY;SH.h0=s.getBoundingClientRect().height;SH.dragging=false;
},{passive:true});
document.addEventListener("touchmove",function(ev){
  if(!SH.el)return;
  var dy=ev.touches[0].clientY-SH.y0;
  if(!SH.dragging&&Math.abs(dy)<8)return;
  SH.dragging=true;SH.el.classList.remove("snap");
  var resizable=V.sheet&&(V.sheet.kind==="add"||V.sheet.kind==="pbpick"||V.sheet.kind==="gympick");
  if(resizable){
    var maxH=window.innerHeight-12,hh=Math.max(140,Math.min(maxH,SH.h0-dy));
    SH.el.style.height=hh+"px";
  }else if(dy>0){SH.el.style.transform="translateY("+dy+"px)";}
},{passive:true});
document.addEventListener("touchend",function(){
  if(!SH.el)return;
  var el2=SH.el,wasDrag=SH.dragging;SH.el=null;SH.dragging=false;
  if(!wasDrag)return;
  var resizable=V.sheet&&(V.sheet.kind==="add"||V.sheet.kind==="pbpick"||V.sheet.kind==="gympick");
  var H=el2.getBoundingClientRect().height,vh=window.innerHeight;
  if(resizable){
    el2.classList.add("snap");el2.style.height="";
    if(H>vh*0.76){V.sheet.full=true;el2.classList.remove("szhalf");el2.classList.add("szfull");rerenderSheet();}
    else if(H<vh*0.34){stopZX();closeSheet();}
    else{V.sheet.full=false;el2.classList.remove("szfull");el2.classList.add("szhalf");rerenderSheet();}
  }else{
    var mt2=/translateY\(([\d.]+)px\)/.exec(el2.style.transform||""),dyv=mt2?+mt2[1]:0;
    if(dyv>110){stopZX();closeSheet();}
    else{el2.style.transition="transform .18s ease";el2.style.transform="";
      setTimeout(function(){el2.style.transition="";},200);}
  }
});
/* bottom spacing follows the tab bar's real height (safe area, text size, 6 tabs) */
function syncTabbar(){var tb=document.querySelector(".tabbar");if(tb)document.documentElement.style.setProperty("--tbh",tb.offsetHeight+"px");}
window.addEventListener("resize",syncTabbar);
var KB={t:null};
function isTyping(el){return el&&(el.tagName==="TEXTAREA"||el.tagName==="SELECT"||(el.tagName==="INPUT"&&!/^(checkbox|radio|button|submit|file)$/i.test(el.type)));}
document.addEventListener("focusin",function(ev){if(!isTyping(ev.target))return;clearTimeout(KB.t);document.body.classList.add("kb");
  var el=ev.target;setTimeout(function(){try{el.scrollIntoView({block:"center",behavior:"smooth"});}catch(e){}},300);});
document.addEventListener("focusout",function(){clearTimeout(KB.t);KB.t=setTimeout(function(){
  if(!isTyping(document.activeElement))document.body.classList.remove("kb");},120);});
/* opens offline from the home screen; data still syncs through /api/state */
if("serviceWorker" in navigator)window.addEventListener("load",function(){navigator.serviceWorker.register("/sw.js").catch(function(){});});
/* back online (or back in the foreground after being offline): reconcile with the server */
function resync(){if(AUTH.state==="in"&&navigator.onLine)pullState().then(function(){paintSync();render();});}
window.addEventListener("online",resync);
window.addEventListener("offline",function(){if(AUTH.state==="in"){AUTH.sync="offline";render();}});
document.addEventListener("visibilitychange",function(){if(document.visibilityState==="visible"&&(AUTH.sync==="offline"||AUTH.sync==="error"))resync();});
boot();
</script>
